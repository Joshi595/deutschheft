lesson: a1.22
sets:
  - title: Clothes and colours
    items:
      - id: cloth1
        type: matching
        tags: [clothes]
        prompt: Match each word with its meaning.
        pairs:
          - { left: die Hose, right: trousers }
          - { left: das Hemd, right: shirt }
          - { left: der Mantel, right: coat }
          - { left: das Kleid, right: dress }
          - { left: der Rock, right: skirt }
          - { left: die Schuhe, right: shoes }
        explanation: "Hose trousers, Hemd shirt, Mantel coat, Kleid dress, Rock skirt, Schuhe shoes."
      - id: cloth2
        type: matching
        tags: [colours]
        prompt: Match each colour with its meaning.
        pairs:
          - { left: rot, right: red }
          - { left: gelb, right: yellow }
          - { left: grün, right: green }
          - { left: schwarz, right: black }
          - { left: weiß, right: white }
          - { left: grau, right: grey }
        explanation: "rot red, gelb yellow, grün green, schwarz black, weiß white, grau grey."
      - id: cloth3
        type: fill-blank
        tags: [clothes, noun gender]
        prompt: "___ Jacke"
        answers: [die]
        explanation: "Jacke ends in -e and is feminine: die Jacke."
      - id: cloth4
        type: fill-blank
        tags: [clothes, noun gender]
        prompt: "___ Pullover"
        answers: [der]
        explanation: "Pullover is masculine: der Pullover."
      - id: cloth5
        type: fill-blank
        tags: [clothes, noun gender]
        prompt: "___ Kleid"
        answers: [das]
        explanation: "Kleid is neuter: das Kleid."
      - id: cloth6
        type: multiple-choice
        tags: [clothes]
        prompt: Die Hose ___ neu.
        options: [ist, sind]
        answer: ist
        explanation: Hose is singular in German.

  - title: gefällt or gefallen?
    items:
      - id: gef1
        type: fill-blank
        tags: [gefallen]
        prompt: "Die Jacke ___ mir."
        answers: [gefällt]
        explanation: "With gefallen, the thing you like is the subject: die Jacke gefällt, and the person is in the dative (mir)."
      - id: gef2
        type: fill-blank
        tags: [gefallen]
        prompt: "Die Schuhe ___ mir nicht."
        answers: [gefallen]
        explanation: Schuhe is plural, so the verb is plural.
      - id: gef3
        type: fill-blank
        tags: [gefallen]
        prompt: "___ dir das Kleid?"
        answers: [Gefällt]
        explanation: "das Kleid is the subject, so the verb is gefällt, and it comes first in the question."
      - id: gef4
        type: multiple-choice
        tags: [gefallen]
        prompt: How do you say "I like the jumper"?
        options:
          - Der Pullover gefällt mir.
          - Ich gefalle den Pullover.
          - Der Pullover gefällt mich.
        answer: Der Pullover gefällt mir.
        explanation: "The thing liked is the subject and the person is dative: Der Pullover gefällt mir."

  - title: The dative pronouns
    items:
      - id: dat1
        type: matching
        tags: [dative pronouns]
        prompt: Match each pronoun with its dative form.
        pairs:
          - { left: ich, right: mir }
          - { left: du, right: dir }
          - { left: er, right: ihm }
          - { left: wir, right: uns }
          - { left: Sie, right: Ihnen }
        explanation: "The dative forms: mir, dir, ihm, uns, Ihnen."
      - id: dat2
        type: fill-blank
        tags: [dative pronouns]
        prompt: "Das Kleid gefällt ___. (she)"
        answers: [ihr]
        explanation: "gefallen takes the dative; the dative of sie (she) is ihr."
      - id: dat3
        type: fill-blank
        tags: [dative pronouns]
        prompt: "Der Mantel gefällt ___ nicht. (he)"
        answers: [ihm]
        explanation: "The dative of er is ihm: Der Mantel gefällt ihm nicht."
      - id: dat4
        type: fill-blank
        tags: [dative pronouns]
        prompt: "Können Sie ___ helfen? (I)"
        answers: [mir]
        explanation: "helfen always takes the dative: Können Sie mir helfen?"
      - id: dat5
        type: fill-blank
        tags: [dative pronouns]
        prompt: "Die Hose passt ___ nicht. (I)"
        answers: [mir]
        explanation: "passen takes the dative: Die Hose passt mir nicht."
      - id: dat6
        type: fill-blank
        tags: [dative pronouns]
        prompt: "Das Kleid steht ___ gut. (you, informal)"
        answers: [dir]
        explanation: "stehen (to suit) takes the dative: Das Kleid steht dir gut."

  - title: welcher and dieser
    items:
      - id: wel1
        type: fill-blank
        tags: [welcher and dieser]
        prompt: "___ Pullover gefällt dir? (welch-)"
        answers: [Welcher]
        explanation: "welch- takes the endings of der/die/das. Pullover is der, so welcher."
      - id: wel2
        type: fill-blank
        tags: [welcher and dieser]
        prompt: "___ Jacke ist neu? (welch-)"
        answers: [Welche]
        explanation: "Jacke is die, so welche."
      - id: wel3
        type: fill-blank
        tags: [welcher and dieser]
        prompt: "___ Hemd ist billig? (welch-)"
        answers: [Welches]
        explanation: "Hemd is das, so welches: the ending matches das."
      - id: wel4
        type: fill-blank
        tags: [welcher and dieser]
        prompt: "___ Schuhe sind schön. (dies-)"
        answers: [Diese]
        explanation: "Schuhe is plural, and dies- takes the plural ending -e: diese."
      - id: wel5
        type: multiple-choice
        tags: [welcher and dieser, accusative]
        prompt: ___ Mantel nehmen Sie?
        options: [Welchen, Welcher, Welches]
        answer: Welchen
        explanation: "The coat is the object, and it is masculine: welchen."

  - title: In the shop
    stimulus:
      kind: audio
      label: Im Kaufhaus
      lines:
        - speaker: Verkäuferin
          text: "Guten Tag. Kann ich Ihnen helfen?"
        - speaker: Kunde
          text: "Ja, bitte. Ich suche eine Jacke."
        - speaker: Verkäuferin
          text: "Welche Größe haben Sie?"
        - speaker: Kunde
          text: "Größe fünfzig. Die blaue hier gefällt mir. Kann ich sie anprobieren?"
        - speaker: Verkäuferin
          text: "Natürlich. Die Umkleidekabine ist dort hinten."
        - speaker: Kunde
          text: "Die Jacke ist leider zu klein. Haben Sie sie in Größe zweiundfünfzig?"
        - speaker: Verkäuferin
          text: "Ja, hier bitte. Sie kostet neunundsechzig Euro."
    items:
      - id: shop1
        type: multiple-choice
        tags: [listening, clothes]
        prompt: Was sucht der Kunde?
        options: [eine Jacke, eine Hose, einen Mantel]
        answer: eine Jacke
        explanation: "The customer says: Ich suche eine Jacke."
      - id: shop2
        type: true-false
        tags: [listening, clothes]
        prompt: Die Jacke in Größe 50 passt gut.
        answer: false
        explanation: It is too small. He asks for size 52.
      - id: shop3
        type: multiple-choice
        tags: [listening, prices]
        prompt: Was kostet die Jacke?
        options: ["69 €", "96 €", "59 €"]
        answer: "69 €"
        explanation: "neunundsechzig: the ones come first, 9 and 60, so 69 €."

  - title: Read the offer
    stimulus:
      kind: text
      label: Anzeige
      title: Modehaus Winter
      text: |
        Diese Woche im Angebot:
        Pullover in Rot, Blau und Grau: 29 €
        Jeans, alle Größen: 39 €
        Schuhe: 20 Prozent billiger
        Montag bis Samstag, 9 bis 19 Uhr
    items:
      - id: offer1
        type: true-false
        tags: [reading, clothes]
        prompt: Es gibt Pullover in Schwarz im Angebot.
        answer: false
        explanation: "The jumpers on offer come in Rot, Blau und Grau, not in black."
      - id: offer2
        type: multiple-choice
        tags: [reading, clothes]
        prompt: Was kostet eine Jeans?
        options: ["39 €", "29 €", "20 €"]
        answer: "39 €"
        explanation: "The offer says: Jeans, alle Größen: 39 €."
      - id: offer3
        type: true-false
        tags: [reading, clothes]
        prompt: Am Sonntag ist das Geschäft geschlossen.
        answer: true
        explanation: "The shop is open Montag bis Samstag, so it is closed on Sunday."

  - title: Say it in German
    items:
      - id: order1
        type: word-order
        tags: [clothes]
        prompt: Can I try the jacket on?
        answer: Kann ich die Jacke anprobieren?
        explanation: "In a question the modal kann comes first, and anprobieren stays whole at the end."
      - id: tr1
        type: translation
        tags: [gefallen]
        prompt: I like the shoes.
        answers:
          - Die Schuhe gefallen mir.
        explanation: "The shoes are the subject of gefallen, and they are plural, so gefallen; the person is mir."
      - id: tr2
        type: translation
        tags: [clothes]
        prompt: The trousers are too small.
        answers:
          - Die Hose ist zu klein.
        explanation: "Hose is singular in German (die Hose), so the verb is ist."
      - id: speak1
        type: speaking-task
        tags: [speaking, clothes]
        prompt: You are in a clothes shop. Say what you are looking for, give your size, ask to try it on, and say whether you like it.
        cards: [suchen, Größe, anprobieren, gefallen]
        phrases:
          - Ich suche einen … / eine … / ein …
          - Ich habe Größe …
          - Kann ich … anprobieren?
          - … gefällt mir (nicht). / … passt mir (nicht).
        checklist:
          - I said what I am looking for
          - I gave a size
          - I asked to try it on
          - I used gefallen or passen with mir
        sample: "Guten Tag. Ich suche einen Pullover. Ich habe Größe vierzig. Kann ich den Pullover anprobieren? Er gefällt mir, aber er passt mir nicht. Er ist zu klein."
