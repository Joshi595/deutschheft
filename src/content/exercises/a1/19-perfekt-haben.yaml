lesson: a1.19
sets:
  - title: Regular participles
    instructions: Write the participle.
    items:
      - id: reg1
        type: fill-blank
        tags: [participles]
        prompt: "machen: ___"
        answers: [gemacht]
        explanation: "Regular verbs make the participle as ge- + stem + -t: ge-mach-t."
      - id: reg2
        type: fill-blank
        tags: [participles]
        prompt: "kaufen: ___"
        answers: [gekauft]
        explanation: "ge- + kauf + -t gives gekauft."
      - id: reg3
        type: fill-blank
        tags: [participles]
        prompt: "lernen: ___"
        answers: [gelernt]
        explanation: "ge- + lern + -t gives gelernt."
      - id: reg4
        type: fill-blank
        tags: [participles]
        prompt: "arbeiten: ___"
        answers: [gearbeitet]
        hint: The stem ends in -t.
        explanation: "The stem arbeit- ends in -t, so an e is added before the ending: gearbeitet."
      - id: reg5
        type: fill-blank
        tags: [participles]
        prompt: "spielen: ___"
        answers: [gespielt]
        explanation: "ge- + spiel + -t gives gespielt."

  - title: Irregular participles
    items:
      - id: irr1
        type: matching
        tags: [participles]
        prompt: Match each verb with its participle.
        pairs:
          - { left: essen, right: gegessen }
          - { left: trinken, right: getrunken }
          - { left: schreiben, right: geschrieben }
          - { left: nehmen, right: genommen }
          - { left: sprechen, right: gesprochen }
          - { left: helfen, right: geholfen }
        explanation: "Irregular participles end in -en and often change the vowel: getrunken, geschrieben, genommen, gesprochen, geholfen."
      - id: irr2
        type: fill-blank
        tags: [participles]
        prompt: "sehen: ___"
        answers: [gesehen]
        explanation: "sehen is irregular: ge- + seh + -en gives gesehen."
      - id: irr3
        type: fill-blank
        tags: [participles]
        prompt: "lesen: ___"
        answers: [gelesen]
        explanation: "lesen: ge- + les + -en gives gelesen."
      - id: irr4
        type: fill-blank
        tags: [participles]
        prompt: "schlafen: ___"
        answers: [geschlafen]
        explanation: "schlafen: ge- + schlaf + -en gives geschlafen."
      - id: irr5
        type: fill-blank
        tags: [participles]
        prompt: "finden: ___"
        answers: [gefunden]
        explanation: "finden changes its vowel: gefunden."

  - title: With ge- or without?
    items:
      - id: ge1
        type: multiple-choice
        tags: [participles, no ge]
        prompt: besuchen
        options: [besucht, gebesucht, begesucht]
        answer: besucht
        explanation: Verbs with be- take no ge-.
      - id: ge2
        type: multiple-choice
        tags: [participles, no ge]
        prompt: studieren
        options: [studiert, gestudiert, studieren]
        answer: studiert
        explanation: Verbs in -ieren take no ge-.
      - id: ge3
        type: multiple-choice
        tags: [participles, separable verbs]
        prompt: einkaufen
        options: [eingekauft, geeinkauft, einkauft]
        answer: eingekauft
        explanation: In a separable verb, ge- goes in the middle.
      - id: ge4
        type: multiple-choice
        tags: [participles, separable verbs]
        prompt: anrufen
        options: [angerufen, geanrufen, anruft]
        answer: angerufen
        explanation: "In separable verbs, ge- goes between the prefix and the verb: an-ge-rufen."
      - id: ge5
        type: multiple-choice
        tags: [participles, no ge]
        prompt: verstehen
        options: [verstanden, geverstanden, vergestanden]
        answer: verstanden
        explanation: "Verbs starting with ver-, be-, er- or ent- take no ge-: verstanden."
      - id: ge6
        type: multiple-choice
        tags: [participles, no ge]
        prompt: bezahlen
        options: [bezahlt, gebezahlt, bezahlen]
        answer: bezahlt
        explanation: "be- verbs take no ge-: bezahlen → bezahlt."

  - title: The right form of haben
    items:
      - id: haben1
        type: fill-blank
        tags: [perfect tense]
        prompt: "Ich ___ gestern Deutsch gelernt."
        answers: [habe]
        explanation: "In the Perfekt, haben takes the normal present form: ich habe … gelernt."
      - id: haben2
        type: fill-blank
        tags: [perfect tense]
        prompt: "Was ___ du am Wochenende gemacht?"
        answers: [hast]
        explanation: "With du, haben is hast: Was hast du … gemacht?"
      - id: haben3
        type: fill-blank
        tags: [perfect tense]
        prompt: "Er ___ lange gearbeitet."
        answers: [hat]
        explanation: "With er, haben is hat: Er hat lange gearbeitet."
      - id: haben4
        type: fill-blank
        tags: [perfect tense]
        prompt: "Wir ___ Pizza gegessen."
        answers: [haben]
        explanation: "With wir, haben stays haben: Wir haben Pizza gegessen."

  - title: Build the sentence
    instructions: Put the words in the right order. The participle goes to the end.
    items:
      - id: order1
        type: word-order
        tags: [perfect tense, word order]
        prompt: I bought a book yesterday.
        answer: Ich habe gestern ein Buch gekauft.
        explanation: "haben is in second place and the participle gekauft goes to the very end."
      - id: order2
        type: word-order
        tags: [perfect tense, word order]
        prompt: Have you seen the film?
        answer: Hast du den Film gesehen?
        explanation: "In a yes/no question, haben comes first and the participle gesehen goes to the end."
      - id: order3
        type: word-order
        tags: [perfect tense, word order]
        prompt: Yesterday we watched TV.
        answer: Gestern haben wir ferngesehen.
        explanation: "Gestern takes first place, so haben comes second, then wir, and ferngesehen goes to the end."
      - id: order4
        type: word-order
        tags: [perfect tense, word order]
        prompt: I did not understand that.
        answer: Ich habe das nicht verstanden.
        explanation: "nicht goes before the participle at the end: … das nicht verstanden."

  - title: From present to past
    instructions: Rewrite the sentence in the Perfekt.
    items:
      - id: past1
        type: translation
        tags: [perfect tense]
        prompt: "Ich kaufe Brot."
        answers: [Ich habe Brot gekauft.]
        explanation: "Perfekt = present form of haben + participle at the end: Ich habe Brot gekauft."
      - id: past2
        type: translation
        tags: [perfect tense]
        prompt: "Sie liest die Zeitung. [she]"
        answers: [Sie hat die Zeitung gelesen.]
        explanation: "sie (she) takes hat; lesen has the irregular participle gelesen."
      - id: past3
        type: translation
        tags: [perfect tense]
        prompt: "Wir besuchen Anna."
        answers: [Wir haben Anna besucht.]
        explanation: "besuchen starts with be-, so its participle has no ge-: besucht."
      - id: past4
        type: translation
        tags: [perfect tense]
        prompt: "Er ruft seine Mutter an."
        answers: [Er hat seine Mutter angerufen.]
        explanation: "anrufen is separable, so ge- goes in the middle: angerufen."

  - title: What happened?
    stimulus:
      kind: audio
      label: Am Montag im Büro
      lines:
        - speaker: Jan
          text: "Hallo Sara! Was hast du am Wochenende gemacht?"
        - speaker: Sara
          text: "Am Samstag habe ich eingekauft und für meine Freunde gekocht. Am Sonntag habe ich lange geschlafen und ein Buch gelesen. Und du?"
        - speaker: Jan
          text: "Ich habe am Samstag gearbeitet. Am Sonntag habe ich meine Eltern besucht."
    items:
      - id: listen1
        type: true-false
        tags: [listening, perfect tense]
        prompt: Sara hat am Samstag gekocht.
        answer: true
        explanation: "Sara says: Am Samstag habe ich eingekauft und für meine Freunde gekocht."
      - id: listen2
        type: multiple-choice
        tags: [listening, perfect tense]
        prompt: Was hat Sara am Sonntag gemacht?
        options:
          - Sie hat lange geschlafen und gelesen.
          - Sie hat eingekauft.
          - Sie hat ihre Eltern besucht.
        answer: Sie hat lange geschlafen und gelesen.
        explanation: "Sara: Am Sonntag habe ich lange geschlafen und ein Buch gelesen."
      - id: listen3
        type: true-false
        tags: [listening, perfect tense]
        prompt: Jan hat am Samstag seine Eltern besucht.
        answer: false
        explanation: He worked on Saturday and visited his parents on Sunday.

  - title: Say and write it
    items:
      - id: tr1
        type: translation
        tags: [perfect tense]
        prompt: What did you do yesterday? (informal)
        answers:
          - Was hast du gestern gemacht?
        explanation: "Ask with Was, then hast du, then the time, and the participle gemacht at the end."
      - id: tr2
        type: translation
        tags: [perfect tense]
        prompt: I have not eaten yet.
        answers:
          - Ich habe noch nicht gegessen.
        explanation: "'Not yet' is noch nicht, and it goes before the participle: noch nicht gegessen."
      - id: write1
        type: writing-task
        tags: [writing, perfect tense]
        prompt: Write four sentences about what you did last weekend. Use only verbs that take haben.
        points:
          - Something you did on Saturday
          - Something you ate or drank
          - Someone you met, visited or phoned
          - Something you did on Sunday
        minWords: 25
        phrases:
          - Am Samstag habe ich …
          - Ich habe … gegessen / getrunken.
          - Ich habe … getroffen / besucht / angerufen.
          - Am Sonntag habe ich …
        sample: "Am Samstag habe ich eingekauft und die Wohnung aufgeräumt. Am Abend habe ich mit Freunden Pizza gegessen. Am Sonntag habe ich lange geschlafen. Dann habe ich meine Eltern angerufen und ein Buch gelesen."
