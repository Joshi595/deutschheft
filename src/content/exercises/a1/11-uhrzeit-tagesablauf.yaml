lesson: a1.11
sets:
  - title: Official time
    instructions: Choose the time that matches.
    items:
      - id: off1
        type: multiple-choice
        tags: [time]
        prompt: vierzehn Uhr dreißig
        options: ["14:30", "4:13", "14:13"]
        answer: "14:30"
        explanation: "Official times use the 24-hour clock: hours, then minutes. vierzehn Uhr dreißig is 14:30."
      - id: off2
        type: multiple-choice
        tags: [time]
        prompt: neun Uhr fünfzehn
        options: ["9:15", "9:50", "19:15"]
        answer: "9:15"
        explanation: "neun Uhr fünfzehn: the hour first, then the minutes, so 9:15."
      - id: off3
        type: multiple-choice
        tags: [time]
        prompt: achtzehn Uhr fünfundvierzig
        options: ["18:45", "18:54", "8:45"]
        answer: "18:45"
        explanation: "achtzehn Uhr fünfundvierzig is 18:45. In fünfundvierzig the ones come before the tens."

  - title: Everyday time
    instructions: Careful with halb.
    items:
      - id: day1
        type: multiple-choice
        tags: [time, halb]
        prompt: halb vier
        options: ["3:30", "4:30", "4:00"]
        answer: "3:30"
        explanation: halb names the hour that is coming.
      - id: day2
        type: multiple-choice
        tags: [time]
        prompt: Viertel nach acht
        options: ["8:15", "7:45", "8:45"]
        answer: "8:15"
        explanation: "Viertel nach means a quarter past: Viertel nach acht is 8:15."
      - id: day3
        type: multiple-choice
        tags: [time]
        prompt: Viertel vor zehn
        options: ["9:45", "10:15", "10:45"]
        answer: "9:45"
        explanation: "Viertel vor means a quarter to: Viertel vor zehn is 9:45."
      - id: day4
        type: multiple-choice
        tags: [time, halb]
        prompt: halb eins
        options: ["12:30", "1:30", "12:00"]
        answer: "12:30"
        explanation: "halb counts towards the next hour: halb eins is half an hour before one, so 12:30."
      - id: day5
        type: multiple-choice
        tags: [time]
        prompt: zehn nach sieben
        options: ["7:10", "6:50", "10:07"]
        answer: "7:10"
        explanation: "nach means 'past': zehn nach sieben is ten past seven, 7:10."
      - id: day6
        type: fill-blank
        tags: [time, halb]
        prompt: "6:30 = halb ___"
        answers: [sieben]
        explanation: "halb points to the coming hour: 6:30 is halfway to seven, so halb sieben."
      - id: day7
        type: fill-blank
        tags: [time]
        prompt: "5:15 = Viertel ___ fünf"
        answers: [nach]
        explanation: "Fifteen minutes after the hour is Viertel nach: Viertel nach fünf."
      - id: day8
        type: fill-blank
        tags: [time]
        prompt: "5:45 = Viertel ___ sechs"
        answers: [vor]
        explanation: "Fifteen minutes before the hour is Viertel vor: 5:45 is Viertel vor sechs."

  - title: Listen for the time
    instructions: Announcements use the official way.
    items:
      - id: hear1
        type: multiple-choice
        tags: [listening, time]
        stimulus:
          kind: audio
          label: Durchsage am Bahnhof
          lines:
            - text: "Achtung, bitte! Der Zug nach München fährt heute um sechzehn Uhr zwanzig."
        prompt: Wann fährt der Zug nach München?
        options: ["16:20", "6:20", "16:12"]
        answer: "16:20"
        explanation: "The announcement says sechzehn Uhr zwanzig: 16 hours, 20 minutes."
      - id: hear2
        type: multiple-choice
        tags: [listening, time]
        stimulus:
          kind: audio
          label: Anrufbeantworter
          lines:
            - text: "Hallo Tom, hier ist Anna. Der Film fängt um halb acht an. Kommst du mit?"
        prompt: Wann fängt der Film an?
        options: ["19:30", "20:30", "8:00"]
        answer: "19:30"
        explanation: "halb acht is 7:30, and in the evening that is 19:30."
      - id: hear3
        type: multiple-choice
        tags: [listening, days]
        stimulus:
          kind: audio
          label: Ansage
          lines:
            - text: "Guten Tag. Die Praxis Doktor Weber ist von Montag bis Donnerstag von acht bis siebzehn Uhr geöffnet. Am Freitag ist die Praxis geschlossen."
        prompt: Wann ist die Praxis geschlossen?
        options: [am Freitag, am Donnerstag, am Montag]
        answer: am Freitag
        explanation: "The practice is open Monday to Thursday; am Freitag ist die Praxis geschlossen."

  - title: um, am or von … bis?
    items:
      - id: prep1
        type: fill-blank
        tags: [time prepositions]
        prompt: "Der Kurs beginnt ___ neun Uhr."
        answers: [um]
        explanation: "For a time on the clock, German uses um: um neun Uhr."
      - id: prep2
        type: fill-blank
        tags: [time prepositions]
        prompt: "___ Samstag arbeite ich nicht."
        answers: [Am]
        explanation: "For days, German uses am: am Samstag, am Montag."
      - id: prep3
        type: fill-blank
        tags: [time prepositions]
        prompt: "___ Abend sehe ich fern."
        answers: [Am]
        explanation: "Parts of the day also take am: am Morgen, am Abend. Only die Nacht is in der Nacht."
      - id: prep4
        type: fill-blank
        tags: [time prepositions]
        prompt: "Ich arbeite von acht ___ sechzehn Uhr."
        answers: [bis]
        explanation: "From … to … is von … bis …: von acht bis sechzehn Uhr."
      - id: prep5
        type: matching
        tags: [days]
        prompt: Match each day with its English name.
        pairs:
          - { left: Dienstag, right: Tuesday }
          - { left: Donnerstag, right: Thursday }
          - { left: Mittwoch, right: Wednesday }
          - { left: Samstag, right: Saturday }
          - { left: Sonntag, right: Sunday }
        explanation: "Mittwoch means 'mid-week'. Most other days end in -tag; Donnerstag is named after the god Donar (Thor)."

  - title: Separable verbs
    instructions: Put the words in the right order. The prefix goes to the end.
    items:
      - id: sep1
        type: word-order
        tags: [separable verbs]
        prompt: I get up at seven o'clock.
        answer: Ich stehe um sieben Uhr auf.
        explanation: "aufstehen is separable: stehe comes second and auf goes to the very end."
      - id: sep2
        type: word-order
        tags: [separable verbs]
        prompt: We go shopping on Saturday.
        answer: Wir kaufen am Samstag ein.
        explanation: "einkaufen splits: kaufen comes second and ein goes to the end of the sentence."
      - id: sep3
        type: word-order
        tags: [separable verbs]
        prompt: When does the film start?
        answer: Wann fängt der Film an?
        explanation: "anfangen splits: fängt comes after the question word and an goes to the end."
      - id: sep4
        type: fill-blank
        tags: [separable verbs]
        prompt: "Sie ruft ihre Mutter ___. (anrufen)"
        answers: [an]
        explanation: "anrufen splits in a main clause: ruft is second, an goes to the end."
      - id: sep5
        type: fill-blank
        tags: [separable verbs]
        prompt: "Am Abend sehe ich ___. (fernsehen)"
        answers: [fern]
        explanation: "fernsehen splits: sehe comes second, fern goes to the end."
      - id: sep6
        type: multiple-choice
        tags: [separable verbs]
        prompt: Which sentence is correct?
        options:
          - Ich stehe um sechs Uhr auf.
          - Ich aufstehe um sechs Uhr.
          - Ich stehe auf um sechs Uhr.
        answer: Ich stehe um sechs Uhr auf.
        explanation: "The prefix auf goes to the very end, after the time: Ich stehe um sechs Uhr auf."

  - title: Say and write it
    items:
      - id: tr1
        type: translation
        tags: [time]
        prompt: What time is it?
        answers:
          - Wie spät ist es?
          - Wie viel Uhr ist es?
        explanation: "German asks 'how late is it?': Wie spät ist es? Wie viel Uhr ist es? means the same."
      - id: tr2
        type: translation
        tags: [time, halb]
        prompt: It is half past three. (everyday way)
        answers: [Es ist halb vier.]
        explanation: "halb looks to the next hour: 3:30 is halb vier."
      - id: tr3
        type: translation
        tags: [time prepositions]
        prompt: On Monday I work.
        answers:
          - Am Montag arbeite ich.
          - Ich arbeite am Montag.
        explanation: "Days take am. If Am Montag comes first, the verb arbeite still comes second, before ich."
      - id: write1
        type: writing-task
        tags: [writing, daily routine]
        prompt: Describe your day in four or five sentences.
        points:
          - When you get up
          - When you work or study
          - What you do in the afternoon or evening
          - When you go to bed
        minWords: 25
        phrases:
          - Ich stehe um … Uhr auf.
          - Ich arbeite von … bis … Uhr.
          - Am Nachmittag / Am Abend …
          - Um … Uhr gehe ich ins Bett.
        sample: "Ich stehe um halb sieben auf. Um sieben Uhr frühstücke ich. Ich arbeite von acht bis sechzehn Uhr. Am Nachmittag kaufe ich ein. Am Abend sehe ich fern. Um elf Uhr gehe ich ins Bett."
