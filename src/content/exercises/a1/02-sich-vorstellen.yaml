lesson: a1.02
sets:
  - title: The right verb form
    instructions: Put the verb in brackets into the right form.
    items:
      - id: verb1
        type: fill-blank
        tags: [present tense]
        prompt: "Ich ___ aus Indien. (kommen)"
        answers: [komme]
        explanation: "With ich the verb ends in -e: ich komme, ich wohne, ich heiße."
      - id: verb2
        type: fill-blank
        tags: [present tense]
        prompt: "Woher ___ du? (kommen)"
        answers: [kommst]
        explanation: "With du the verb ends in -st: du kommst, du wohnst."
      - id: verb3
        type: fill-blank
        tags: [present tense]
        prompt: "Er ___ in Berlin. (wohnen)"
        answers: [wohnt]
        explanation: "With er, sie and es the verb ends in -t: er wohnt, sie kommt."
      - id: verb4
        type: fill-blank
        tags: [present tense]
        prompt: "Wo ___ Sie? (wohnen)"
        answers: [wohnen]
        explanation: The formal Sie takes the -en form.
      - id: verb5
        type: fill-blank
        tags: [present tense]
        prompt: "Wie ___ du? (heißen)"
        answers: [heißt]
        explanation: "The stem heiß- already ends in an s-sound, so du adds only -t."
      - id: verb6
        type: fill-blank
        tags: [present tense]
        prompt: "Sie ___ Anna. (heißen)"
        answers: [heißt]
        translation: Her name is Anna.
        explanation: "Sie with a verb ending in -t means 'she'. heißen already ends in ß, so it only adds -t: sie heißt."

  - title: The verb sein
    instructions: Complete with a form of sein.
    items:
      - id: sein1
        type: fill-blank
        tags: [sein]
        prompt: "Ich ___ Tom."
        answers: [bin]
        explanation: "sein is irregular. With ich it is bin: ich bin Tom."
      - id: sein2
        type: fill-blank
        tags: [sein]
        prompt: "___ du Anna?"
        answers: [Bist]
        explanation: "With du, sein becomes bist. In a yes/no question the verb comes first: Bist du Anna?"
      - id: sein3
        type: fill-blank
        tags: [sein]
        prompt: "Das ___ Herr Schmidt."
        answers: [ist]
        explanation: "With er, sie, es and das, sein becomes ist: Das ist Herr Schmidt."
      - id: sein4
        type: fill-blank
        tags: [sein]
        prompt: "___ Sie Frau Weber?"
        answers: [Sind]
        explanation: "Formal Sie takes sind, the same form as wir and sie (they): Sind Sie Frau Weber?"

  - title: Which question word?
    items:
      - id: w1
        type: multiple-choice
        tags: [W-questions]
        prompt: ___ heißen Sie?
        options: [Wie, Wo, Woher]
        answer: Wie
        explanation: "Wie asks for a name or a way: Wie heißen Sie? Wo asks for a place, woher for where someone comes from."
      - id: w2
        type: multiple-choice
        tags: [W-questions]
        prompt: ___ kommst du? Aus Spanien.
        options: [Woher, Wo, Wer]
        answer: Woher
        explanation: Origin is asked with woher, not wo.
      - id: w3
        type: multiple-choice
        tags: [W-questions]
        prompt: ___ wohnen Sie? In Hamburg.
        options: [Wo, Woher, Wie]
        answer: Wo
        explanation: "The answer In Hamburg is a place, so the question word is wo (where). Woher asks where someone comes from."
      - id: w4
        type: multiple-choice
        tags: [W-questions]
        prompt: ___ ist das? Das ist Frau Weber.
        options: [Wer, Wie, Wo]
        answer: Wer
        explanation: "Wer asks about a person: Wer ist das? Das ist Frau Weber."
      - id: w5
        type: matching
        tags: [W-questions]
        prompt: Match each question with its answer.
        pairs:
          - { left: Wie heißt du?, right: Ich heiße Paul. }
          - { left: Woher kommst du?, right: Aus Polen. }
          - { left: Wo wohnst du?, right: In Köln. }
          - { left: Welche Sprachen sprichst du?, right: Polnisch und Deutsch. }
        explanation: "Wie asks for the name, woher for the country (aus …), wo for the town (in …), and welche Sprachen for languages."

  - title: aus or in?
    items:
      - id: prep1
        type: fill-blank
        tags: [aus and in]
        prompt: "Ich komme ___ Italien."
        answers: [aus]
        explanation: "For the country or town someone comes from, German uses aus: Ich komme aus Italien."
      - id: prep2
        type: fill-blank
        tags: [aus and in]
        prompt: "Sie wohnt ___ München."
        answers: [in]
        explanation: "For where someone lives now, German uses in: Sie wohnt in München."
      - id: prep3
        type: multiple-choice
        tags: [aus and in]
        prompt: Er kommt ___ Türkei.
        options: [aus der, aus, in]
        answer: aus der
        explanation: "die Türkei is one of the few countries with an article: aus der Türkei."

  - title: Build the sentence
    instructions: Put the words in the right order.
    items:
      - id: order1
        type: word-order
        tags: [W-questions, word order]
        prompt: Where do you come from? (formal)
        answer: Woher kommen Sie?
        hint: Question word first, verb second.
        explanation: "In a question with a question word, the verb comes second: Woher kommen Sie?"
      - id: order2
        type: word-order
        tags: [word order]
        prompt: I speak English and a little German.
        answer: Ich spreche Englisch und ein bisschen Deutsch.
        explanation: "The verb spreche comes second, after ich. The languages follow, joined by und."
      - id: order3
        type: word-order
        tags: [word order]
        prompt: Now I live in Munich.
        answer: Jetzt wohne ich in München.
        explanation: "The sentence starts with Jetzt, so the verb comes next and ich follows it."

  - title: Read and decide
    instructions: Read the text, then say whether each statement is right or wrong.
    stimulus:
      kind: text
      label: Text
      title: Das ist Karim
      text: |
        Hallo! Ich heiße Karim Haddad. Ich komme aus Syrien, aus Damaskus. Jetzt wohne ich in Leipzig.
        Ich spreche Arabisch, Englisch und ein bisschen Deutsch.

        Das ist Elena. Sie kommt aus Spanien und wohnt in Berlin. Sie spricht Spanisch und sehr gut Deutsch.
    items:
      - id: read1
        type: true-false
        tags: [reading]
        prompt: Karim kommt aus Syrien.
        answer: true
        explanation: "The text says: Ich komme aus Syrien, aus Damaskus."
      - id: read2
        type: true-false
        tags: [reading]
        prompt: Karim wohnt in Damaskus.
        answer: false
        explanation: "He comes from Damascus. He lives in Leipzig now: Jetzt wohne ich in Leipzig."
      - id: read3
        type: true-false
        tags: [reading]
        prompt: Elena wohnt in Berlin.
        answer: true
        explanation: "The text says Elena kommt aus Spanien und wohnt in Berlin."
      - id: read4
        type: true-false
        tags: [reading]
        prompt: Elena spricht Arabisch.
        answer: false
        explanation: "Karim speaks Arabic. Elena speaks Spanish and very good German."

  - title: Fill in the form
    instructions: This is the first writing task of the A1 exam. Take the information from the text.
    items:
      - id: form1
        type: form
        tags: [writing, forms]
        prompt: Fill in the form for Maria.
        situation: "Maria Rossi kommt aus Italien. Sie wohnt in München und spricht Italienisch und Englisch."
        fields:
          - { label: Vorname, answers: [Maria] }
          - { label: Familienname, answers: [Rossi] }
          - { label: Land, answers: [Italien] }
          - { label: Wohnort, answers: [München] }
        explanation: "Vorname is the first name, Familienname the surname, Land the country she comes from, and Wohnort the town she lives in."

  - title: Say it in German
    items:
      - id: tr1
        type: translation
        tags: [introducing yourself]
        prompt: What is your name? (formal)
        answers: [Wie heißen Sie?]
        explanation: "Formal questions use Sie, and the verb then has the -en ending: Wie heißen Sie?"
      - id: tr2
        type: translation
        tags: [introducing yourself]
        prompt: I come from India.
        answers: [Ich komme aus Indien.]
        explanation: "Where you come from is aus, plus the country with no article: Ich komme aus Indien."
      - id: tr3
        type: translation
        tags: [introducing yourself]
        prompt: Where do you live? (informal)
        answers: [Wo wohnst du?]
        explanation: "Wo asks for a place. With du the verb ends in -st: Wo wohnst du?"
      - id: tr4
        type: translation
        tags: [introducing yourself]
        prompt: That is Mrs Weber.
        answers: [Das ist Frau Weber.]
        explanation: "Das ist introduces someone, and a woman is addressed or named as Frau plus her surname."

  - title: Write and speak about yourself
    items:
      - id: write1
        type: writing-task
        tags: [writing, introducing yourself]
        prompt: Write four sentences introducing yourself.
        points:
          - Your name
          - Where you come from
          - Where you live now
          - Which languages you speak
        minWords: 15
        phrases:
          - Ich heiße …
          - Ich komme aus …
          - Ich wohne in …
          - Ich spreche … und ein bisschen Deutsch.
        sample: "Ich heiße Karim Haddad. Ich komme aus Syrien. Jetzt wohne ich in Leipzig. Ich spreche Arabisch, Englisch und ein bisschen Deutsch."
      - id: speak1
        type: speaking-task
        tags: [speaking, introducing yourself]
        prompt: "Stellen Sie sich bitte vor. Introduce yourself, using the cue cards."
        cards: [Name?, Land?, Wohnort?, Sprachen?]
        phrases:
          - Ich heiße …
          - Ich komme aus …
          - Ich wohne in …
          - Ich spreche …
        checklist:
          - I said my name with heißen or sein
          - I said where I come from with aus
          - I said where I live with in
          - I named at least one language I speak
        sample: "Guten Tag. Ich heiße Maria Rossi. Ich komme aus Italien. Ich wohne in München. Ich spreche Italienisch, Englisch und ein bisschen Deutsch."
