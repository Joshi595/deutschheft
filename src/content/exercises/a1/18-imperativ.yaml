lesson: a1.18
sets:
  - title: The Sie form
    instructions: Write the request to someone you address as Sie.
    items:
      - id: sie1
        type: translation
        tags: [imperative]
        prompt: Please come! (formal)
        answers:
          - Kommen Sie bitte!
          - Bitte kommen Sie!
        explanation: "The polite imperative is the verb, then Sie: Kommen Sie bitte! bitte makes it a request."
      - id: sie2
        type: word-order
        tags: [imperative]
        prompt: Please speak slowly.
        answer: Sprechen Sie bitte langsam.
        explanation: "Sie imperative: the verb first, then Sie, then bitte and the rest."
      - id: sie3
        type: word-order
        tags: [imperative]
        prompt: Please wait a moment.
        answer: Warten Sie bitte einen Moment.
        explanation: "Verb first, then Sie: Warten Sie bitte einen Moment."
      - id: sie4
        type: word-order
        tags: [imperative, separable verbs]
        prompt: Please fill in the form.
        answer: Füllen Sie bitte das Formular aus.
        explanation: "ausfüllen is separable: Füllen comes first and aus goes to the end."

  - title: The du form
    instructions: Write the imperative for du. One word.
    items:
      - id: du1
        type: fill-blank
        tags: [imperative]
        prompt: "___ bitte her! (kommen)"
        answers: [Komm]
        explanation: "The du imperative is the stem with no du and no -st: kommen → komm."
      - id: du2
        type: fill-blank
        tags: [imperative]
        prompt: "___ bitte die Tür zu. (machen)"
        answers: [Mach]
        explanation: "machen → mach; zumachen is separable, so zu goes to the end."
      - id: du3
        type: fill-blank
        tags: [imperative]
        prompt: "___ bitte einen Moment. (warten)"
        answers: [Warte]
        explanation: A stem ending in -t keeps an -e.
      - id: du4
        type: fill-blank
        tags: [imperative, stem-changing verbs]
        prompt: "___ den Bus! (nehmen)"
        answers: [Nimm]
        explanation: "Verbs with e→i keep the change in the du imperative: du nimmst → nimm!"
      - id: du5
        type: fill-blank
        tags: [imperative, stem-changing verbs]
        prompt: "___ mir bitte das Buch. (geben)"
        answers: [Gib]
        explanation: "geben changes e→i with du (du gibst), so the imperative is gib!"
      - id: du6
        type: fill-blank
        tags: [imperative, stem-changing verbs]
        prompt: "___ langsam! (fahren)"
        answers: [Fahr]
        explanation: Verbs with a → ä lose the umlaut in the imperative.
      - id: du7
        type: fill-blank
        tags: [imperative, stem-changing verbs]
        prompt: "___ bitte den Text. (lesen)"
        answers: [Lies]
        explanation: "lesen changes e→ie (du liest), so the imperative is lies!"
      - id: du8
        type: fill-blank
        tags: [imperative]
        prompt: "___ bitte ruhig! (sein)"
        answers: [Sei]
        explanation: "sein has its own imperative: sei! (Sie: seien Sie!, ihr: seid!)."

  - title: Which form?
    items:
      - id: form1
        type: multiple-choice
        tags: [imperative]
        prompt: You speak to your friend Tom.
        options: [Komm bitte!, Kommen Sie bitte!, Kommt bitte!]
        answer: Komm bitte!
        explanation: "One friend is du, so the imperative is the stem: Komm bitte!"
      - id: form2
        type: multiple-choice
        tags: [imperative]
        prompt: You speak to your children, Lena and Max.
        options: [Kommt bitte!, Komm bitte!, Kommen Sie bitte!]
        answer: Kommt bitte!
        explanation: "Two children are ihr, and the ihr imperative is the ihr form without ihr: Kommt bitte!"
      - id: form3
        type: multiple-choice
        tags: [imperative]
        prompt: You speak to a customer in a shop.
        options: [Kommen Sie bitte!, Komm bitte!, Kommt bitte!]
        answer: Kommen Sie bitte!
        explanation: "A customer is addressed as Sie: Kommen Sie bitte!"
      - id: form4
        type: multiple-choice
        tags: [imperative]
        prompt: Which is correct?
        options: [Nimm den Bus!, Nehm den Bus!, Nimmst den Bus!]
        answer: Nimm den Bus!
        explanation: "nehmen changes to nimmst with du, and the imperative keeps the i: nimm!"
      - id: form5
        type: multiple-choice
        tags: [imperative, separable verbs]
        prompt: Which is correct?
        options:
          - Machen Sie bitte das Fenster auf.
          - Aufmachen Sie bitte das Fenster.
          - Machen Sie auf bitte das Fenster.
        answer: Machen Sie bitte das Fenster auf.
        explanation: "aufmachen is separable: the verb comes first, auf goes to the end."

  - title: Signs and instructions
    items:
      - id: sign1
        type: multiple-choice
        tags: [reading, signs]
        stimulus:
          kind: text
          label: Schild
          text: Bitte nicht rauchen.
        prompt: Was bedeutet das Schild?
        options:
          - Man darf hier nicht rauchen.
          - Man muss hier rauchen.
          - Man kann hier Zigaretten kaufen.
        answer: Man darf hier nicht rauchen.
        explanation: "Bitte nicht rauchen asks you not to smoke, so smoking is not allowed."
      - id: sign2
        type: multiple-choice
        tags: [reading, signs]
        stimulus:
          kind: text
          label: Schild
          text: |
            Anmeldung
            Bitte ziehen Sie eine Nummer und warten Sie.
        prompt: Was müssen Sie machen?
        options:
          - Eine Nummer nehmen und warten.
          - Sofort zur Anmeldung gehen.
          - Ein Formular unterschreiben.
        answer: Eine Nummer nehmen und warten.
        explanation: "The sign asks you to take a number (eine Nummer ziehen) and wait."
      - id: sign3
        type: true-false
        tags: [reading, signs]
        stimulus:
          kind: text
          label: Schild
          text: |
            Achtung!
            Tür bitte immer schließen.
        prompt: Die Tür soll offen bleiben.
        answer: false
        explanation: "Tür bitte immer schließen asks you to always close the door."

  - title: Request and answer
    items:
      - id: ask1
        type: matching
        tags: [requests]
        prompt: Match each request with a fitting answer.
        pairs:
          - { left: Geben Sie mir bitte den Stift., right: "Hier, bitte." }
          - { left: Können Sie das bitte wiederholen?, right: "Ja, natürlich. Noch einmal …" }
          - { left: Haben Sie einen Ausweis?, right: "Ja, einen Moment." }
          - { left: Machen Sie bitte das Fenster zu., right: "Ja, gern. Es ist kalt." }
        explanation: "Hier, bitte goes with handing something over, Ja, natürlich with repeating, Einen Moment with looking for an ID, and Es ist kalt with closing the window."
      - id: ask2
        type: multiple-choice
        tags: [requests]
        prompt: "Someone asks: Können Sie mir bitte helfen? You are happy to. You say:"
        options: ["Ja, gern.", "Nein, danke.", "Bitte nicht."]
        answer: "Ja, gern."
        explanation: "Ja, gern means 'yes, gladly'. Nein, danke would turn down an offer."

  - title: At the office
    stimulus:
      kind: audio
      label: Im Büro
      lines:
        - speaker: Angestellte
          text: "Guten Tag. Nehmen Sie bitte Platz. Füllen Sie bitte das Formular aus und unterschreiben Sie hier unten."
        - speaker: Herr Kaya
          text: "Entschuldigung, können Sie bitte langsam sprechen?"
        - speaker: Angestellte
          text: "Natürlich. Füllen Sie bitte das Formular aus. Und zeigen Sie mir bitte Ihren Ausweis."
    items:
      - id: office1
        type: true-false
        tags: [listening, requests]
        prompt: Herr Kaya soll ein Formular ausfüllen.
        answer: true
        explanation: "The clerk says: Füllen Sie bitte das Formular aus."
      - id: office2
        type: multiple-choice
        tags: [listening, requests]
        prompt: Was sagt Herr Kaya?
        options:
          - Die Frau soll langsam sprechen.
          - Er hat keinen Ausweis.
          - Er möchte gehen.
        answer: Die Frau soll langsam sprechen.
        explanation: "Herr Kaya asks: können Sie bitte langsam sprechen?"
      - id: office3
        type: true-false
        tags: [listening, requests]
        prompt: Die Angestellte möchte den Ausweis sehen.
        answer: true
        explanation: "At the end she says: zeigen Sie mir bitte Ihren Ausweis."

  - title: Now you ask
    items:
      - id: tr1
        type: translation
        tags: [imperative]
        prompt: Please give me the book. (formal)
        answers:
          - Geben Sie mir bitte das Buch.
          - Bitte geben Sie mir das Buch.
        explanation: "Polite imperative: Geben Sie, then mir (to me), then the object das Buch."
      - id: tr2
        type: translation
        tags: [imperative]
        prompt: Do not forget the book! (informal, one person)
        answers:
          - Vergiss das Buch nicht!
        explanation: "vergessen changes e→i (du vergisst), so the du imperative is vergiss! nicht goes at the end."
      - id: speak1
        type: speaking-task
        tags: [speaking, requests]
        prompt: "Speaking exam, part three. For each card make a polite request, as you would to the other candidate."
        cards: [Stift, Tür, Wasser, Buch]
        phrases:
          - Geben Sie mir bitte …
          - Machen Sie bitte … auf / zu.
          - Können Sie mir bitte … geben?
          - Bringen Sie mir bitte …
        checklist:
          - I made one request for each card
          - I used bitte every time
          - A masculine object got den or einen
          - A separable verb had its prefix at the end
        sample: "Geben Sie mir bitte den Stift. Machen Sie bitte die Tür zu. Bringen Sie mir bitte ein Glas Wasser. Können Sie mir bitte das Buch geben?"
