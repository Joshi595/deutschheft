lesson: a1.01
sets:
  - title: The right greeting
    instructions: Choose what you would say.
    items:
      - id: time1
        type: multiple-choice
        tags: [greetings]
        prompt: It is 8 o'clock in the morning. You meet your neighbour, Mrs Weber.
        options: ["Guten Morgen, Frau Weber!", "Guten Abend, Frau Weber!", "Gute Nacht, Frau Weber!"]
        answer: "Guten Morgen, Frau Weber!"
        explanation: "Guten Morgen is the greeting until about 11 o'clock. Guten Abend starts around 6 pm, and Gute Nacht is for going to bed."
      - id: time2
        type: multiple-choice
        tags: [greetings]
        prompt: It is 2 o'clock in the afternoon. You walk into a shop.
        options: [Guten Tag!, Guten Morgen!, Gute Nacht!]
        answer: Guten Tag!
        explanation: "From late morning until early evening you say Guten Tag. Guten Morgen is only for the morning."
      - id: time3
        type: multiple-choice
        tags: [greetings]
        prompt: It is 8 o'clock in the evening. You arrive at a restaurant.
        options: [Guten Abend!, Gute Nacht!, Guten Morgen!]
        answer: Guten Abend!
        explanation: Gute Nacht is only said when someone is going to bed.
      - id: time4
        type: multiple-choice
        tags: [greetings]
        prompt: You leave your friend Tom after coffee.
        options: ["Tschüs, bis bald!", "Auf Wiedersehen, Herr Tom!", "Guten Tag!"]
        answer: "Tschüs, bis bald!"
        explanation: "Tschüs is the informal goodbye between friends. Auf Wiedersehen goes with Herr and Frau, and Guten Tag is a hello."

  - title: What does it mean?
    items:
      - id: match1
        type: matching
        tags: [greetings]
        prompt: Match each expression with its meaning.
        pairs:
          - { left: Guten Abend, right: good evening }
          - { left: Auf Wiedersehen, right: goodbye }
          - { left: Bis morgen, right: see you tomorrow }
          - { left: Entschuldigung, right: excuse me }
          - { left: Tut mir leid, right: I am sorry }
          - { left: Es geht, right: so-so }
        explanation: "Es geht means 'so-so': not good, not bad. Tut mir leid is an apology; Entschuldigung gets someone's attention."

  - title: Formal or informal?
    items:
      - id: formal1
        type: multiple-choice
        tags: [formal and informal]
        prompt: You greet your doctor, Dr Schmidt. How do you ask how he is?
        options: [Wie geht es Ihnen?, Wie geht es dir?, Wie geht's?]
        answer: Wie geht es Ihnen?
        explanation: "With a doctor, a teacher or anyone you call Herr or Frau, you use Sie, so you ask: Wie geht es Ihnen?"
      - id: formal2
        type: multiple-choice
        tags: [formal and informal]
        prompt: You greet your friend Anna. How do you ask how she is?
        options: [Wie geht es dir?, Wie geht es Ihnen?]
        answer: Wie geht es dir?
        explanation: "With friends and family you use du, so the question is Wie geht es dir? Ihnen is the formal form."
      - id: formal3
        type: multiple-choice
        tags: [formal and informal]
        prompt: Which greeting is correct?
        options: ["Guten Tag, Frau Weber.", "Guten Tag, Frau Anna.", "Hallo, Herr Tom."]
        answer: "Guten Tag, Frau Weber."
        explanation: Herr and Frau go with the family name.

  - title: Complete the conversation
    items:
      - id: fill1
        type: fill-blank
        tags: [formal and informal]
        prompt: "Guten Tag, Frau Weber. Wie geht es ___?"
        answers: [Ihnen]
        translation: Hello, Mrs Weber. How are you?
        explanation: "Frau Weber is addressed formally (Sie), so the question ends with Ihnen."
      - id: fill2
        type: fill-blank
        tags: [formal and informal]
        prompt: "Hallo Tom! Wie geht es ___?"
        answers: [dir]
        translation: Hi Tom! How are you?
        explanation: "Tom is a friend, so you use du, and the question ends with dir."
      - id: fill3
        type: fill-blank
        tags: [greetings]
        prompt: "Auf ___, Herr Schmidt!"
        answers: [Wiedersehen]
        translation: Goodbye, Mr Schmidt!
        explanation: "Auf Wiedersehen is the formal goodbye; it literally means 'until we see each other again'."
      - id: cloze1
        type: cloze
        tags: [greetings]
        prompt: Fill the gaps with the words from the list.
        text: "Guten ___, Herr Meier. Wie geht es Ihnen?\nDanke, ___. Und ___?\nAuch gut, danke. Auf ___!"
        gaps:
          - [Tag]
          - [gut]
          - [Ihnen]
          - [Wiedersehen]
        bank: [Tag, gut, Ihnen, Wiedersehen, dir, Nacht]
        explanation: "Herr Meier is addressed with Sie, so it is Und Ihnen?, and the formal goodbye is Auf Wiedersehen."

  - title: How does it sound?
    instructions: Think of the sound rules, then choose.
    items:
      - id: sound1
        type: multiple-choice
        tags: [pronunciation]
        prompt: The w in "Wasser" sounds like the English letter …
        options: [v, w, f]
        answer: v
        explanation: "German w is always said like English v: Wasser sounds like 'vasser'."
      - id: sound2
        type: multiple-choice
        tags: [pronunciation]
        prompt: The v in "Vater" sounds like the English letter …
        options: [f, v, w]
        answer: f
        explanation: "German v usually sounds like English f: Vater sounds like 'fater'."
      - id: sound3
        type: multiple-choice
        tags: [pronunciation]
        prompt: The ei in "nein" sounds like the English word …
        options: [eye, see, say]
        answer: eye
        explanation: "ei = eye, ie = ee. Say the name of the second letter in English."
      - id: sound4
        type: multiple-choice
        tags: [pronunciation]
        prompt: The ie in "wie" sounds like the English …
        options: [ee, eye, eh]
        answer: ee
        explanation: "ie is always a long 'ee' sound, as in wie, Liebe and sieben. ei is the 'eye' sound."
      - id: sound5
        type: multiple-choice
        tags: [pronunciation]
        prompt: The z in "Zeit" sounds like …
        options: [ts, z as in zoo, s]
        answer: ts
        explanation: "German z is always 'ts', as in Zeit, zehn and Pizza."
      - id: sound6
        type: multiple-choice
        tags: [pronunciation]
        prompt: Which word starts with a "sh" sound?
        options: [Sport, Sonne, sehr]
        answer: Sport
        explanation: sp and st at the start of a word are pronounced shp and sht.

  - title: Listen and choose the name
    instructions: Someone spells a name. Which one is it?
    items:
      - id: spell1
        type: multiple-choice
        tags: [alphabet]
        prompt: Which name do you hear?
        stimulus:
          kind: audio
          label: Buchstabieren
          lines:
            - text: "M, Ü, L, L, E, R."
        options: [Müller, Miller, Möller]
        answer: Müller
        explanation: "ü is a sound English does not have: say 'ee' with your lips rounded as for 'oo'."
      - id: spell2
        type: multiple-choice
        tags: [alphabet]
        prompt: Which name do you hear?
        stimulus:
          kind: audio
          label: Buchstabieren
          lines:
            - text: "W, E, B, E, R."
        options: [Weber, Veber, Wiber]
        answer: Weber
        explanation: "W is called veh, and E is called eh."
      - id: spell3
        type: multiple-choice
        tags: [alphabet]
        prompt: Which name do you hear?
        stimulus:
          kind: audio
          label: Buchstabieren
          lines:
            - text: "V, O, G, E, L."
        options: [Vogel, Wogel, Fogel]
        answer: Vogel
        explanation: "V is called fow. It is the letter that sounds like f."

  - title: Build the sentence
    instructions: Put the words in the right order.
    items:
      - id: order1
        type: word-order
        tags: [greetings]
        prompt: Hello, how are you? (formal)
        answer: "Guten Tag, wie geht es Ihnen?"
        explanation: "The greeting comes first, then the question: the verb geht follows the question word wie."
      - id: order2
        type: word-order
        tags: [greetings]
        prompt: Thank you, I am fine.
        answer: "Danke, mir geht es gut."
        explanation: "In mir geht es gut the verb geht is the second element, after mir. Danke stands outside the sentence."

  - title: Say it in German
    items:
      - id: tr1
        type: translation
        tags: [greetings]
        prompt: Good morning!
        answers: [Guten Morgen!]
        explanation: "Guten Morgen is the greeting for the morning, until about 11 o'clock."
      - id: tr2
        type: translation
        tags: [greetings]
        prompt: See you tomorrow!
        answers: [Bis morgen!]
        explanation: "Bis morgen means 'until tomorrow': bis is 'until', morgen is 'tomorrow'."
      - id: tr3
        type: translation
        tags: [greetings]
        prompt: Goodbye! (formal)
        answers: [Auf Wiedersehen!]
        explanation: "Auf Wiedersehen is the formal goodbye; Tschüs is the informal one."
      - id: tr4
        type: translation
        tags: [greetings]
        prompt: Fine, thanks. And you? (formal)
        answers:
          - "Gut, danke. Und Ihnen?"
          - "Danke, gut. Und Ihnen?"
        explanation: "Gut, danke answers the question; Und Ihnen? asks it back in the formal form."

  - title: Now you speak
    items:
      - id: speak1
        type: speaking-task
        tags: [greetings, speaking]
        prompt: You meet your teacher, Frau Weber, in the afternoon. Greet her, ask how she is, answer her question, and say goodbye.
        cards: [Begrüßung, Wie geht es …?, Antwort, Abschied]
        phrases:
          - Guten Tag, Frau …
          - Wie geht es Ihnen?
          - Danke, gut. Und Ihnen?
          - Auf Wiedersehen!
        checklist:
          - I used a formal greeting that fits the time of day
          - I asked how she is with Ihnen, not dir
          - I answered and returned the question
          - I said goodbye formally
        sample: "Guten Tag, Frau Weber! Wie geht es Ihnen? Danke, mir geht es gut. Auf Wiedersehen, bis morgen!"
