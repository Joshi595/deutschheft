lesson: b1.06
sets:
  - title: Which meaning?
    items:
      - id: mean1
        type: matching
        tags: [lassen meanings]
        prompt: Match each sentence with its meaning.
        pairs:
          - { left: Ich lasse mein Auto reparieren., right: have something done }
          - { left: Lass mich ausreden!, right: let / allow }
          - { left: Ich lasse das Handy zu Hause., right: leave }
          - { left: Lass uns gehen!, right: "let's" }
        explanation: "lassen + infinitive can mean having something done or allowing it; on its own it means leave; Lass uns … means let's."
      - id: mean2
        type: true-false
        tags: [lassen meanings]
        prompt: "'Ich lasse mir die Haare schneiden' means that I cut my own hair."
        answer: false
        explanation: "sich die Haare schneiden lassen means having it done by someone else, a hairdresser."

  - title: Forms of lassen
    items:
      - id: form1
        type: fill-blank
        tags: [lassen forms]
        prompt: "Er ___ sein Fahrrad reparieren. (lassen, er)"
        answers: [lässt]
        explanation: "lassen changes a to ä with du and er: er lässt."
      - id: form2
        type: fill-blank
        tags: [lassen forms]
        prompt: "Du ___ mich nie ausreden! (lassen, du)"
        answers: [lässt]
        explanation: "With du: du lässt. The ss of the stem and the -st merge."
      - id: form3
        type: fill-blank
        tags: [lassen forms]
        prompt: "Der Lehrer ___ uns früher gehen. (Präteritum)"
        answers: [ließ]
        explanation: "lassen is irregular in the Präteritum: ließ."
      - id: form4
        type: fill-blank
        tags: [lassen forms]
        prompt: "___ uns ins Kino gehen! (to one friend)"
        answers: [Lass]
        explanation: "The du imperative of lassen is lass: Lass uns … (let's)."

  - title: Do it or have it done?
    items:
      - id: done1
        type: multiple-choice
        tags: [have done]
        prompt: "You take your car to the garage. What do you say?"
        options: ["Ich lasse mein Auto reparieren.", "Ich repariere mein Auto.", "Ich lasse mein Auto zu reparieren."]
        answer: "Ich lasse mein Auto reparieren."
        explanation: "When someone else does the work, use lassen + infinitive: Ich lasse mein Auto reparieren."
      - id: done2
        type: word-order
        tags: [have done]
        prompt: We are having the flat painted.
        answer: "Wir lassen die Wohnung streichen."
        explanation: "lassen + infinitive at the end: Wir lassen die Wohnung streichen."
      - id: done3
        type: word-order
        tags: [have done]
        prompt: I am having my hair cut tomorrow.
        answer: "Ich lasse mir morgen die Haare schneiden."
        explanation: "The dative mir says for whom; morgen comes before die Haare, and schneiden goes last."

  - title: The Perfekt
    items:
      - id: perf1
        type: multiple-choice
        tags: [Perfekt]
        prompt: "Ich habe mein Auto reparieren ___."
        options: [lassen, gelassen]
        answer: lassen
        explanation: "With another infinitive, lassen's Perfekt is the infinitive itself: habe … reparieren lassen."
      - id: perf2
        type: multiple-choice
        tags: [Perfekt]
        prompt: "Ich habe meinen Schirm im Zug ___."
        options: [gelassen, lassen]
        answer: gelassen
        explanation: "On its own (to leave something somewhere), lassen has the normal participle gelassen."
      - id: perf3
        type: word-order
        tags: [Perfekt]
        prompt: I have had my hair cut.
        answer: "Ich habe mir die Haare schneiden lassen."
        explanation: "Two infinitives at the end: schneiden lassen, not gelassen."
      - id: perf4
        type: translation
        tags: [Perfekt]
        prompt: "I left my glasses in the café. (liegen lassen)"
        answers:
          - "Ich habe meine Brille im Café liegen lassen."
        explanation: "liegen lassen means to leave something behind; in the Perfekt both stay infinitives: liegen lassen."

  - title: brauchen … zu
    items:
      - id: br1
        type: multiple-choice
        tags: [brauchen zu]
        prompt: Which sentence is correct in careful German?
        options: ["Du brauchst nicht zu kommen.", "Du brauchst zu kommen.", "Du brauchst nicht um kommen."]
        answer: "Du brauchst nicht zu kommen."
        explanation: "nicht brauchen means 'not have to', and it takes zu + infinitive: Du brauchst nicht zu kommen."
      - id: br2
        type: multiple-choice
        tags: [brauchen zu]
        prompt: "'Sie brauchen keinen Termin zu machen.' What does it mean?"
        options: ["You do not need an appointment.", "You must not make an appointment.", "You need an appointment."]
        answer: "You do not need an appointment."
        explanation: "nicht/keinen … brauchen zu means you do not need to; it is not a ban."
      - id: br3
        type: fill-blank
        tags: [brauchen zu]
        prompt: "Du brauchst mich nur ___. (anrufen, with zu)"
        answers: [anzurufen]
        explanation: "With a separable verb, zu goes between the prefix and the verb: anzurufen."
      - id: br4
        type: translation
        tags: [brauchen zu]
        prompt: "You do not need to pick me up. (use brauchen, du)"
        answers:
          - "Du brauchst mich nicht abzuholen."
        explanation: "brauchen nicht + zu + infinitive: nicht abzuholen, with zu inside the separable verb."

  - title: Moving in
    items:
      - id: cloze1
        type: cloze
        tags: [lassen]
        prompt: Fill in the gaps.
        bank: [lassen, lässt, gelassen, brauchst, Lass, zu]
        text: "– Wir ___ die Küche neu machen, sie ist sehr alt. – Und das Bad? – Das ___ mein Vater streichen. – Soll ich am Samstag helfen? – Nein, du ___ nicht ___ kommen. Aber ___ uns danach zusammen essen gehen! – Gern. Oh, ich habe meine Jacke bei euch ___."
        gaps:
          - [lassen]
          - [lässt]
          - [brauchst]
          - [zu]
          - [Lass]
          - [gelassen]
        explanation: "wir lassen … machen (have done); mein Vater lässt (er form); du brauchst nicht zu kommen; Lass uns …; gelassen (left behind)."

  - title: At the hairdresser's
    stimulus:
      kind: audio
      label: Beim Friseur
      lines:
        - speaker: Friseurin
          text: "Guten Tag! Was darf es sein?"
        - speaker: Kundin
          text: "Ich möchte mir die Haare schneiden lassen, nur fünf Zentimeter. Färben möchte ich sie diesmal nicht."
        - speaker: Friseurin
          text: "Gern. Möchten Sie sie auch waschen lassen?"
        - speaker: Kundin
          text: "Nein, danke, das brauchen Sie nicht zu machen. Ich habe sie heute Morgen gewaschen."
    items:
      - id: listen1
        type: multiple-choice
        tags: [listening]
        prompt: Was lässt die Kundin machen?
        options: ["Haare schneiden", "Haare färben", "Haare waschen"]
        answer: "Haare schneiden"
        explanation: "The customer says: Ich möchte mir die Haare schneiden lassen. She does not want them coloured."
      - id: listen2
        type: true-false
        tags: [listening]
        prompt: Die Friseurin soll die Haare waschen.
        answer: false
        explanation: "She says: das brauchen Sie nicht zu machen. She washed it this morning."
