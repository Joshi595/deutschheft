lesson: b1.02
sets:
  - title: Forming the Plusquamperfekt
    items:
      - id: pqp1
        type: multiple-choice
        tags: [Plusquamperfekt]
        prompt: "Als ich ankam, ___ der Zug schon abgefahren."
        options: [war, hatte, ist]
        answer: war
      - id: pqp2
        type: multiple-choice
        tags: [Plusquamperfekt]
        prompt: "Ich ___ den Film schon gesehen."
        options: [hatte, war, habe]
        answer: hatte
      - id: pqp3
        type: fill-blank
        tags: [Plusquamperfekt]
        prompt: "Sie ___ ihre Schlüssel vergessen. (Plusquamperfekt of haben)"
        answers: [hatte]
      - id: pqp4
        type: fill-blank
        tags: [Plusquamperfekt]
        prompt: "Wir ___ schon nach Hause gegangen. (Plusquamperfekt of sein)"
        answers: [waren]

  - title: als or wenn?
    items:
      - id: alswenn1
        type: multiple-choice
        tags: [als wenn]
        prompt: "___ ich ein Kind war, wohnten wir in Polen."
        options: [Als, Wenn]
        answer: Als
      - id: alswenn2
        type: multiple-choice
        tags: [als wenn]
        prompt: "___ wir Oma besuchten, gab es immer Kuchen."
        options: [Wenn, Als]
        answer: Wenn
      - id: alswenn3
        type: multiple-choice
        tags: [als wenn]
        prompt: "___ er mich sah, lachte er."
        options: [Als, Wenn]
        answer: Als
      - id: alswenn4
        type: multiple-choice
        tags: [als wenn]
        prompt: "___ du morgen kommst, koche ich etwas."
        options: [Wenn, Als]
        answer: Wenn
      - id: alswenn5
        type: true-false
        tags: [als wenn]
        prompt: "For something that happened only once in the past, German uses als."
        answer: true

  - title: Which conjunction?
    items:
      - id: konj1
        type: multiple-choice
        tags: [temporal conjunctions]
        prompt: "___ ich zur Arbeit gehe, trinke ich einen Kaffee."
        options: [Bevor, Nachdem, Seit]
        answer: Bevor
      - id: konj2
        type: multiple-choice
        tags: [temporal conjunctions]
        prompt: "___ er kochte, hörte er Radio."
        options: [Während, Bevor, Bis]
        answer: Während
      - id: konj3
        type: multiple-choice
        tags: [temporal conjunctions]
        prompt: "Warte hier, ___ ich zurückkomme."
        options: [bis, seit, als]
        answer: bis
      - id: konj4
        type: multiple-choice
        tags: [temporal conjunctions]
        prompt: "___ ich in Berlin wohne, fahre ich nur Fahrrad."
        options: [Seit, Nachdem, Als]
        answer: Seit
      - id: konj5
        type: multiple-choice
        tags: [temporal conjunctions]
        prompt: "___ der Regen aufhört, gehen wir los."
        options: [Sobald, Während, Seit]
        answer: Sobald

  - title: Tenses with nachdem
    items:
      - id: nach1
        type: multiple-choice
        tags: [nachdem]
        prompt: "Nachdem sie das Studium ___, zog sie nach Berlin."
        options: [beendet hatte, beendete, beendet hat]
        answer: beendet hatte
      - id: nach2
        type: multiple-choice
        tags: [nachdem]
        prompt: "Nachdem ich ___, gehe ich immer spazieren."
        options: [gegessen habe, gegessen hatte, esse]
        answer: gegessen habe
      - id: nach3
        type: word-order
        tags: [nachdem, word order]
        prompt: After he had arrived, he called his mother.
        answer: "Nachdem er angekommen war, rief er seine Mutter an."

  - title: Join the sentences
    instructions: Join the two sentences with the word in brackets. Start with the conjunction.
    items:
      - id: join1
        type: translation
        tags: [als]
        prompt: "Ich war zwanzig. Ich bin nach Deutschland gekommen. (als)"
        answers:
          - "Als ich zwanzig war, bin ich nach Deutschland gekommen."
          - "Als ich zwanzig war, kam ich nach Deutschland."
      - id: join2
        type: translation
        tags: [bevor]
        prompt: "Du gehst. Mach bitte das Licht aus. (bevor)"
        answers:
          - "Bevor du gehst, mach bitte das Licht aus."

  - title: A life story
    items:
      - id: cloze1
        type: cloze
        tags: [temporal conjunctions, Plusquamperfekt]
        prompt: Fill in the gaps.
        bank: [Als, Nachdem, hatte, Während, Seitdem, bevor]
        text: "___ ich achtzehn war, verließ ich mein Dorf. ___ ich die Schule beendet ___, machte ich eine Ausbildung in München. ___ der Ausbildung lernte ich meinen Mann kennen – das war, ___ wir nach Hamburg zogen. ___ wir hier wohnen, sind wir sehr glücklich."
        gaps:
          - [Als]
          - [Nachdem]
          - [hatte]
          - [Während]
          - [bevor]
          - [Seitdem]

  - title: A memory
    stimulus:
      kind: audio
      label: Erinnerungen
      lines:
        - speaker: Großvater
          text: "Als ich so alt war wie du, gab es bei uns im Dorf noch kein Fernsehen. Wenn es dunkel wurde, saßen wir alle in der Küche, und meine Mutter erzählte Geschichten."
        - speaker: Enkelin
          text: "Und wann habt ihr den ersten Fernseher gekauft?"
        - speaker: Großvater
          text: "Neunzehnhundertvierundsechzig. Nachdem mein Vater eine neue Stelle in der Stadt bekommen hatte, hatten wir endlich mehr Geld. Seitdem saß die ganze Familie jeden Samstag vor dem Fernseher."
    items:
      - id: listen1
        type: true-false
        tags: [listening]
        prompt: Als der Großvater ein Kind war, gab es im Dorf schon Fernsehen.
        answer: false
      - id: listen2
        type: multiple-choice
        tags: [listening]
        prompt: Was machte die Familie, wenn es dunkel wurde?
        options: ["Sie saß in der Küche und hörte Geschichten.", "Sie sah fern.", "Sie ging schlafen."]
        answer: "Sie saß in der Küche und hörte Geschichten."
      - id: listen3
        type: multiple-choice
        tags: [listening]
        prompt: Warum konnte die Familie einen Fernseher kaufen?
        options: ["Der Vater hatte eine neue Stelle.", "Sie waren in die Stadt gezogen.", "Der Großvater hatte Geld gespart."]
        answer: "Der Vater hatte eine neue Stelle."

  - title: Tell your story
    items:
      - id: speak1
        type: speaking-task
        tags: [speaking, past]
        prompt: Tell someone about an important moment in your life. Use at least three different time conjunctions.
        cards: [Als …, Nachdem …, Bevor …, Seitdem …]
        phrases:
          - Als ich … war, …
          - Nachdem ich … hatte, …
          - Bevor ich …, …
          - Seitdem … ich …
        checklist:
          - I used als for a single moment in the past
          - I used nachdem with the Plusquamperfekt
          - The verb was at the end of each time clause
          - After a clause in first position, the main verb came straight after the comma
        sample: "Als ich vierundzwanzig war, habe ich zum ersten Mal Deutschland besucht. Bevor ich losfuhr, hatte ich nur ein bisschen Deutsch gelernt. Nachdem ich zwei Wochen in Leipzig verbracht hatte, wusste ich: Hier möchte ich leben. Seitdem lerne ich jeden Tag Deutsch, und vor drei Jahren bin ich endlich hierher gezogen."
