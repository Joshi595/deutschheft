lesson: a2.08
sets:
  - title: The dative article
    instructions: Put the article in brackets into the dative.
    items:
      - id: art1
        type: fill-blank
        tags: [dative articles]
        prompt: "Ich helfe ___ Mann. (der)"
        answers: [dem]
      - id: art2
        type: fill-blank
        tags: [dative articles]
        prompt: "Er dankt ___ Frau. (die)"
        answers: [der]
        explanation: Feminine die becomes der in the dative.
      - id: art3
        type: fill-blank
        tags: [dative articles]
        prompt: "Sie fährt mit ___ Auto. (das)"
        answers: [dem]
      - id: art4
        type: fill-blank
        tags: [dative articles]
        prompt: "Wir spielen mit ___ Kindern. (die)"
        answers: [den]
        explanation: "Dative plural is den, and the noun adds -n: Kindern."

  - title: Adjectives after der, dem, den
    instructions: Write the adjective in brackets with its ending.
    items:
      - id: def1
        type: fill-blank
        tags: [adjective endings dative]
        prompt: "Ich helfe dem ___ Mann. (alt)"
        answers: [alten]
      - id: def2
        type: fill-blank
        tags: [adjective endings dative]
        prompt: "Sie spricht mit der ___ Frau. (jung)"
        answers: [jungen]
      - id: def3
        type: fill-blank
        tags: [adjective endings dative]
        prompt: "Das Buch gehört dem ___ Kind. (klein)"
        answers: [kleinen]
      - id: def4
        type: fill-blank
        tags: [adjective endings dative]
        prompt: "Wir danken den ___ Nachbarn. (nett)"
        answers: [netten]

  - title: Adjectives after ein, mein, ihr, unser
    items:
      - id: indef1
        type: fill-blank
        tags: [adjective endings dative]
        prompt: "Ich gebe einem ___ Jungen ein Geschenk. (klein)"
        answers: [kleinen]
      - id: indef2
        type: fill-blank
        tags: [adjective endings dative]
        prompt: "Er arbeitet mit einem ___ Kollegen. (neu)"
        answers: [neuen]
      - id: indef3
        type: fill-blank
        tags: [adjective endings dative]
        prompt: "Ich schreibe meinem ___ Bruder. (alt)"
        answers: [alten]
      - id: indef4
        type: fill-blank
        tags: [adjective endings dative]
        prompt: "Sie hilft ihrer ___ Tochter. (klein)"
        answers: [kleinen]
      - id: indef5
        type: fill-blank
        tags: [adjective endings dative]
        prompt: "Ich bin mit dem ___ Ergebnis zufrieden. (gut)"
        answers: [guten]

  - title: Without an article
    instructions: Here the adjective takes the ending the article would have had.
    items:
      - id: bare1
        type: fill-blank
        tags: [adjective endings dative]
        prompt: "Bei ___ Wetter bleiben wir zu Hause. (schlecht)"
        answers: [schlechtem]
        hint: "das Wetter: think of dem."
        explanation: "No article, so the adjective carries the -em of dem."
      - id: bare2
        type: fill-blank
        tags: [adjective endings dative]
        prompt: "Ich trinke Tee mit ___ Milch. (kalt)"
        answers: [kalter]
        hint: "die Milch: think of der."
        explanation: "No article, so the adjective carries the -er of der."

  - title: Which case?
    items:
      - id: case1
        type: multiple-choice
        tags: [cases]
        prompt: Ich gebe ___ Frau ein Geschenk.
        options: [der freundlichen, die freundliche, der freundliche]
        answer: der freundlichen
        explanation: The woman receives the present, so she is in the dative.
      - id: case2
        type: multiple-choice
        tags: [cases]
        prompt: Der ___ Mann sieht das Auto.
        options: [große, großen, großem]
        answer: große
        explanation: The man is the subject, so nominative.
      - id: case3
        type: multiple-choice
        tags: [dative verbs]
        prompt: Kannst du ___ helfen?
        options: [mir, mich]
        answer: mir
        explanation: helfen takes the dative.
      - id: case4
        type: multiple-choice
        tags: [dative verbs]
        prompt: Das Fahrrad gehört ___.
        options: [ihn, ihm]
        answer: ihm
      - id: case5
        type: multiple-choice
        tags: [dative verbs]
        prompt: Ich sehe ___ jeden Tag.
        options: [ihn, ihm]
        answer: ihn
        explanation: sehen takes the accusative.
      - id: case6
        type: multiple-choice
        tags: [adjective endings dative]
        prompt: Which sentence is correct?
        options:
          - Sie spricht mit einer junge Frau.
          - Sie spricht mit einer jungen Frau.
          - Sie spricht mit einer junger Frau.
        answer: Sie spricht mit einer jungen Frau.

  - title: Dative prepositions
    items:
      - id: prep1
        type: matching
        tags: [dative prepositions]
        prompt: Match each preposition with its meaning.
        pairs:
          - { left: mit, right: with }
          - { left: seit, right: since }
          - { left: aus, right: out of }
          - { left: bei, right: at someone's place }
          - { left: nach, right: after }

  - title: Build the sentence
    instructions: Put the words in the right order.
    items:
      - id: order1
        type: word-order
        tags: [dative, cases]
        prompt: The young man gives the old woman a letter.
        answer: Der junge Mann gibt der alten Frau einen Brief.
      - id: order2
        type: word-order
        tags: [dative prepositions]
        prompt: I have been learning German for a year.
        answer: Ich lerne seit einem Jahr Deutsch.

  - title: Say it in German
    items:
      - id: tr1
        type: translation
        tags: [dative verbs, adjective endings dative]
        prompt: I am helping the old man.
        answers:
          - Ich helfe dem alten Mann.
      - id: tr2
        type: translation
        tags: [dative prepositions, adjective endings dative]
        prompt: She is talking to the young woman.
        answers:
          - Sie spricht mit der jungen Frau.
        hint: to talk to someone = mit jemandem sprechen
      - id: tr3
        type: translation
        tags: [dative verbs, adjective endings dative]
        prompt: The book belongs to the small child.
        answers:
          - Das Buch gehört dem kleinen Kind.
      - id: tr4
        type: translation
        tags: [dative]
        prompt: I am giving my brother a book.
        answers:
          - Ich gebe meinem Bruder ein Buch.
      - id: conv1
        type: multiple-choice
        tags: [dative verbs]
        prompt: "Hilfst du mir?"
        options:
          - "Ja, ich helfe dir gern."
          - "Ja, ich helfe dich gern."
          - "Ja, ich sehe dich gern."
        answer: "Ja, ich helfe dir gern."
