lesson: a2.05
sets:
  - title: After der, die, das
    instructions: Write the adjective in brackets with its ending.
    items:
      - id: def1
        type: fill-blank
        tags: [adjective endings nominative]
        prompt: "Der ___ Mann arbeitet hier. (groß)"
        answers: [große]
        explanation: After der, die, das in the singular the ending is -e.
      - id: def2
        type: fill-blank
        tags: [adjective endings nominative]
        prompt: "Die ___ Frau ist Ärztin. (jung)"
        answers: [junge]
        explanation: After der, die, das in the singular the ending is -e.
      - id: def3
        type: fill-blank
        tags: [adjective endings nominative]
        prompt: "Das ___ Kind spielt im Garten. (klein)"
        answers: [kleine]
        explanation: After der, die, das in the singular the ending is -e.
      - id: def4
        type: fill-blank
        tags: [adjective endings nominative]
        prompt: "Die ___ Bücher sind interessant. (alt)"
        answers: [alten]
        explanation: Plural after an article takes -en.

  - title: After ein and eine
    instructions: Write the adjective in brackets with its ending.
    items:
      - id: indef1
        type: fill-blank
        tags: [adjective endings nominative]
        prompt: "Ein ___ Laptop ist teuer. (neu)"
        answers: [neuer]
        explanation: "der Laptop: ein does not show the gender, so the adjective takes -er."
      - id: indef2
        type: fill-blank
        tags: [adjective endings nominative]
        prompt: "Eine ___ Schülerin gewinnt den Preis. (fleißig)"
        answers: [fleißige]
        explanation: Feminine is -e after die and after eine.
      - id: indef3
        type: fill-blank
        tags: [adjective endings nominative]
        prompt: "Ein ___ Auto fährt noch gut. (alt)"
        answers: [altes]
        explanation: "das Auto: ein does not show the gender, so the adjective takes -es."
      - id: indef4
        type: fill-blank
        tags: [adjective endings nominative]
        prompt: "Das ist ein ___ Hotel. (teuer)"
        answers: [teures]
        hint: teuer drops an e when it gets an ending.
        explanation: "das Hotel: -es, and teuer becomes teur-."

  - title: After mein, sein, unser, kein
    instructions: These follow the same pattern as ein.
    items:
      - id: poss1
        type: fill-blank
        tags: [adjective endings nominative]
        prompt: "Mein ___ Freund kommt zu Besuch. (alt)"
        answers: [alter]
      - id: poss2
        type: fill-blank
        tags: [adjective endings nominative]
        prompt: "Seine ___ Schwester studiert Medizin. (klein)"
        answers: [kleine]
      - id: poss3
        type: fill-blank
        tags: [adjective endings nominative]
        prompt: "Unser ___ Haus ist zu klein. (alt)"
        answers: [altes]
      - id: poss4
        type: fill-blank
        tags: [adjective endings nominative]
        prompt: "Das ist kein ___ Film. (gut)"
        answers: [guter]
        explanation: "der Film is masculine: kein guter Film."
      - id: poss5
        type: fill-blank
        tags: [adjective endings nominative]
        prompt: "Das ist keine ___ Idee. (gut)"
        answers: [gute]
      - id: poss6
        type: fill-blank
        tags: [adjective endings nominative]
        prompt: "Das sind keine ___ Nachrichten. (gut)"
        answers: [guten]
        explanation: Plural after keine takes -en.

  - title: Without an article
    instructions: The adjective has to show the gender on its own.
    items:
      - id: bare1
        type: fill-blank
        tags: [adjective endings nominative]
        prompt: "___ Menschen helfen gern. (freundlich)"
        answers: [Freundliche]
        explanation: Plural with no article takes -e.
      - id: bare2
        type: fill-blank
        tags: [adjective endings nominative]
        prompt: "Das ist ___ Kaffee! (gut)"
        answers: [guter]
        explanation: "der Kaffee, no article: -er."
      - id: bare3
        type: fill-blank
        tags: [adjective endings nominative]
        prompt: "___ Wasser ist erfrischend. (kalt)"
        answers: [Kaltes]
        explanation: "das Wasser, no article: -es."

  - title: Pick the ending
    items:
      - id: mc1
        type: multiple-choice
        tags: [adjective endings nominative]
        prompt: Das ist ein ___ Hund.
        options: [kleiner, kleine, kleines]
        answer: kleiner
        explanation: der Hund, after ein.
      - id: mc2
        type: multiple-choice
        tags: [adjective endings nominative]
        prompt: Wo ist die ___ Zeitung?
        options: [neue, neuen, neuer]
        answer: neue
      - id: mc3
        type: multiple-choice
        tags: [adjective endings nominative]
        prompt: Meine ___ Eltern wohnen in Köln.
        options: [liebe, lieben, lieber]
        answer: lieben
        explanation: Eltern is plural, and after meine the plural ending is -en.
      - id: mc4
        type: multiple-choice
        tags: [adjective endings nominative]
        prompt: Das Wetter ist heute ___.
        options: [schön, schöne, schönes]
        answer: schön
        explanation: After sein, with no noun following, there is no ending.

  - title: Say it in German
    items:
      - id: tr1
        type: translation
        tags: [adjective endings nominative]
        prompt: She is a nice woman.
        answers:
          - Sie ist eine nette Frau.
      - id: tr2
        type: translation
        tags: [adjective endings nominative]
        prompt: That is an old house.
        answers:
          - Das ist ein altes Haus.
      - id: tr3
        type: translation
        tags: [adjective endings nominative]
        prompt: The small children are playing.
        answers:
          - Die kleinen Kinder spielen.
      - id: tr4
        type: translation
        tags: [adjective endings nominative]
        prompt: My new colleague is friendly.
        answers:
          - Mein neuer Kollege ist freundlich.
          - Meine neue Kollegin ist freundlich.
      - id: order1
        type: word-order
        tags: [adjective endings nominative]
        prompt: That is a very interesting book.
        answer: Das ist ein sehr interessantes Buch.
