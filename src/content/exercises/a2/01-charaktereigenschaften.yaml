lesson: a2.01
sets:
  - title: What does it mean?
    instructions: Choose the English meaning.
    items:
      - id: mc1
        type: multiple-choice
        tags: [character traits]
        prompt: freundlich
        options: [friendly, lazy, brave]
        answer: friendly
      - id: mc2
        type: multiple-choice
        tags: [character traits]
        prompt: fleißig
        options: [patient, hard-working, shy]
        answer: hard-working
      - id: mc3
        type: multiple-choice
        tags: [character traits]
        prompt: mutig
        options: [brave, honest, gentle]
        answer: brave
      - id: mc4
        type: multiple-choice
        tags: [character traits]
        prompt: Which word means "reliable"?
        options: [ehrlich, zuverlässig, geduldig, selbstbewusst]
        answer: zuverlässig
        explanation: "ehrlich = honest, geduldig = patient, selbstbewusst = self-confident."

  - title: The right form of sein
    instructions: Complete each sentence with a form of sein.
    items:
      - id: sein1
        type: fill-blank
        tags: [sein]
        prompt: Ich ___ sehr geduldig.
        answers: [bin]
        translation: I am very patient.
      - id: sein2
        type: fill-blank
        tags: [sein]
        prompt: Er ___ freundlich und humorvoll.
        answers: [ist]
        translation: He is friendly and funny.
      - id: sein3
        type: fill-blank
        tags: [sein]
        prompt: Wir ___ in der Schule sehr fleißig.
        answers: [sind]
        translation: We are very hard-working at school.
      - id: sein4
        type: fill-blank
        tags: [sein]
        prompt: Ihr ___ heute aber faul!
        answers: [seid]
        translation: You lot are lazy today!
        hint: ihr is "you" for several people.
        explanation: "ihr seid, with d at the end. Do not confuse it with seit (since)."
      - id: sein5
        type: fill-blank
        tags: [sein]
        prompt: Du ___ immer so optimistisch.
        answers: [bist]
        translation: You are always so optimistic.

  - title: Ending or no ending?
    instructions: Choose the form that fits after sein.
    items:
      - id: pred1
        type: multiple-choice
        tags: [predicate adjectives]
        prompt: Die Frau ist ___.
        options: [freundlich, freundliche, freundlicher]
        answer: freundlich
        explanation: After sein the adjective takes no ending, whatever the gender.
      - id: pred2
        type: multiple-choice
        tags: [predicate adjectives]
        prompt: Das Kind ist sehr ___.
        options: [schüchternes, schüchtern, schüchterne]
        answer: schüchtern
        explanation: After sein the adjective takes no ending, whatever the gender.
      - id: pred3
        type: multiple-choice
        tags: [predicate adjectives]
        prompt: Meine Eltern sind ___.
        options: [geduldige, geduldigen, geduldig]
        answer: geduldig
        explanation: No ending in the plural either.

  - title: Opposites
    items:
      - id: opp1
        type: matching
        tags: [character traits]
        prompt: Match each adjective with its opposite.
        pairs:
          - { left: fleißig, right: faul }
          - { left: mutig, right: feige }
          - { left: optimistisch, right: pessimistisch }
          - { left: freundlich, right: unfreundlich }
      - id: opp2
        type: matching
        tags: [character traits]
        prompt: Match each adjective with its meaning.
        pairs:
          - { left: ehrlich, right: honest }
          - { left: schüchtern, right: shy }
          - { left: sanft, right: gentle }
          - { left: geduldig, right: patient }
          - { left: humorvoll, right: funny }

  - title: Build the sentence
    instructions: Put the words in the right order.
    items:
      - id: order1
        type: word-order
        tags: [intensifiers]
        prompt: My sister is quite self-confident.
        answer: Meine Schwester ist ziemlich selbstbewusst.
      - id: order2
        type: word-order
        tags: [intensifiers]
        prompt: Our neighbours are not very friendly.
        answer: Unsere Nachbarn sind nicht sehr freundlich.
      - id: order3
        type: word-order
        tags: [sein]
        prompt: What is your new boss like?
        answer: Wie ist dein neuer Chef?
        explanation: "The question word is wie, and the verb comes straight after it."

  - title: Say it in German
    instructions: Translate. Capital letters and the full stop are not checked strictly, spelling is.
    items:
      - id: tr1
        type: translation
        tags: [character traits, sein]
        prompt: She is very friendly and honest.
        answers:
          - Sie ist sehr freundlich und ehrlich.
      - id: tr2
        type: translation
        tags: [character traits, sein]
        prompt: He is brave and hard-working.
        answers:
          - Er ist mutig und fleißig.
          - Er ist fleißig und mutig.
      - id: tr3
        type: translation
        tags: [intensifiers]
        prompt: They are not very shy.
        answers:
          - Sie sind nicht sehr schüchtern.
      - id: tr4
        type: translation
        tags: [intensifiers]
        prompt: My brother is far too lazy.
        answers:
          - Mein Bruder ist viel zu faul.
        hint: far too = viel zu

  - title: In conversation
    items:
      - id: conv1
        type: multiple-choice
        tags: [character traits]
        prompt: "Wie ist deine Mutter?"
        options:
          - Sie ist sehr freundlich und humorvoll.
          - Sie ist Lehrerin.
          - Es geht ihr gut.
        answer: Sie ist sehr freundlich und humorvoll.
        explanation: "Wie ist …? asks what someone is like. Her job would be Was ist sie von Beruf?, and how she is doing would be Wie geht es ihr?"
      - id: write1
        type: writing
        tags: [character traits, intensifiers]
        prompt: Describe a friend or someone in your family in one sentence. Use sein and at least one adjective from this lesson.
        mustInclude: []
        sample: Meine beste Freundin ist sehr humorvoll und ziemlich mutig.
