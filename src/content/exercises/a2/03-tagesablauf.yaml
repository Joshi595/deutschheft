lesson: a2.03
sets:
  - title: What happens when?
    instructions: Choose the German sentence that matches.
    items:
      - id: mc1
        type: multiple-choice
        tags: [daily routine]
        prompt: I get up at seven o'clock.
        options:
          - Ich stehe um sieben Uhr auf.
          - Ich gehe um sieben Uhr ins Bett.
          - Ich arbeite um sieben Uhr.
        answer: Ich stehe um sieben Uhr auf.
      - id: mc2
        type: multiple-choice
        tags: [daily routine]
        prompt: She cooks every day.
        options:
          - Sie isst jeden Tag.
          - Sie kocht jeden Tag.
          - Sie liest jeden Tag.
        answer: Sie kocht jeden Tag.
      - id: mc3
        type: multiple-choice
        tags: [daily routine, time expressions]
        prompt: We watch TV in the evening.
        options:
          - Wir hören abends Radio.
          - Wir sehen morgens fern.
          - Wir sehen abends fern.
        answer: Wir sehen abends fern.

  - title: The right verb form
    instructions: Put the verb in brackets into the present tense.
    items:
      - id: conj1
        type: fill-blank
        tags: [present tense]
        prompt: "Sie ___ in einem Büro. (arbeiten)"
        answers: [arbeitet]
        translation: She works in an office.
        explanation: Stems ending in -t add an e before the ending.
      - id: conj2
        type: fill-blank
        tags: [present tense]
        prompt: "Wir ___ um halb acht. (frühstücken)"
        answers: [frühstücken]
        translation: We have breakfast at half past seven.
      - id: conj3
        type: fill-blank
        tags: [present tense]
        prompt: "Du ___ jeden Tag Musik. (hören)"
        answers: [hörst]
        translation: You listen to music every day.
      - id: conj4
        type: fill-blank
        tags: [present tense, stem-changing verbs]
        prompt: "Er ___ gern Krimis. (lesen)"
        answers: [liest]
        translation: He likes reading crime novels.
        hint: lesen changes its vowel in the er form.
      - id: conj5
        type: fill-blank
        tags: [present tense, stem-changing verbs]
        prompt: "Meine Schwester ___ mit dem Bus zur Arbeit. (fahren)"
        answers: [fährt]
        translation: My sister takes the bus to work.
        hint: fahren changes its vowel in the er / sie form.
      - id: conj6
        type: fill-blank
        tags: [reflexive verbs]
        prompt: "Ich wasche ___ und ziehe mich an."
        answers: [mich]
        translation: I wash and get dressed.

  - title: Separable verbs
    instructions: Put the words in the right order. The prefix goes to the end.
    items:
      - id: sep1
        type: word-order
        tags: [separable verbs]
        prompt: I get up at seven o'clock.
        answer: Ich stehe um sieben Uhr auf.
      - id: sep2
        type: word-order
        tags: [separable verbs, verb second]
        prompt: On Saturday I do the shopping at the supermarket.
        answer: Am Samstag kaufe ich im Supermarkt ein.
      - id: sep3
        type: word-order
        tags: [separable verbs, reflexive verbs]
        prompt: She gets dressed quickly.
        answer: Sie zieht sich schnell an.
      - id: sep4
        type: word-order
        tags: [separable verbs, verb second]
        prompt: In the evening he calls his mother.
        answer: Abends ruft er seine Mutter an.

  - title: Time words
    items:
      - id: time1
        type: matching
        tags: [time expressions]
        prompt: Match each time word with its meaning.
        pairs:
          - { left: morgens, right: in the morning }
          - { left: abends, right: in the evening }
          - { left: immer, right: always }
          - { left: manchmal, right: sometimes }
          - { left: selten, right: rarely }
          - { left: nie, right: never }

  - title: Verb second
    items:
      - id: v2a
        type: multiple-choice
        tags: [verb second]
        prompt: Choose the correct sentence.
        options:
          - Morgens ich trinke Kaffee.
          - Morgens trinke ich Kaffee.
        answer: Morgens trinke ich Kaffee.
        explanation: The verb is the second element, so the subject moves behind it.
      - id: v2b
        type: multiple-choice
        tags: [verb second]
        prompt: Choose the correct sentence.
        options:
          - Nach der Arbeit gehe ich spazieren.
          - Nach der Arbeit ich gehe spazieren.
          - Nach der Arbeit spazieren ich gehe.
        answer: Nach der Arbeit gehe ich spazieren.

  - title: Say it in German
    items:
      - id: tr1
        type: translation
        tags: [daily routine, time expressions]
        prompt: I listen to music every day.
        answers:
          - Ich höre jeden Tag Musik.
          - Jeden Tag höre ich Musik.
      - id: tr2
        type: translation
        tags: [daily routine, time expressions]
        prompt: He goes shopping on Saturday.
        answers:
          - Er geht am Samstag einkaufen.
          - Am Samstag geht er einkaufen.
          - Er kauft am Samstag ein.
          - Am Samstag kauft er ein.
      - id: tr3
        type: translation
        tags: [daily routine, time expressions]
        prompt: We eat together in the evening.
        answers:
          - Wir essen abends zusammen.
          - Abends essen wir zusammen.
          - Wir essen am Abend zusammen.
          - Am Abend essen wir zusammen.
      - id: tr4
        type: translation
        tags: [daily routine, time expressions]
        prompt: I go to bed at ten o'clock.
        answers:
          - Ich gehe um zehn Uhr ins Bett.
          - Um zehn Uhr gehe ich ins Bett.
          - Ich gehe um 10 Uhr ins Bett.
          - Um 10 Uhr gehe ich ins Bett.
          - Ich gehe um 22 Uhr ins Bett.
          - Um 22 Uhr gehe ich ins Bett.
      - id: write1
        type: writing
        tags: [daily routine]
        prompt: Write one sentence about your own day. Include a time, such as morgens, abends or um acht Uhr.
        mustInclude: []
        sample: Morgens trinke ich einen Kaffee und fahre dann mit dem Bus zur Arbeit.
