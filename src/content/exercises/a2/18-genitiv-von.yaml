lesson: a2.18
sets:
  - title: Names
    items:
      - id: name1
        type: multiple-choice
        tags: [names]
        prompt: "Das ist ___ Fahrrad."
        options: [Toms, Tom's, von Toms]
        answer: Toms
        explanation: "With names, German adds -s with no apostrophe: Toms Fahrrad."
      - id: name2
        type: fill-blank
        tags: [names]
        prompt: "___ Schwester wohnt in Wien. (Peter)"
        answers: [Peters]
        explanation: "A name shows ownership with -s and no apostrophe: Peters Schwester."
      - id: name3
        type: true-false
        tags: [names]
        prompt: "German writes an apostrophe in 'Annas Auto'."
        answer: false
        explanation: "German writes Annas Auto without an apostrophe."

  - title: von + dative
    items:
      - id: von1
        type: fill-blank
        tags: [von]
        prompt: "Das ist das Auto von ___ Bruder. (mein)"
        answers: [meinem]
        explanation: "von takes the dative; Bruder is masculine, so mein becomes meinem."
      - id: von2
        type: fill-blank
        tags: [von]
        prompt: "Die Wohnung von ___ Freundin ist groß. (meine)"
        answers: [meiner]
        explanation: "von takes the dative; Freundin is feminine, so meine becomes meiner."
      - id: von3
        type: fill-blank
        tags: [von]
        prompt: "Das ist das Zimmer von den ___. (Kinder)"
        answers: [Kindern]
        explanation: "Dative plural adds -n to the noun: von den Kindern."
      - id: von4
        type: translation
        tags: [von]
        prompt: "That is my sister's bike. (use von)"
        answers:
          - "Das ist das Fahrrad von meiner Schwester."
        explanation: "In speech, ownership is often von + dative: das Fahrrad von meiner Schwester."

  - title: The genitive
    items:
      - id: gen1
        type: multiple-choice
        tags: [genitive]
        prompt: "das Auto ___ Lehrers"
        options: [des, der, dem]
        answer: des
        explanation: "Masculine genitive is des, and the noun adds -s: des Lehrers."
      - id: gen2
        type: multiple-choice
        tags: [genitive]
        prompt: "das Büro ___ Chefin"
        options: [der, des, die]
        answer: der
        explanation: "Feminine genitive is der: das Büro der Chefin. The noun does not change."
      - id: gen3
        type: multiple-choice
        tags: [genitive]
        prompt: "Ende des ___"
        options: [Monats, Monat, Monaten]
        answer: Monats
        explanation: "Masculine and neuter nouns add -s in the genitive: des Monats."
      - id: gen4
        type: multiple-choice
        tags: [genitive]
        prompt: "die Spielsachen ___ Kinder"
        options: [der, des, den]
        answer: der
        explanation: "Plural genitive is der: die Spielsachen der Kinder."
      - id: gen5
        type: fill-blank
        tags: [genitive]
        prompt: "Das ist das Haus ___ Eltern. (mein-, genitive)"
        answers: [meiner]
        explanation: "In the plural genitive, mein- takes -er: das Haus meiner Eltern."
      - id: gen6
        type: matching
        tags: [genitive phrases]
        prompt: Match the German with the English.
        pairs:
          - { left: Ende des Monats, right: at the end of the month }
          - { left: wegen des Wetters, right: because of the weather }
          - { left: während der Arbeit, right: during work }
          - { left: die Hälfte der Zeit, right: half the time }
        explanation: "These are common genitive phrases: Ende des Monats, wegen des Wetters, während der Arbeit, die Hälfte der Zeit."

  - title: Mine and yours
    items:
      - id: poss1
        type: multiple-choice
        tags: [possessive pronouns]
        prompt: "Ist das dein Handy? – Ja, das ist ___."
        options: [meins, meiner, meine]
        answer: meins
        explanation: "Handy is neuter, so on its own mein becomes meins: das ist meins."
      - id: poss2
        type: multiple-choice
        tags: [possessive pronouns]
        prompt: "Ist das dein Schlüssel? – Ja, das ist ___."
        options: [meiner, meins, meine]
        answer: meiner
        explanation: "Schlüssel is masculine, so on its own it is meiner."
      - id: poss3
        type: multiple-choice
        tags: [possessive pronouns]
        prompt: "Sind das deine Schuhe? – Nein, das sind nicht ___."
        options: [meine, meins, meiner]
        answer: meine
        explanation: "Schuhe is plural, so on its own it is meine."
      - id: poss4
        type: fill-blank
        tags: [possessive pronouns]
        prompt: "Das ist nicht mein Handy, das ist ___. (his)"
        answers: [seins]
        explanation: "Handy is neuter; 'his' standing alone is seins."

  - title: Whose is it?
    items:
      - id: cloze1
        type: cloze
        tags: [possession]
        prompt: Complete the conversation after the party.
        text: "– Wem gehört die Jacke hier? – Das ist ___ Jacke. (Lisa) – Und der Schal? – Der ist ___, ich hole ihn gleich. (mine) – Und das Handy? – Das ist das Handy von ___ Bruder. (mein)"
        gaps:
          - [Lisas]
          - [meiner]
          - [meinem]
        explanation: "Lisa's jacket: Lisas Jacke; der Schal standing alone → meiner; von + dative: von meinem Bruder."

  - title: Build the sentence
    instructions: Put the words in the right order.
    items:
      - id: order1
        type: word-order
        tags: [genitive phrases]
        prompt: The concert is cancelled because of the weather.
        answer: "Das Konzert fällt wegen des Wetters aus."
        explanation: "wegen takes the genitive: des Wetters. ausfallen splits, with aus at the end."
      - id: order2
        type: word-order
        tags: [genitive]
        prompt: The owner of the house lives in Spain.
        answer: "Der Besitzer des Hauses wohnt in Spanien."
        explanation: "The owner of the house: genitive des Hauses (das Haus adds -es)."

  - title: A family photo
    stimulus:
      kind: audio
      label: Das Familienfoto
      lines:
        - speaker: Ali
          text: "Wer ist das auf dem Foto?"
        - speaker: Jana
          text: "Das ist meine Familie bei der Hochzeit von meinem Bruder. Der Mann links ist mein Vater, und die Frau neben ihm ist die Schwester meiner Mutter."
        - speaker: Ali
          text: "Und das Kind?"
        - speaker: Jana
          text: "Das ist Emil, der Sohn meiner Cousine. Und der Hund gehört meinen Eltern."
    items:
      - id: listen1
        type: multiple-choice
        tags: [listening]
        prompt: Wessen Hochzeit war das?
        options: ["die Hochzeit von Janas Bruder", "die Hochzeit von Janas Cousine", "Janas Hochzeit"]
        answer: "die Hochzeit von Janas Bruder"
        explanation: "Jana says it was bei der Hochzeit von meinem Bruder."
      - id: listen2
        type: multiple-choice
        tags: [listening]
        prompt: Wer steht neben dem Vater?
        options: ["Janas Tante", "Janas Mutter", "Janas Cousine"]
        answer: "Janas Tante"
        explanation: The sister of her mother is her aunt.
      - id: listen3
        type: true-false
        tags: [listening]
        prompt: Der Hund gehört Jana.
        answer: false
        explanation: "Jana says: der Hund gehört meinen Eltern."

  - title: Your family
    items:
      - id: speak1
        type: speaking-task
        tags: [speaking, possession]
        prompt: Show someone a photo (real or imagined) of your family or friends and explain who everyone is.
        cards: [Eltern, Geschwister, Verwandte, Freunde, Haustier]
        phrases:
          - Das ist mein … / meine …
          - Das ist der Mann / die Frau von meinem / meiner …
          - Der Hund gehört …
          - Das Haus meiner Eltern …
        checklist:
          - I named at least four people
          - I used von + dative at least twice
          - I used a name with -s at least once
        sample: "Das ist ein Foto von meiner Familie. Links ist mein Vater, rechts ist meine Mutter. Das Kind ist Sofias Sohn – Sofia ist meine Schwester. Der Mann hinter ihr ist der Freund von meiner Cousine. Und der Hund heißt Bruno, er gehört meinen Eltern. Das Foto haben wir im Garten meiner Großeltern gemacht."
