lesson: a2.10
sets:
  - title: The genitive article
    instructions: Complete with des or der.
    items:
      - id: art1
        type: fill-blank
        tags: [genitive articles]
        prompt: "Das Buch ___ Lehrers ist interessant."
        answers: [des]
        translation: The teacher's book is interesting.
      - id: art2
        type: fill-blank
        tags: [genitive articles]
        prompt: "Der Preis ___ Wohnung ist hoch."
        answers: [der]
        translation: The price of the flat is high.
      - id: art3
        type: fill-blank
        tags: [genitive articles]
        prompt: "Die Farbe ___ Hauses ist rot."
        answers: [des]
        translation: The colour of the house is red.
      - id: art4
        type: fill-blank
        tags: [genitive articles]
        prompt: "Der Vater ___ Kindes ist Arzt."
        answers: [des]
        translation: The child's father is a doctor.
      - id: art5
        type: fill-blank
        tags: [genitive articles]
        prompt: "Die Eltern ___ Kinder warten draußen."
        answers: [der]
        translation: The children's parents are waiting outside.
        explanation: "Genitive plural is der. Compare the dative plural: den Kindern."

  - title: ein and mein in the genitive
    instructions: Put the word in brackets into the genitive.
    items:
      - id: ein1
        type: fill-blank
        tags: [genitive articles]
        prompt: "Das ist das Auto ___ Freundes. (ein)"
        answers: [eines]
      - id: ein2
        type: fill-blank
        tags: [genitive articles]
        prompt: "Das ist die Tasche ___ Schwester. (mein)"
        answers: [meiner]
      - id: ein3
        type: fill-blank
        tags: [genitive articles]
        prompt: "Das ist das Fahrrad ___ Bruders. (mein)"
        answers: [meines]

  - title: The noun ending
    instructions: Put the noun in brackets into the genitive.
    items:
      - id: noun1
        type: fill-blank
        tags: [genitive noun endings]
        prompt: "die Tür des ___ (Haus)"
        answers: [Hauses]
        explanation: One syllable, and it ends in -s, so -es.
      - id: noun2
        type: fill-blank
        tags: [genitive noun endings]
        prompt: "der Name des ___ (Lehrer)"
        answers: [Lehrers]
        explanation: More than one syllable, so just -s.
      - id: noun3
        type: fill-blank
        tags: [genitive noun endings]
        prompt: "das Spielzeug des ___ (Kind)"
        answers: [Kindes, Kinds]
      - id: noun4
        type: fill-blank
        tags: [genitive noun endings]
        prompt: "die Farbe des ___ (Auto)"
        answers: [Autos]
      - id: noun5
        type: fill-blank
        tags: [genitive noun endings]
        prompt: "die Tasche der ___ (Frau)"
        answers: [Frau]
        explanation: Feminine nouns take no ending in the genitive.

  - title: Pick the right form
    items:
      - id: mc1
        type: multiple-choice
        tags: [genitive prepositions]
        prompt: Wegen ___ Regens bleibe ich zu Hause.
        options: [des, den, dem, der]
        answer: des
      - id: mc2
        type: multiple-choice
        tags: [genitive prepositions]
        prompt: Trotz ___ Kälte gehen wir spazieren.
        options: [der, des, die]
        answer: der
        explanation: "die Kälte is feminine: genitive der."
      - id: mc3
        type: multiple-choice
        tags: [genitive articles]
        prompt: Das ist die Tasche ___ Lehrerin.
        options: [der, des, den, die]
        answer: der
      - id: mc4
        type: multiple-choice
        tags: [genitive names]
        prompt: Which is correct German for "Anna's car"?
        options: [Annas Auto, Anna's Auto, Annaes Auto]
        answer: Annas Auto
        explanation: Names add -s without an apostrophe.
      - id: mc5
        type: multiple-choice
        tags: [genitive, adjective endings]
        prompt: das Auto des ___ Mannes
        options: [alten, alte, altes]
        answer: alten
        explanation: After an article, genitive adjectives end in -en.

  - title: Genitive prepositions
    items:
      - id: prep1
        type: matching
        tags: [genitive prepositions]
        prompt: Match each preposition with its meaning.
        pairs:
          - { left: wegen, right: because of }
          - { left: trotz, right: despite }
          - { left: während, right: during }
          - { left: statt, right: instead of }
          - { left: außerhalb, right: outside }
          - { left: innerhalb, right: within }

  - title: Build the sentence
    instructions: Put the words in the right order.
    items:
      - id: order1
        type: word-order
        tags: [genitive prepositions]
        prompt: During the break we have a coffee.
        answer: Während der Pause trinken wir einen Kaffee.
      - id: order2
        type: word-order
        tags: [genitive]
        prompt: That is my friend's father.
        answer: Das ist der Vater meines Freundes.

  - title: Say it in German
    items:
      - id: tr1
        type: translation
        tags: [genitive]
        prompt: The colour of the car is red.
        answers:
          - Die Farbe des Autos ist rot.
      - id: tr2
        type: translation
        tags: [genitive prepositions]
        prompt: Despite the rain we are going for a walk.
        answers:
          - Trotz des Regens gehen wir spazieren.
          - Wir gehen trotz des Regens spazieren.
      - id: tr3
        type: translation
        tags: [genitive prepositions]
        prompt: Because of the weather I am staying at home.
        answers:
          - Wegen des Wetters bleibe ich zu Hause.
          - Ich bleibe wegen des Wetters zu Hause.
      - id: tr4
        type: translation
        tags: [genitive]
        prompt: That is my sister's bag.
        answers:
          - Das ist die Tasche meiner Schwester.
          - Das ist die Tasche von meiner Schwester.
