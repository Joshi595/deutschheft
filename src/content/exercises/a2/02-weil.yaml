lesson: a2.02
sets:
  - title: Which sentence is correct?
    instructions: In a weil clause the conjugated verb stands at the end.
    items:
      - id: pos1
        type: multiple-choice
        tags: [weil word order]
        prompt: Choose the correct sentence.
        options:
          - "Er kommt nicht, weil er ist krank."
          - "Er kommt nicht, weil er krank ist."
        answer: "Er kommt nicht, weil er krank ist."
      - id: pos2
        type: multiple-choice
        tags: [weil word order]
        prompt: Choose the correct sentence.
        options:
          - "Ich mache das, weil ich möchte dir helfen."
          - "Ich mache das, weil ich dir helfen möchte."
          - "Ich mache das, weil ich dir möchte helfen."
        answer: "Ich mache das, weil ich dir helfen möchte."
        explanation: With a modal verb, the infinitive comes first and the conjugated modal goes last.
      - id: pos3
        type: multiple-choice
        tags: [weil word order]
        prompt: Choose the correct sentence.
        options:
          - "Sie arbeitet viel, weil sie hat eine Familie."
          - "Sie arbeitet viel, weil sie eine Familie hat."
        answer: "Sie arbeitet viel, weil sie eine Familie hat."
      - id: pos4
        type: multiple-choice
        tags: [weil word order]
        prompt: Choose the correct sentence.
        options:
          - "Weil ich krank bin, ich gehe zum Arzt."
          - "Weil ich krank bin, gehe ich zum Arzt."
          - "Weil ich bin krank, gehe ich zum Arzt."
        answer: "Weil ich krank bin, gehe ich zum Arzt."
        explanation: When the weil clause comes first, the main clause starts with its verb.

  - title: The missing verb
    instructions: Complete the weil clause.
    items:
      - id: verb1
        type: fill-blank
        tags: [weil word order]
        prompt: "Ich esse, weil ich Hunger ___."
        answers: [habe]
        translation: I am eating because I am hungry.
      - id: verb2
        type: fill-blank
        tags: [weil word order]
        prompt: "Sie schläft lange, weil sie müde ___."
        answers: [ist]
        translation: She sleeps late because she is tired.
      - id: verb3
        type: fill-blank
        tags: [weil word order]
        prompt: "Wir lernen Deutsch, weil es wichtig ___."
        answers: [ist]
        translation: We are learning German because it is important.
      - id: verb4
        type: fill-blank
        tags: [weil word order]
        prompt: "Ich rufe ihn nicht an, weil ich seine Nummer vergessen ___."
        answers: [habe]
        translation: I am not calling him because I have forgotten his number.
        explanation: In the perfect tense the participle comes first, then the conjugated form of haben.

  - title: Build the sentence
    instructions: Put the words in the right order.
    items:
      - id: order1
        type: word-order
        tags: [weil word order]
        prompt: I am going home because I am tired.
        answer: "Ich gehe nach Hause, weil ich müde bin."
      - id: order2
        type: word-order
        tags: [weil word order]
        prompt: He is not coming because he has to work.
        answer: "Er kommt nicht, weil er arbeiten muss."
      - id: order3
        type: word-order
        tags: [weil word order]
        prompt: Because it is raining, we are staying at home.
        answer: "Weil es regnet, bleiben wir zu Hause."
      - id: order4
        type: word-order
        tags: [weil word order]
        prompt: We have to go because the train leaves at eight.
        answer: "Wir müssen los, weil der Zug um acht Uhr abfährt."

  - title: Join the sentences
    instructions: Make one sentence with weil. The second sentence is the reason.
    items:
      - id: join1
        type: translation
        tags: [weil word order]
        prompt: "Ich lerne Deutsch. Es ist wichtig."
        answers:
          - "Ich lerne Deutsch, weil es wichtig ist."
      - id: join2
        type: translation
        tags: [weil word order]
        prompt: "Er kommt nicht. Er hat keine Zeit."
        answers:
          - "Er kommt nicht, weil er keine Zeit hat."
      - id: join3
        type: translation
        tags: [weil word order]
        prompt: "Sie bleibt im Bett. Sie ist krank."
        answers:
          - "Sie bleibt im Bett, weil sie krank ist."
      - id: join4
        type: translation
        tags: [weil word order]
        prompt: "Ich kaufe das Buch. Ich möchte es lesen."
        answers:
          - "Ich kaufe das Buch, weil ich es lesen möchte."
        hint: The modal verb goes last, after the infinitive.

  - title: Which reason fits?
    items:
      - id: match1
        type: matching
        tags: [weil]
        prompt: Match each sentence with the reason that makes sense.
        pairs:
          - { left: "Ich kaufe einen Mantel,", right: "weil es kalt ist." }
          - { left: "Sie bestellt eine Pizza,", right: "weil sie Hunger hat." }
          - { left: "Er liest das Buch,", right: "weil es interessant ist." }
          - { left: "Wir nehmen ein Taxi,", right: "weil der Bus nicht kommt." }

  - title: In conversation
    items:
      - id: conv1
        type: multiple-choice
        tags: [weil]
        prompt: "Warum isst du so schnell?"
        options:
          - "Weil ich großen Hunger habe."
          - "Das Wetter ist schön."
          - "Weil ich habe großen Hunger."
        answer: "Weil ich großen Hunger habe."
      - id: conv2
        type: multiple-choice
        tags: [weil, denn]
        prompt: Which sentence means the same and is also correct?
        options:
          - "Ich bleibe zu Hause, denn ich bin krank."
          - "Ich bleibe zu Hause, denn ich krank bin."
        answer: "Ich bleibe zu Hause, denn ich bin krank."
        explanation: denn does not send the verb to the end. Only weil does.
      - id: write1
        type: writing
        tags: [weil]
        prompt: Why are you learning German? Answer in one sentence with weil.
        mustInclude: [weil]
        sample: "Ich lerne Deutsch, weil ich in Deutschland arbeiten möchte."
