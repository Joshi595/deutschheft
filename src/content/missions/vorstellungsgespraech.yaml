title: The job interview
titleDe: Das Vorstellungsgespräch
level: b1
order: 2
minutes: 10
icon: work
objective: Present your experience, answer the classic interview questions, and ask a good question of your own.
scene: >-
  You applied for a job as a project assistant at an engineering firm in Stuttgart. Frau Dr. Keller,
  the head of the department, is interviewing you. She is friendly, and she is listening closely.
lessons: [b1.10, b1.19, b1.20]
phrases:
  - { de: "Vielen Dank für die Einladung.", en: "Thank you for the invitation." }
  - { de: "der berufliche Werdegang", en: "career history" }
  - { de: "Ich möchte mehr Verantwortung übernehmen.", en: "I would like to take on more responsibility." }
  - { de: "Ich war für die Planung zuständig.", en: "I was responsible for planning." }
  - { de: "Meine Kündigungsfrist beträgt drei Monate.", en: "My notice period is three months." }
  - { de: "Ich freue mich auf Ihre Rückmeldung.", en: "I look forward to hearing from you." }
practised:
  - Keeping a formal, positive register from the first sentence
  - "Verb position after obwohl and da"
  - Describing your experience in the perfect tense
  - Understanding contract terms such as befristet and Probezeit
steps:
  - lines:
      - { speaker: Frau Dr. Keller, text: "Guten Tag, schön, dass Sie da sind. Haben Sie gut hergefunden?", en: "Hello, good to have you here. Did you find your way all right?" }
    task:
      id: small-talk
      type: multiple-choice
      tags: [register, politeness]
      prompt: This is small talk before the interview begins. Which answer fits?
      options:
        - "Ja, danke, ohne Probleme. Vielen Dank für die Einladung."
        - "Ja. Können wir anfangen?"
        - "Na ja, die Bahn war mal wieder ein Chaos, typisch."
      answer: "Ja, danke, ohne Probleme. Vielen Dank für die Einladung."
      feedback:
        "Ja. Können wir anfangen?": "Too abrupt. The question invites a friendly sentence or two, and thanking for the invitation is expected."
        "Na ja, die Bahn war mal wieder ein Chaos, typisch.": "Complaining in the first minute, and in a casual tone (na ja, mal wieder), sets the wrong mood. Stay positive and formal."
    you: { text: "Ja, danke, ohne Probleme. Vielen Dank für die Einladung.", en: "Yes, thank you, no problems. Thank you for the invitation." }

  - lines:
      - { speaker: Frau Dr. Keller, text: "Sehr gern. Erzählen Sie doch bitte etwas über Ihren beruflichen Werdegang.", en: "You are welcome. Please tell me something about your career so far." }
    task:
      id: career
      type: word-order
      tags: [perfect, word order]
      prompt: Say that after your studies you worked in customer service for three years.
      answer: "Nach meinem Studium habe ich drei Jahre im Kundenservice gearbeitet."
      # Same tiles as the answer, so the capitals stay where the tiles have them.
      alternatives: ["ich habe Nach meinem Studium drei Jahre im Kundenservice gearbeitet."]
      explanation: "With Nach meinem Studium in first position, habe stays second and the subject ich follows it. The participle waits at the end."
    you: { text: "Nach meinem Studium habe ich drei Jahre im Kundenservice gearbeitet.", en: "After my studies I worked in customer service for three years." }

  - lines:
      - { speaker: Frau Dr. Keller, text: "Und warum möchten Sie die Stelle wechseln?", en: "And why would you like to change jobs?" }
    task:
      id: reason
      type: multiple-choice
      tags: [obwohl, register]
      prompt: Which answer is honest and still professional?
      options:
        - "Obwohl mir meine jetzige Arbeit gefällt, möchte ich mehr Verantwortung übernehmen."
        - "Obwohl mir meine jetzige Arbeit gefällt, ich möchte mehr Verantwortung übernehmen."
        - "Weil mein Chef unfähig ist und die Kollegen nerven."
      answer: "Obwohl mir meine jetzige Arbeit gefällt, möchte ich mehr Verantwortung übernehmen."
      feedback:
        "Obwohl mir meine jetzige Arbeit gefällt, ich möchte mehr Verantwortung übernehmen.": "When a subordinate clause comes first, the verb of the main clause follows straight after the comma: …, möchte ich …"
        "Weil mein Chef unfähig ist und die Kollegen nerven.": "Never speak badly of your current employer in an interview. Say what you are looking for, not what you are leaving behind."
      explanation: "obwohl sends its own verb to the end, and the main clause then begins with its verb. The content counts too: a reason that looks ahead."
    you: { text: "Obwohl mir meine jetzige Arbeit gefällt, möchte ich mehr Verantwortung übernehmen.", en: "Although I like my current job, I would like to take on more responsibility." }

  - lines:
      - { speaker: Frau Dr. Keller, text: "Was würden Sie als Ihre größte Stärke bezeichnen?", en: "What would you call your greatest strength?" }
    task:
      id: strengths
      type: cloze
      tags: [work, vocabulary]
      prompt: Complete your answer with words from the list. Two of them are not needed.
      text: "Ich bin ___ und arbeite gern im Team. In meiner letzten Stelle war ich für die Planung ___. Auch unter Druck ___ ich den Überblick."
      gaps: [[zuverlässig], [zuständig], [behalte]]
      bank: [zuverlässig, zuständig, behalte, zufrieden, verliere]
      explanation: "zuverlässig = reliable. zuständig für = responsible for. den Überblick behalten = to keep track of everything."
    you: { text: "Ich bin zuverlässig und arbeite gern im Team. Auch unter Druck behalte ich den Überblick.", en: "I am reliable and enjoy working in a team. Even under pressure I keep track of everything." }

  - task:
      id: contract
      type: multiple-choice
      tags: [listening, work]
      stimulus:
        kind: audio
        label: Frau Dr. Keller
        lines:
          - { speaker: Frau Dr. Keller, text: "Die Stelle ist zunächst auf zwei Jahre befristet, mit der Möglichkeit einer Verlängerung. Die Probezeit beträgt sechs Monate, und Sie hätten dreißig Tage Urlaub im Jahr." }
      prompt: Was erfahren Sie über den Vertrag?
      options:
        - "Er ist befristet, kann aber verlängert werden."
        - "Er ist unbefristet."
        - "Er endet nach sechs Monaten."
      answer: "Er ist befristet, kann aber verlängert werden."
      feedback:
        "Er ist unbefristet.": "zunächst auf zwei Jahre befristet: limited to two years for now."
        "Er endet nach sechs Monaten.": "Six months is the Probezeit, the trial period at the start, not the length of the contract."
      explanation: "befristet = for a fixed term. die Verlängerung = extension. die Probezeit = trial period."

  - lines:
      - { speaker: Frau Dr. Keller, text: "Haben Sie noch Fragen an uns?", en: "Do you have any questions for us?" }
    task:
      id: question
      type: multiple-choice
      tags: [register, work]
      prompt: Which question shows that you are interested in the work itself?
      options:
        - "Wie würde ein typischer Arbeitstag in Ihrem Team aussehen?"
        - "Nein, eigentlich ist alles klar."
        - "Wie viele Krankheitstage darf man haben?"
      answer: "Wie würde ein typischer Arbeitstag in Ihrem Team aussehen?"
      feedback:
        "Nein, eigentlich ist alles klar.": "Having no questions can look like a lack of interest. Prepare two or three about the tasks or the team."
        "Wie viele Krankheitstage darf man haben?": "Asking about sick days first sends the wrong signal. Begin with the work itself."
    you: { text: "Wie würde ein typischer Arbeitstag in Ihrem Team aussehen?", en: "What would a typical working day in your team look like?" }

  - lines:
      - { speaker: Frau Dr. Keller, text: "Sie würden vor allem Termine planen und mit unseren Kunden sprechen. Wann könnten Sie frühestens bei uns anfangen?", en: "You would mainly plan schedules and talk to our clients. When could you start with us at the earliest?" }
    task:
      id: start
      type: word-order
      tags: [da, konjunktiv 2]
      prompt: Say that you could start on the first of March, since your notice period is three months.
      answer: "Ich könnte am ersten März anfangen, da meine Kündigungsfrist drei Monate beträgt."
      explanation: "da gives a reason like weil and also sends the verb to the end: …, da meine Kündigungsfrist drei Monate beträgt."
    you: { text: "Ich könnte am ersten März anfangen, da meine Kündigungsfrist drei Monate beträgt.", en: "I could start on the first of March, since my notice period is three months." }

  - task:
      id: close
      type: speaking-task
      tags: [speaking, register]
      prompt: End the interview. Thank her for the conversation, say that the position interests you very much, and that you look forward to hearing from her.
      cards: [Dank, Interesse, Rückmeldung]
      phrases:
        - Vielen Dank für das angenehme Gespräch.
        - Die Stelle interessiert mich sehr.
        - Ich freue mich auf Ihre Rückmeldung.
      checklist:
        - I thanked her for the conversation
        - I said that the position interests me
        - I used sich freuen auf with the accusative
        - I stayed with Sie throughout
      sample: "Vielen Dank für das angenehme Gespräch. Die Stelle interessiert mich sehr, und ich freue mich auf Ihre Rückmeldung."
outro:
  - { speaker: Frau Dr. Keller, text: "Wir melden uns bis Ende der Woche bei Ihnen. Auf Wiedersehen!", en: "We will get back to you by the end of the week. Goodbye!" }
