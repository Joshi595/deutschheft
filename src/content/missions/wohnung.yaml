title: Viewing a flat
titleDe: Die Wohnungsbesichtigung
level: b1
order: 1
minutes: 9
icon: home
objective: Ask the right questions at a flat viewing, work out the real monthly cost, and leave a good impression on the landlady.
scene: >-
  You found a two-room flat in Cologne online. The landlady, Frau Brandt, is showing it this
  evening, and five other people want it too. How you speak matters as much as what you ask.
lessons: [b1.04, b1.07, b1.19]
phrases:
  - { de: "Vielen Dank, dass Sie sich Zeit für mich nehmen.", en: "Thank you for taking the time for me." }
  - { de: "Könnten Sie mir sagen, wie hoch die Kaution ist?", en: "Could you tell me how high the deposit is?" }
  - { de: "die Kaltmiete, die Nebenkosten, die Warmmiete", en: "rent without running costs, running costs, rent including them" }
  - { de: "Ich habe einen unbefristeten Vertrag.", en: "I have a permanent contract." }
  - { de: "Ich würde die Wohnung sehr gern mieten.", en: "I would very much like to rent the flat." }
  - { de: "Wann könnte ich mit Ihrer Entscheidung rechnen?", en: "When could I expect your decision?" }
practised:
  - Staying formal with someone who decides about you
  - Following a relative clause in a description
  - Asking indirectly with Könnten Sie mir sagen, …
  - Working out Warmmiete from Kaltmiete and Nebenkosten
steps:
  - lines:
      - { speaker: Frau Brandt, text: "Guten Abend! Sie kommen wegen der Wohnung, nehme ich an? Kommen Sie herein.", en: "Good evening! You are here about the flat, I assume? Come in." }
    task:
      id: greet
      type: multiple-choice
      tags: [register, politeness]
      prompt: How do you open, so that the first impression is a good one?
      options:
        - "Guten Abend, Frau Brandt. Vielen Dank, dass Sie sich Zeit für mich nehmen."
        - "Hallo! Danke, dass du Zeit hast."
        - "Guten Abend. Ich will die Wohnung sehen."
      answer: "Guten Abend, Frau Brandt. Vielen Dank, dass Sie sich Zeit für mich nehmen."
      feedback:
        "Hallo! Danke, dass du Zeit hast.": "Hallo and du are for friends. With a landlady you have never met, use Sie and a formal greeting."
        "Guten Abend. Ich will die Wohnung sehen.": "Correct German, but ich will sounds demanding. Thanking her for her time is the usual polite opening."
      explanation: "Greeting her by name and thanking her costs one sentence and sets the register for the whole visit."
    you: { text: "Guten Abend, Frau Brandt. Vielen Dank, dass Sie sich Zeit für mich nehmen.", en: "Good evening, Ms Brandt. Thank you for taking the time for me." }

  - lines:
      - { speaker: Frau Brandt, text: "Sehr gern. Das hier ist das Wohnzimmer, und nebenan liegt das Schlafzimmer, das zum Hof hinausgeht.", en: "My pleasure. This is the living room, and next door is the bedroom, which faces the courtyard." }
    task:
      id: courtyard
      type: true-false
      tags: [relative clauses, housing]
      prompt: Das Schlafzimmer liegt zur Straße.
      answer: false
      explanation: "das zum Hof hinausgeht is a relative clause about the bedroom. It faces the courtyard (der Hof), which is the quiet side."

  - task:
      id: kitchen
      type: fill-blank
      tags: [relative clauses, passive]
      prompt: "Ist das die Einbauküche, ___ im Inserat erwähnt wurde?"
      answers: [die]
      translation: Is that the fitted kitchen that was mentioned in the ad?
      hint: The pronoun takes its gender from Einbauküche and is the subject of its own clause.
      explanation: "die Einbauküche is feminine, and the pronoun is the subject of the relative clause, so it is die. erwähnt wurde is passive: was mentioned."
    you: { text: "Ist das die Einbauküche, die im Inserat erwähnt wurde?", en: "Is that the fitted kitchen that was mentioned in the ad?" }

  - lines:
      - { speaker: Frau Brandt, text: "Ja, genau. Die Küche bleibt in der Wohnung.", en: "Yes, exactly. The kitchen stays in the flat." }
    task:
      id: rent
      type: multiple-choice
      tags: [listening, housing]
      stimulus:
        kind: audio
        label: Frau Brandt
        lines:
          - { speaker: Frau Brandt, text: "Die Kaltmiete beträgt sechshundertachtzig Euro. Dazu kommen hundertfünfzig Euro Nebenkosten, also Heizung und Wasser. Strom und Internet zahlen Sie selbst." }
      prompt: Wie hoch ist die Warmmiete?
      options: ["830 €", "680 €", "150 €"]
      answer: "830 €"
      shuffle: false
      feedback:
        "680 €": "680 € is the Kaltmiete, the rent before running costs. Warmmiete = Kaltmiete + Nebenkosten."
        "150 €": "150 € are only the Nebenkosten."
      explanation: "The Warmmiete is what you transfer every month: Kaltmiete plus Nebenkosten, here 680 + 150."

  - task:
      id: electricity
      type: true-false
      tags: [listening, housing]
      stimulus:
        kind: audio
        label: Frau Brandt
        lines:
          - { speaker: Frau Brandt, text: "Die Kaltmiete beträgt sechshundertachtzig Euro. Dazu kommen hundertfünfzig Euro Nebenkosten, also Heizung und Wasser. Strom und Internet zahlen Sie selbst." }
      prompt: Listen once more. Strom ist in den Nebenkosten enthalten.
      answer: false
      explanation: "Strom und Internet zahlen Sie selbst: electricity and internet are your own contracts, on top of the Warmmiete."

  - task:
      id: deposit
      type: word-order
      tags: [indirect questions, politeness]
      prompt: Ask politely how high the deposit is. Use an indirect question.
      answer: "Könnten Sie mir sagen, wie hoch die Kaution ist?"
      explanation: "An indirect question is more polite than Wie hoch ist die Kaution?, and its verb moves to the end: …, wie hoch die Kaution ist."
    you: { text: "Könnten Sie mir sagen, wie hoch die Kaution ist?", en: "Could you tell me how high the deposit is?" }

  - lines:
      - { speaker: Frau Brandt, text: "Drei Monatskaltmieten. Und darf ich fragen, was Sie beruflich machen?", en: "Three months' rent without running costs. And may I ask what you do for a living?" }
    task:
      id: job
      type: multiple-choice
      tags: [seit, work]
      prompt: You have worked in nursing at the university hospital for two years, and your contract is permanent. Which answer helps you most?
      options:
        - "Ich arbeite seit zwei Jahren in der Pflege an der Uniklinik und habe einen unbefristeten Vertrag."
        - "Ich habe vor zwei Jahren in der Pflege an der Uniklinik gearbeitet."
        - "Ich arbeite für zwei Jahre in der Pflege an der Uniklinik."
      answer: "Ich arbeite seit zwei Jahren in der Pflege an der Uniklinik und habe einen unbefristeten Vertrag."
      feedback:
        "Ich habe vor zwei Jahren in der Pflege an der Uniklinik gearbeitet.": "vor zwei Jahren … gearbeitet says you worked there two years ago and no longer do. For something still going on, use seit with the present tense."
        "Ich arbeite für zwei Jahre in der Pflege an der Uniklinik.": "für zwei Jahre means a period of two years is planned, which sounds like a temporary job. Landlords listen for unbefristet."
      explanation: "seit + present tense covers “have been working”. unbefristet, permanent, is the word a landlord hopes to hear."
    you: { text: "Ich arbeite seit zwei Jahren in der Pflege an der Uniklinik und habe einen unbefristeten Vertrag.", en: "I have been working in nursing at the university hospital for two years and have a permanent contract." }

  - lines:
      - { speaker: Frau Brandt, text: "Das klingt gut. Haben Sie sonst noch Fragen?", en: "That sounds good. Do you have any other questions?" }
    task:
      id: close
      type: speaking-task
      tags: [speaking, konjunktiv 2]
      prompt: Close the viewing. Say that you like the flat very much, that you would like to rent it, and ask when she will decide.
      cards: [gefällt mir, würde gern mieten, Entscheidung?]
      phrases:
        - Die Wohnung gefällt mir sehr gut.
        - Ich würde sie sehr gern mieten.
        - Wann könnte ich mit Ihrer Entscheidung rechnen?
      checklist:
        - I said clearly that I like the flat
        - I used würde or könnte to stay polite
        - I asked about her decision
        - I stayed with Sie throughout
      sample: "Die Wohnung gefällt mir wirklich sehr gut, und ich würde sie sehr gern mieten. Wann könnte ich mit Ihrer Entscheidung rechnen?"
outro:
  - { speaker: Frau Brandt, text: "Ich melde mich bis Freitag bei Ihnen. Schicken Sie mir bitte noch Ihre Unterlagen.", en: "I will get back to you by Friday. Please send me your documents as well." }
