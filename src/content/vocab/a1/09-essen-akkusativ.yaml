lesson: a1.09
items:
  - id: essen
    de: essen
    en: to eat
    pos: verb
    example: Wir essen den Salat.
    exampleEn: We are eating the salad.
  - id: moegen
    de: mögen
    en: to like
    pos: verb
    example: Ich mag Kaffee.
    exampleEn: I like coffee.
  - id: moechten
    de: möchten
    en: would like
    pos: verb
    example: Ich möchte einen Tee, bitte.
    exampleEn: I would like a tea, please.
  - id: nehmen
    de: nehmen
    en: to take
    pos: verb
    example: Ich nehme den Fisch.
    exampleEn: I will have the fish.
  - id: brauchen
    de: brauchen
    en: to need
    pos: verb
    example: Ich brauche einen Stift.
    exampleEn: I need a pen.
  - id: zahlen
    de: zahlen
    en: to pay
    pos: verb
    example: Wir möchten zahlen.
    exampleEn: We would like to pay.
  - id: brot
    de: Brot
    en: bread
    pos: noun
    article: das
    plural: Brote
    example: Ich kaufe ein Brot.
    exampleEn: I am buying a loaf of bread.
  - id: broetchen
    de: Brötchen
    en: bread roll
    pos: noun
    article: das
    plural: Brötchen
