lesson: a2.01
items:
  - id: freundlich
    de: freundlich
    en: friendly
    pos: adjective
    example: Sie ist sehr freundlich.
    exampleEn: She is very friendly.
  - id: unfreundlich
    de: unfreundlich
    en: unfriendly
    pos: adjective
    example: Der Kellner war ziemlich unfreundlich.
    exampleEn: The waiter was rather unfriendly.
  - id: intelligent
    de: intelligent
    en: intelligent
    pos: adjective
    example: Er ist sehr intelligent.
    exampleEn: He is very intelligent.
  - id: fleissig
    de: fleißig
    en: hard-working, diligent
    pos: adjective
    example: Die Schüler sind fleißig.
    exampleEn: The pupils are hard-working.
  - id: faul
    de: faul
    en: lazy
    pos: adjective
    example: Am Sonntag bin ich faul.
    exampleEn: On Sundays I am lazy.
  - id: humorvoll
    de: humorvoll
    en: funny, having a sense of humour
    pos: adjective
    example: Mein Freund ist sehr humorvoll.
    exampleEn: My friend is very funny.
  - id: ehrlich
    de: ehrlich
    en: honest
    pos: adjective
    example: Er ist immer ehrlich.
    exampleEn: He is always honest.
  - id: mutig
    de: mutig
    en: brave
    pos: adjective
    example: Sie ist sehr mutig.
    exampleEn: She is very brave.
  - id: feige
    de: feige
    en: cowardly
    pos: adjective
    example: Sei nicht so feige!
    exampleEn: Don't be such a coward!
  - id: selbstbewusst
    de: selbstbewusst
    en: self-confident
    pos: adjective
    example: Er wirkt sehr selbstbewusst.
    exampleEn: He seems very self-confident.
  - id: schuechtern
    de: schüchtern
    en: shy
    pos: adjective
    example: Das Kind ist schüchtern.
    exampleEn: The child is shy.
  - id: optimistisch
    de: optimistisch
    en: optimistic
    pos: adjective
    example: Sie bleibt immer optimistisch.
    exampleEn: She always stays optimistic.
  - id: pessimistisch
    de: pessimistisch
    en: pessimistic
    pos: adjective
    example: Er ist zu pessimistisch.
    exampleEn: He is too pessimistic.
  - id: geduldig
    de: geduldig
    en: patient
    pos: adjective
    example: Unsere Lehrerin ist sehr geduldig.
    exampleEn: Our teacher is very patient.
  - id: zuverlaessig
    de: zuverlässig
    en: reliable
    pos: adjective
    example: Mein Kollege ist zuverlässig.
    exampleEn: My colleague is reliable.
  - id: sanft
    de: sanft
    en: gentle
    pos: adjective
    example: Ihre Stimme ist sanft.
    exampleEn: Her voice is gentle.
