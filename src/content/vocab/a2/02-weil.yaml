lesson: a2.02
items:
  - id: warum
    de: warum
    en: why
    pos: adverb
    example: Warum lernst du Deutsch?
    exampleEn: Why are you learning German?
  - id: weil
    de: weil
    en: because (verb goes to the end)
    pos: conjunction
    example: Ich esse, weil ich Hunger habe.
    exampleEn: I am eating because I am hungry.
  - id: denn
    de: denn
    en: because, for (normal word order)
    pos: conjunction
    example: Ich esse, denn ich habe Hunger.
    exampleEn: I am eating, for I am hungry.
  - id: grund
    de: Grund
    en: reason
    pos: noun
    article: der
    plural: Gründe
    example: Das ist ein guter Grund.
    exampleEn: That is a good reason.
  - id: muede
    de: müde
    en: tired
    pos: adjective
    example: Ich schlafe, weil ich müde bin.
    exampleEn: I am sleeping because I am tired.
  - id: krank
    de: krank
    en: ill, sick
    pos: adjective
    example: Sie bleibt im Bett, weil sie krank ist.
    exampleEn: She is staying in bed because she is ill.
  - id: hunger-haben
    de: Hunger haben
    en: to be hungry
    pos: phrase
    example: Ich esse, weil ich Hunger habe.
    exampleEn: I am eating because I am hungry.
  - id: durst-haben
    de: Durst haben
    en: to be thirsty
    pos: phrase
    example: Er trinkt Wasser, weil er Durst hat.
    exampleEn: He is drinking water because he is thirsty.
  - id: zeit-haben
    de: Zeit haben
    en: to have time
    pos: phrase
    example: Ich komme, weil ich Zeit habe.
    exampleEn: I am coming because I have time.
  - id: lust-haben
    de: Lust haben
    en: to feel like (doing something)
    pos: phrase
    example: Ich gehe spazieren, weil ich Lust habe.
    exampleEn: I am going for a walk because I feel like it.
  - id: angst-haben
    de: Angst haben
    en: to be afraid
    pos: phrase
    example: Ich bleibe hier, weil ich Angst vor Hunden habe.
    exampleEn: I am staying here because I am afraid of dogs.
  - id: schmerzen-haben
    de: Schmerzen haben
    en: to be in pain
    pos: phrase
    example: Ich kann nicht arbeiten, weil ich Schmerzen habe.
    exampleEn: I cannot work because I am in pain.
  - id: mir-ist-kalt
    de: Mir ist kalt.
    en: I am cold.
    pos: phrase
    example: Ich brauche einen Mantel, weil mir kalt ist.
    exampleEn: I need a coat because I am cold.
  - id: wichtig
    de: wichtig
    en: important
    pos: adjective
    example: Ich lerne Deutsch, weil es wichtig ist.
    exampleEn: I am learning German because it is important.
  - id: vergessen
    de: vergessen
    en: to forget
    pos: verb
    example: Ich habe seine Nummer vergessen.
    exampleEn: I have forgotten his number.
