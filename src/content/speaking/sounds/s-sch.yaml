title: "s, ß and sch"
name: three hissing sounds that English spells differently
order: 8
how:
  - A single s before a vowel buzzes like English "z". Sonne begins like "zonne".
  - ß and ss never buzz. They are the sharp s of "kiss".
  - sch is English "sh". At the start of a word, sp and st are said "shp" and "sht", as in Sport and Stadt.
trap: English speakers say a sharp s at the start of Sonne, and "st" in Stadt instead of "sht".
