title: "ch after a, o and u"
name: a rough breath from the back of the mouth
order: 5
how:
  - Say "k" and notice where the back of your tongue touches.
  - Bring your tongue to the same place, but do not close the gap completely.
  - Breathe out through it. That scraping breath is the ch of Buch. It comes after a, o, u and au.
trap: English speakers say "k". Then Nacht (night) turns into nackt (naked).
