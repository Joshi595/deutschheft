title: "r"
name: made in the throat, not with the tip of the tongue
order: 6
how:
  - At the start of a syllable the r is made at the back, where you gargle. Say "ach" and add your voice.
  - Keep the tip of your tongue down behind your lower teeth. It does nothing.
  - After a vowel the r almost disappears. The ending -er sounds like a short "a", so Lehrer ends like "Lehra".
trap: English speakers curl the tongue tip back. That is understood, but it is the clearest sign of an English accent.
