title: "ü"
name: an "ee" said with rounded lips
order: 1
how:
  - Say a long English "ee", as in "see", and hold it.
  - Without moving your tongue, round your lips as if to whistle.
  - The sound that comes out is ü. The short ü, as in fünf, is the same shape, only quicker.
trap: English speakers say "oo" as in "food". Then Mütter (mothers) turns into Mutter (mother).
