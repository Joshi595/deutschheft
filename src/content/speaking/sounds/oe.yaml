title: "ö"
name: an "eh" said with rounded lips
order: 2
how:
  - Say "eh", the vowel of "bed", and hold it.
  - Keep your tongue where it is and round your lips.
  - That is ö. In schön it is long, in zwölf it is short.
trap: English speakers say "o" or "er". Then schön (beautiful) turns into schon (already).
