title: "ä"
name: the "e" of "bed"
order: 3
how:
  - Say the vowel of English "bed". That is the short ä, as in Äpfel.
  - For the long ä, as in Käse, hold the same sound longer and open your mouth a little more.
  - The two dots always move the sound away from "ah" towards "eh".
trap: English speakers read ä as a plain "a". Then Äpfel (apples) turns into Apfel (apple).
