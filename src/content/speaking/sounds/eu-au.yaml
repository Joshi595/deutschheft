title: "eu, äu and au"
name: 'the sounds "oy" and "ow"'
order: 11
how:
  - eu and äu are the same sound. Both are English "oy", as in "boy". Neun sounds like "noyn".
  - au is English "ow", as in "now". Haus sounds like "house".
  - Glide from the first position to the second in one movement. It is one syllable, not two.
trap: English speakers read eu as "you" and split the sound in two. Then neun (nine) is not understood, or sounds like nein (no).
