title: "long and short vowels"
name: the length of a vowel changes the word
order: 12
how:
  - A vowel is long before a single consonant, before h, and when it is doubled. Staat, Sohn and Name are long.
  - A vowel is short before two consonants. Stadt, Sonne and Mann are short.
  - Hold a long vowel about twice as long. Cut a short vowel off quickly and close onto the consonant.
trap: English speakers make every vowel medium long. Then Staat (state) and Stadt (town) sound the same.
