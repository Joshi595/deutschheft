title: "ei and ie"
name: 'ei is "eye" and ie is "ee", never the other way round'
order: 10
how:
  - Look at the second letter and say its English name.
  - ei ends in i, so it sounds like "eye". Wein sounds like "vine".
  - ie ends in e, so it sounds like "ee". Wien sounds like "veen".
trap: English speakers swap them, because "ie" and "ei" are unreliable in English. Then Wien (Vienna) turns into Wein (wine).
words:
  - { de: "nein", en: "no" }
  - { de: "mein", en: "my" }
  - { de: "klein", en: "small" }
  - { de: "Arbeit", en: "work" }
  - { de: "sie", en: "she, they" }
  - { de: "viel", en: "much" }
  - { de: "Brief", en: "letter" }
