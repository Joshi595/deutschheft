title: "ch after e and i"
name: a soft hiss, as at the start of "huge"
order: 4
how:
  - Say "yes" and hold the y. Your tongue is high and close to the roof of your mouth.
  - Now breathe out through that gap without using your voice.
  - That hiss is the ch of ich. It comes after e, i, ä, ö, ü and after consonants, and in the ending -ig.
trap: English speakers say "k" or "sh". Then nicht (not) turns into nickt (nods), and Kirche (church) into Kirsche (cherry).
