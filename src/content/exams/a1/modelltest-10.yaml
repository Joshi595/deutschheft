level: a1
title: Modelltest 10
description: >-
  A practice exam in the format of Start Deutsch 1, with the real time limits. Topics: the flat,
  furniture, neighbours and free time at home.
passMark: 60
scoring: total
modules:
  - skill: listening
    minutes: 20
    points: 25
    parts:
      - title: "Hören, Teil 1"
        instructions: Was ist richtig? Wählen Sie a, b oder c. Sie hören jeden Text zweimal.
        items:
          - id: h1-1
            type: multiple-choice
            stimulus:
              kind: audio
              label: Gespräch 1
              lines:
                - speaker: Frau
                  text: "Wie groß ist die Wohnung?"
                - speaker: Vermieter
                  text: "Sie hat drei Zimmer und ist siebzig Quadratmeter groß."
            prompt: Wie viele Zimmer hat die Wohnung?
            options: ["3", "2", "7"]
            answer: "3"
          - id: h1-2
            type: multiple-choice
            stimulus:
              kind: audio
              label: Gespräch 2
              lines:
                - speaker: Mann
                  text: "Was kostet die Wohnung?"
                - speaker: Vermieterin
                  text: "Die Miete ist sechshundertfünfzig Euro im Monat."
            prompt: Was kostet die Wohnung im Monat?
            options: ["650 Euro", "560 Euro", "615 Euro"]
            answer: "650 Euro"
          - id: h1-3
            type: multiple-choice
            stimulus:
              kind: audio
              label: Gespräch 3
              lines:
                - speaker: Frau
                  text: "Wohin stellen wir das Sofa?"
                - speaker: Mann
                  text: "Ins Wohnzimmer, neben das Fenster."
            prompt: Wohin kommt das Sofa?
            options: [ins Wohnzimmer, ins Schlafzimmer, in die Küche]
            answer: ins Wohnzimmer
          - id: h1-4
            type: multiple-choice
            stimulus:
              kind: audio
              label: Gespräch 4
              lines:
                - speaker: Nachbar
                  text: "Hallo, ich bin Ihr neuer Nachbar. Ich wohne im zweiten Stock."
                - speaker: Frau
                  text: "Willkommen! Ich wohne im Erdgeschoss."
            prompt: Wo wohnt der neue Nachbar?
            options: [im zweiten Stock, im Erdgeschoss, im ersten Stock]
            answer: im zweiten Stock
          - id: h1-5
            type: multiple-choice
            stimulus:
              kind: audio
              label: Gespräch 5
              lines:
                - speaker: Mann
                  text: "Was machst du heute Abend?"
                - speaker: Frau
                  text: "Ich bleibe zu Hause und sehe einen Film."
            prompt: Was macht die Frau heute Abend?
            options: [Sie sieht einen Film., Sie geht ins Kino., Sie besucht Freunde.]
            answer: Sie sieht einen Film.
          - id: h1-6
            type: multiple-choice
            stimulus:
              kind: audio
              label: Gespräch 6
              lines:
                - speaker: Frau
                  text: "Ist die Küche neu?"
                - speaker: Vermieter
                  text: "Ja, die Küche ist neu, aber das Bad ist alt."
            prompt: Was ist neu?
            options: [die Küche, das Bad, das Wohnzimmer]
            answer: die Küche

      - title: "Hören, Teil 2"
        instructions: Richtig oder falsch? Sie hören jeden Text nur einmal.
        items:
          - id: h2-1
            type: true-false
            stimulus:
              kind: audio
              label: Durchsage 1
              plays: 1
              lines:
                - text: "Im Möbelhaus Wohnwelt: Alle Betten heute zwanzig Prozent billiger."
            prompt: Die Betten sind heute billiger.
            answer: true
          - id: h2-2
            type: true-false
            stimulus:
              kind: audio
              label: Durchsage 2
              plays: 1
              lines:
                - text: "Achtung, liebe Mieter: Morgen gibt es von acht bis zwölf Uhr kein Wasser."
            prompt: Morgen Nachmittag gibt es kein Wasser.
            answer: false
          - id: h2-3
            type: true-false
            stimulus:
              kind: audio
              label: Durchsage 3
              plays: 1
              lines:
                - text: "Der Hausmeister ist im Urlaub. Bei Problemen rufen Sie bitte Herrn Kurz an."
            prompt: Der Hausmeister ist heute da.
            answer: false
          - id: h2-4
            type: true-false
            stimulus:
              kind: audio
              label: Durchsage 4
              plays: 1
              lines:
                - text: "Der Müll wird diese Woche erst am Freitag abgeholt."
            prompt: Der Müll wird am Freitag abgeholt.
            answer: true

      - title: "Hören, Teil 3"
        instructions: Was ist richtig? Wählen Sie a, b oder c. Sie hören jeden Text zweimal.
        items:
          - id: h3-1
            type: multiple-choice
            stimulus:
              kind: audio
              label: Nachricht 1
              lines:
                - text: "Hallo Herr Popescu, hier ist Ihr Vermieter. Der Elektriker kommt morgen um zehn Uhr. Bitte sind Sie zu Hause."
            prompt: Wer kommt morgen?
            options: [der Elektriker, der Vermieter, der Nachbar]
            answer: der Elektriker
          - id: h3-2
            type: multiple-choice
            stimulus:
              kind: audio
              label: Nachricht 2
              lines:
                - text: "Hi Lena, wir ziehen am Samstag um! Kannst du um neun Uhr kommen und helfen? Danach essen wir Pizza."
            prompt: Was ist am Samstag?
            options: [ein Umzug, eine Party, ein Fußballspiel]
            answer: ein Umzug
          - id: h3-3
            type: multiple-choice
            stimulus:
              kind: audio
              label: Nachricht 3
              lines:
                - text: "Guten Tag, hier ist das Möbelhaus. Ihr Schrank kommt nicht am Montag, sondern am Mittwoch."
            prompt: Wann kommt der Schrank?
            options: [am Mittwoch, am Montag, am Freitag]
            answer: am Mittwoch
          - id: h3-4
            type: multiple-choice
            stimulus:
              kind: audio
              label: Nachricht 4
              lines:
                - text: "Hallo, hier ist Frau Berger von oben. Ich habe Ihren Schlüssel. Er war im Briefkasten."
            prompt: Wo war der Schlüssel?
            options: [im Briefkasten, im Auto, im Keller]
            answer: im Briefkasten
          - id: h3-5
            type: multiple-choice
            stimulus:
              kind: audio
              label: Nachricht 5
              lines:
                - text: "Hallo Schatz, ich kaufe auf dem Heimweg eine neue Lampe für das Schlafzimmer. Brauchen wir noch etwas?"
            prompt: Was kauft die Person?
            options: [eine Lampe, ein Bett, einen Teppich]
            answer: eine Lampe

  - skill: reading
    minutes: 25
    points: 25
    parts:
      - title: "Lesen, Teil 1 (Text 1)"
        instructions: Lesen Sie den Text und die Aufgaben. Richtig oder falsch?
        stimulus:
          kind: text
          label: E-Mail
          text: |
            Hallo Rami,
            wir haben eine neue Wohnung! Sie hat vier Zimmer und einen großen Balkon. Die Kinder haben jetzt jeder ein eigenes Zimmer.
            Die Wohnung ist im dritten Stock, aber es gibt einen Aufzug.
            Komm uns bald besuchen!
            Nadia
        items:
          - id: l1-1
            type: true-false
            prompt: Die neue Wohnung hat einen Balkon.
            answer: true
          - id: l1-2
            type: true-false
            prompt: Die Kinder haben ein Zimmer zusammen.
            answer: false
          - id: l1-3
            type: true-false
            prompt: Im Haus gibt es keinen Aufzug.
            answer: false

      - title: "Lesen, Teil 1 (Text 2)"
        instructions: Lesen Sie den Text und die Aufgaben. Richtig oder falsch?
        stimulus:
          kind: text
          label: Zettel im Treppenhaus
          text: |
            Liebe Nachbarn,
            wir feiern am Samstag ab 20 Uhr eine Party. Es wird vielleicht ein bisschen laut. Kommen Sie doch auch!
            Familie Kowalski, 1. Stock
        items:
          - id: l1-4
            type: true-false
            prompt: Familie Kowalski lädt die Nachbarn ein.
            answer: true
          - id: l1-5
            type: true-false
            prompt: Die Party beginnt am Nachmittag.
            answer: false

      - title: "Lesen, Teil 2"
        instructions: Lesen Sie die Situationen und die Anzeigen. Wo finden Sie Informationen? Wählen Sie a oder b.
        items:
          - id: l2-1
            type: multiple-choice
            stimulus:
              kind: text
              label: Anzeigen
              text: |
                a) Umzugsfirma Schnell: Wir helfen beim Umzug, mit Lkw.

                b) Möbelhaus Nord: neue Möbel, Lieferung kostenlos.
            prompt: Sie ziehen um und brauchen Hilfe mit den Möbeln.
            options: [Anzeige a, Anzeige b]
            answer: Anzeige a
            shuffle: false
          - id: l2-2
            type: multiple-choice
            stimulus:
              kind: text
              label: Anzeigen
              text: |
                a) 2-Zimmer-Wohnung, 55 m², 600 Euro, keine Haustiere.

                b) 2-Zimmer-Wohnung, 60 m², 640 Euro, Haustiere erlaubt.
            prompt: Sie haben einen Hund und suchen eine Wohnung.
            options: [Anzeige a, Anzeige b]
            answer: Anzeige b
            shuffle: false
          - id: l2-3
            type: multiple-choice
            stimulus:
              kind: text
              label: Anzeigen
              text: |
                a) Elektriker Funke: Reparaturen auch am Wochenende.

                b) Maler Bunt: Wir streichen Ihre Wohnung.
            prompt: Am Sonntag funktioniert Ihr Licht nicht.
            options: [Anzeige a, Anzeige b]
            answer: Anzeige a
            shuffle: false
          - id: l2-4
            type: multiple-choice
            stimulus:
              kind: text
              label: Anzeigen
              text: |
                a) Flohmarkt: gebrauchte Möbel, Sonntag 8–14 Uhr.

                b) Designermöbel: Sofas ab 2000 Euro.
            prompt: Sie suchen einen billigen Tisch.
            options: [Anzeige a, Anzeige b]
            answer: Anzeige a
            shuffle: false
          - id: l2-5
            type: multiple-choice
            stimulus:
              kind: text
              label: Anzeigen
              text: |
                a) Spieleabend im Nachbarschaftszentrum: jeden Freitag 19 Uhr, für alle.

                b) Seniorentreff: Kaffee und Kuchen, Dienstag 15 Uhr, ab 65 Jahren.
            prompt: Sie sind 30 und möchten Ihre Nachbarn kennenlernen.
            options: [Anzeige a, Anzeige b]
            answer: Anzeige a
            shuffle: false

      - title: "Lesen, Teil 3"
        instructions: Lesen Sie die Texte und die Aufgaben. Richtig oder falsch?
        items:
          - id: l3-1
            type: true-false
            stimulus:
              kind: text
              label: Im Treppenhaus
              text: "Fahrräder bitte in den Keller."
            prompt: Die Fahrräder sollen im Keller stehen.
            answer: true
          - id: l3-2
            type: true-false
            stimulus:
              kind: text
              label: Am Haus
              text: "Ruhezeit: 22 bis 6 Uhr."
            prompt: Um 23 Uhr dürfen Sie laute Musik hören.
            answer: false
          - id: l3-3
            type: true-false
            stimulus:
              kind: text
              label: An der Waschküche
              text: "Waschmaschine nur bis 20 Uhr benutzen."
            prompt: Man kann um 21 Uhr Wäsche waschen.
            answer: false
          - id: l3-4
            type: true-false
            stimulus:
              kind: text
              label: Am Briefkasten
              text: "Bitte keine Werbung!"
            prompt: Hier soll keine Werbung in den Briefkasten.
            answer: true
          - id: l3-5
            type: true-false
            stimulus:
              kind: text
              label: Im Hof
              text: "Mülltonnen: blau = Papier, gelb = Plastik."
            prompt: Papier kommt in die gelbe Tonne.
            answer: false

  - skill: writing
    minutes: 20
    points: 25
    parts:
      - title: "Schreiben, Teil 1"
        instructions: Ihr Freund Marek meldet sich nach dem Umzug an. Im Formular fehlen fünf Informationen. Helfen Sie ihm.
        items:
          - id: s1
            type: form
            situation: "Marek Wiśniewski ist am 1. Oktober von Kassel nach Erfurt umgezogen. Seine neue Adresse ist Blumenweg 3. Er wohnt dort mit seiner Frau und seinen zwei Kindern. Er ist polnisch."
            fields:
              - { label: Einzugsdatum, answers: ["01.10.", "1.10.", "1. Oktober"] }
              - { label: Alte Adresse (Stadt), answers: [Kassel] }
              - { label: Neue Adresse, answers: [Blumenweg 3] }
              - { label: Personen im Haushalt, answers: ["4", vier] }
              - { label: Staatsangehörigkeit, answers: [polnisch] }

      - title: "Schreiben, Teil 2"
        instructions: Schreiben Sie zu jedem Punkt ein bis zwei Sätze (circa 30 Wörter). Vergessen Sie nicht die Anrede und den Gruß.
        items:
          - id: s2
            type: writing-task
            prompt: "In Ihrer Wohnung ist die Heizung kaputt. Schreiben Sie Ihrem Vermieter, Herrn Graf, eine E-Mail."
            points:
              - Was ist kaputt?
              - Seit wann?
              - Bitten Sie um schnelle Hilfe.
            minWords: 25
            sample: "Sehr geehrter Herr Graf, in meiner Wohnung ist die Heizung kaputt. Sie funktioniert seit Montag nicht. Es ist sehr kalt. Können Sie bitte schnell einen Techniker schicken? Mit freundlichen Grüßen, Nina Popović"

  - skill: speaking
    minutes: 15
    points: 25
    parts:
      - title: "Sprechen, Teil 1: sich vorstellen"
        instructions: Stellen Sie sich vor. Buchstabieren Sie danach Ihre Straße und sagen Sie Ihre Hausnummer.
        items:
          - id: sp1
            type: speaking-task
            prompt: "Stellen Sie sich bitte vor. Buchstabieren Sie dann Ihre Straße und sagen Sie Ihre Hausnummer."
            cards: [Name?, Alter?, Land?, Wohnort?, Sprachen?, Beruf?, Hobby?]
            checklist:
              - I said something for all seven cue words
              - I spelled the name of my street
              - I said my house number
            sample: "Hallo, ich heiße Sara Haile. Ich bin neunundzwanzig Jahre alt und komme aus Eritrea. Ich wohne in Kiel. Ich spreche Tigrinya, Englisch und Deutsch. Ich bin Altenpflegerin. Mein Hobby ist Laufen. Meine Straße ist der Parkweg: P, A, R, K, W, E, G. Meine Hausnummer ist achtzehn."

      - title: "Sprechen, Teil 2: um Informationen bitten und Informationen geben"
        instructions: Stellen Sie zu jeder Karte eine Frage und antworten Sie selbst darauf.
        items:
          - id: sp2a
            type: speaking-task
            prompt: "Thema: Wohnen. Stellen Sie zu jeder Karte eine Frage und geben Sie eine Antwort."
            cards: [Balkon, Küche, Miete]
            checklist:
              - I asked a real question for each card
              - I answered each question in a full sentence
            sample: "Haben Sie einen Balkon? Ja, ich habe einen kleinen Balkon. Ist Ihre Küche groß? Nein, sie ist klein. Wie hoch ist Ihre Miete? Meine Miete ist fünfhundert Euro."
          - id: sp2b
            type: speaking-task
            prompt: "Thema: Freizeit zu Hause. Stellen Sie zu jeder Karte eine Frage und geben Sie eine Antwort."
            cards: [Fernsehen, Bücher, Musik]
            checklist:
              - I asked a real question for each card
              - I used at least two different question words
            sample: "Sehen Sie oft fern? Nein, nur am Wochenende. Was lesen Sie gern? Ich lese gern Krimis. Welche Musik hören Sie? Ich höre gern Jazz."

      - title: "Sprechen, Teil 3: Bitten formulieren und darauf reagieren"
        instructions: Formulieren Sie zu jeder Karte eine Bitte und reagieren Sie darauf.
        items:
          - id: sp3
            type: speaking-task
            prompt: "Formulieren Sie zu jeder Karte eine Bitte und eine Antwort."
            cards: [Musik, Schlüssel, Kiste, Blumen]
            checklist:
              - I made a polite request for each card
              - I gave a response to each request
            sample: "Machen Sie bitte die Musik leiser. Oh, Entschuldigung, natürlich. Können Sie meinen Schlüssel nehmen? Ja, gern. Hilfst du mir bitte mit der Kiste? Klar. Gießen Sie bitte im Urlaub meine Blumen? Ja, kein Problem."
