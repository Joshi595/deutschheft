level: a1
title: Modelltest 3
description: >-
  A practice exam in the format of Start Deutsch 1, with the real time limits. Topics: travel,
  the station, the hotel and directions.
passMark: 60
scoring: total
modules:
  - skill: listening
    minutes: 20
    points: 25
    parts:
      - title: "Hören, Teil 1"
        instructions: Was ist richtig? Wählen Sie a, b oder c. Sie hören jeden Text zweimal.
        items:
          - id: h1-1
            type: multiple-choice
            stimulus:
              kind: audio
              label: Gespräch 1
              lines:
                - speaker: Frau
                  text: "Eine Fahrkarte nach Berlin, bitte."
                - speaker: Mann
                  text: "Hin und zurück? Das kostet achtundfünfzig Euro."
                - speaker: Frau
                  text: "Nein, nur hin, bitte."
                - speaker: Mann
                  text: "Dann neunundzwanzig Euro."
            prompt: Was kostet die Fahrkarte?
            options: ["29 Euro", "58 Euro", "92 Euro"]
            answer: "29 Euro"
          - id: h1-2
            type: multiple-choice
            stimulus:
              kind: audio
              label: Gespräch 2
              lines:
                - speaker: Mann
                  text: "Entschuldigung, wo ist die Post?"
                - speaker: Frau
                  text: "Gehen Sie geradeaus und dann links. Die Post ist neben der Bank."
            prompt: Wo ist die Post?
            options: [neben der Bank, neben dem Bahnhof, neben der Apotheke]
            answer: neben der Bank
          - id: h1-3
            type: multiple-choice
            stimulus:
              kind: audio
              label: Gespräch 3
              lines:
                - speaker: Gast
                  text: "Wann gibt es Frühstück?"
                - speaker: Rezeption
                  text: "Von sieben bis zehn Uhr. Am Sonntag bis elf."
            prompt: Bis wann gibt es am Sonntag Frühstück?
            options: ["bis 11 Uhr", "bis 10 Uhr", "bis 7 Uhr"]
            answer: "bis 11 Uhr"
          - id: h1-4
            type: multiple-choice
            stimulus:
              kind: audio
              label: Gespräch 4
              lines:
                - speaker: Frau
                  text: "Fährt der Zug nach Hamburg von Gleis drei?"
                - speaker: Mann
                  text: "Nein, heute von Gleis sechs."
            prompt: Von welchem Gleis fährt der Zug?
            options: [Gleis 6, Gleis 3, Gleis 8]
            answer: Gleis 6
          - id: h1-5
            type: multiple-choice
            stimulus:
              kind: audio
              label: Gespräch 5
              lines:
                - speaker: Mann
                  text: "Wie lange bleibst du in Italien?"
                - speaker: Frau
                  text: "Zwei Wochen. Ich komme am zwanzigsten Juli zurück."
            prompt: Wann kommt die Frau zurück?
            options: [am 20. Juli, am 2. Juli, am 12. Juli]
            answer: am 20. Juli
          - id: h1-6
            type: multiple-choice
            stimulus:
              kind: audio
              label: Gespräch 6
              lines:
                - speaker: Gast
                  text: "Ich möchte ein Zimmer mit Dusche."
                - speaker: Rezeption
                  text: "Wir haben ein Einzelzimmer mit Dusche im dritten Stock."
            prompt: In welchem Stock ist das Zimmer?
            options: [im dritten Stock, im ersten Stock, im Erdgeschoss]
            answer: im dritten Stock

      - title: "Hören, Teil 2"
        instructions: Richtig oder falsch? Sie hören jeden Text nur einmal.
        items:
          - id: h2-1
            type: true-false
            stimulus:
              kind: audio
              label: Durchsage 1
              plays: 1
              lines:
                - text: "Der Regionalexpress nach Dresden hat heute zwanzig Minuten Verspätung."
            prompt: Der Zug nach Dresden kommt pünktlich.
            answer: false
          - id: h2-2
            type: true-false
            stimulus:
              kind: audio
              label: Durchsage 2
              plays: 1
              lines:
                - text: "Liebe Reisende, unser Flugzeug landet in zehn Minuten in München. Bitte schließen Sie Ihre Gurte."
            prompt: Das Flugzeug landet bald.
            answer: true
          - id: h2-3
            type: true-false
            stimulus:
              kind: audio
              label: Durchsage 3
              plays: 1
              lines:
                - text: "Die Touristeninformation ist heute wegen eines Festes geschlossen. Morgen sind wir ab neun Uhr wieder da."
            prompt: Die Touristeninformation ist heute geöffnet.
            answer: false
          - id: h2-4
            type: true-false
            stimulus:
              kind: audio
              label: Durchsage 4
              plays: 1
              lines:
                - text: "Nächste Haltestelle: Rathaus. Hier können Sie in die Linie fünf umsteigen."
            prompt: Am Rathaus kann man in die Linie 5 umsteigen.
            answer: true

      - title: "Hören, Teil 3"
        instructions: Was ist richtig? Wählen Sie a, b oder c. Sie hören jeden Text zweimal.
        items:
          - id: h3-1
            type: multiple-choice
            stimulus:
              kind: audio
              label: Nachricht 1
              lines:
                - text: "Hallo Anna, hier ist Marco. Mein Zug kommt um sechzehn Uhr fünfzehn an. Holst du mich am Bahnhof ab?"
            prompt: Wann kommt Marco an?
            options: ["um 16:15 Uhr", "um 15:16 Uhr", "um 16:50 Uhr"]
            answer: "um 16:15 Uhr"
          - id: h3-2
            type: multiple-choice
            stimulus:
              kind: audio
              label: Nachricht 2
              lines:
                - text: "Guten Tag, hier ist das Hotel Seeblick. Ihr Zimmer ist leider erst ab fünfzehn Uhr fertig. Sie können Ihr Gepäck aber schon an der Rezeption lassen."
            prompt: Was kann der Gast schon vor 15 Uhr machen?
            options: [das Gepäck abgeben, ins Zimmer gehen, frühstücken]
            answer: das Gepäck abgeben
          - id: h3-3
            type: multiple-choice
            stimulus:
              kind: audio
              label: Nachricht 3
              lines:
                - text: "Hallo, hier ist das Reisebüro Sonne. Ihre Reise nach Spanien kostet mit Hotel neunhundert Euro. Bitte rufen Sie uns zurück."
            prompt: Wohin geht die Reise?
            options: [nach Spanien, nach Italien, nach Portugal]
            answer: nach Spanien
          - id: h3-4
            type: multiple-choice
            stimulus:
              kind: audio
              label: Nachricht 4
              lines:
                - text: "Hi, ich bin's, Julia. Ich habe meinen Koffer im Taxi vergessen! Hast du die Nummer von der Taxifirma?"
            prompt: Was hat Julia vergessen?
            options: [ihren Koffer, ihr Handy, ihre Fahrkarte]
            answer: ihren Koffer
          - id: h3-5
            type: multiple-choice
            stimulus:
              kind: audio
              label: Nachricht 5
              lines:
                - text: "Hallo Herr Braun, hier ist die Autovermietung. Sie können das Auto morgen um acht Uhr abholen. Bitte bringen Sie Ihren Führerschein mit."
            prompt: Was soll Herr Braun mitbringen?
            options: [den Führerschein, das Auto, Geld]
            answer: den Führerschein

  - skill: reading
    minutes: 25
    points: 25
    parts:
      - title: "Lesen, Teil 1 (Text 1)"
        instructions: Lesen Sie den Text und die Aufgaben. Richtig oder falsch?
        stimulus:
          kind: text
          label: Postkarte
          text: |
            Liebe Sabine,
            viele Grüße aus Wien! Das Wetter ist super, jeden Tag scheint die Sonne. Unser Hotel ist im Zentrum. Gestern waren wir im Museum, heute gehen wir in ein Konzert.
            Am Freitag fliegen wir nach Hause.
            Dein Kurt
        items:
          - id: l1-1
            type: true-false
            prompt: Das Wetter in Wien ist schlecht.
            answer: false
          - id: l1-2
            type: true-false
            prompt: Das Hotel ist im Zentrum.
            answer: true
          - id: l1-3
            type: true-false
            prompt: Kurt fährt am Freitag mit dem Zug nach Hause.
            answer: false

      - title: "Lesen, Teil 1 (Text 2)"
        instructions: Lesen Sie den Text und die Aufgaben. Richtig oder falsch?
        stimulus:
          kind: text
          label: E-Mail
          text: |
            Hallo Lena,
            ich komme am Samstag mit dem Bus um 14 Uhr. Kannst du mich an der Haltestelle abholen? Ich habe einen großen Koffer.
            Bis Samstag!
            Nils
        items:
          - id: l1-4
            type: true-false
            prompt: Nils kommt am Samstag mit dem Bus.
            answer: true
          - id: l1-5
            type: true-false
            prompt: Nils hat kein Gepäck.
            answer: false

      - title: "Lesen, Teil 2"
        instructions: Lesen Sie die Situationen und die Anzeigen. Wo finden Sie Informationen? Wählen Sie a oder b.
        items:
          - id: l2-1
            type: multiple-choice
            stimulus:
              kind: text
              label: Anzeigen
              text: |
                a) Hotel am Markt: Zimmer ab 89 Euro, mit Frühstück.

                b) Jugendherberge: Betten ab 25 Euro, Frühstück 6 Euro.
            prompt: Sie möchten billig übernachten.
            options: [Anzeige a, Anzeige b]
            answer: Anzeige b
            shuffle: false
          - id: l2-2
            type: multiple-choice
            stimulus:
              kind: text
              label: Anzeigen
              text: |
                a) Stadtführung zu Fuß: jeden Tag 11 Uhr, auf Deutsch und Englisch.

                b) Bootsfahrt auf dem See: nur im Sommer, 14 Uhr.
            prompt: Es ist Winter. Sie möchten die Stadt kennenlernen.
            options: [Anzeige a, Anzeige b]
            answer: Anzeige a
            shuffle: false
          - id: l2-3
            type: multiple-choice
            stimulus:
              kind: text
              label: Anzeigen
              text: |
                a) Fahrradverleih: Fahrräder pro Tag 12 Euro.

                b) Autovermietung: Autos ab 45 Euro pro Tag.
            prompt: Sie haben keinen Führerschein und möchten einen Ausflug machen.
            options: [Anzeige a, Anzeige b]
            answer: Anzeige a
            shuffle: false
          - id: l2-4
            type: multiple-choice
            stimulus:
              kind: text
              label: Anzeigen
              text: |
                a) Fundbüro am Bahnhof: Montag bis Freitag 8 bis 16 Uhr.

                b) Gepäckaufbewahrung: Schließfächer im Bahnhof, 24 Stunden.
            prompt: Sie möchten Ihren Koffer für ein paar Stunden im Bahnhof lassen.
            options: [Anzeige a, Anzeige b]
            answer: Anzeige b
            shuffle: false
          - id: l2-5
            type: multiple-choice
            stimulus:
              kind: text
              label: Anzeigen
              text: |
                a) Reisebüro Globus: Flugreisen in die ganze Welt.

                b) Busreisen Müller: Tagesausflüge in die Berge, 35 Euro.
            prompt: Sie möchten einen Tag in die Berge fahren.
            options: [Anzeige a, Anzeige b]
            answer: Anzeige b
            shuffle: false

      - title: "Lesen, Teil 3"
        instructions: Lesen Sie die Texte und die Aufgaben. Richtig oder falsch?
        items:
          - id: l3-1
            type: true-false
            stimulus:
              kind: text
              label: Am Bahnsteig
              text: "Bitte Fahrkarte vor der Fahrt am Automaten kaufen. Im Zug kein Verkauf."
            prompt: Sie können im Zug eine Fahrkarte kaufen.
            answer: false
          - id: l3-2
            type: true-false
            stimulus:
              kind: text
              label: Im Hotel
              text: "Check-out bis 11 Uhr."
            prompt: Sie müssen das Zimmer bis 11 Uhr verlassen.
            answer: true
          - id: l3-3
            type: true-false
            stimulus:
              kind: text
              label: Am Museum
              text: "Montags geschlossen. Dienstag bis Sonntag 10 bis 18 Uhr."
            prompt: Am Dienstag ist das Museum geöffnet.
            answer: true
          - id: l3-4
            type: true-false
            stimulus:
              kind: text
              label: Im Bus
              text: "Bitte vorne einsteigen und dem Fahrer die Fahrkarte zeigen."
            prompt: Man steigt im Bus hinten ein.
            answer: false
          - id: l3-5
            type: true-false
            stimulus:
              kind: text
              label: Am Parkplatz
              text: "Parken nur für Hotelgäste. Kostenlos."
            prompt: Hotelgäste bezahlen für den Parkplatz nichts.
            answer: true

  - skill: writing
    minutes: 20
    points: 25
    parts:
      - title: "Schreiben, Teil 1"
        instructions: Ihre Freundin Mariam bucht ein Hotelzimmer. Im Formular fehlen fünf Informationen. Helfen Sie ihr.
        items:
          - id: s1
            type: form
            situation: "Mariam Said und ihr Mann kommen am 10. August nach München. Sie bleiben drei Nächte und fahren am 13. August wieder nach Hause. Sie möchten ein Doppelzimmer. Mariam bezahlt mit Kreditkarte."
            fields:
              - { label: Familienname, answers: [Said] }
              - { label: Anzahl der Personen, answers: ["2", zwei] }
              - { label: Anreise, answers: ["10.08.", "10.8.", "10. August"] }
              - { label: Zimmer, answers: [Doppelzimmer] }
              - { label: Zahlungsweise, answers: [Kreditkarte, mit Kreditkarte] }

      - title: "Schreiben, Teil 2"
        instructions: Schreiben Sie zu jedem Punkt ein bis zwei Sätze (circa 30 Wörter). Vergessen Sie nicht die Anrede und den Gruß.
        items:
          - id: s2
            type: writing-task
            prompt: "Sie besuchen Ihren Freund Leon in Berlin. Schreiben Sie ihm eine E-Mail."
            points:
              - Wann kommen Sie?
              - Wie kommen Sie (Zug, Bus …)?
              - Fragen Sie, was Sie zusammen machen.
            minWords: 25
            sample: "Lieber Leon, ich komme am Freitag nach Berlin. Ich fahre mit dem Zug und bin um 18 Uhr am Hauptbahnhof. Was machen wir am Wochenende zusammen? Gehen wir ins Museum? Viele Grüße, Omar"

  - skill: speaking
    minutes: 15
    points: 25
    parts:
      - title: "Sprechen, Teil 1: sich vorstellen"
        instructions: Stellen Sie sich vor. Buchstabieren Sie danach Ihren Wohnort und sagen Sie Ihre Telefonnummer.
        items:
          - id: sp1
            type: speaking-task
            prompt: "Stellen Sie sich bitte vor. Buchstabieren Sie dann Ihren Wohnort und sagen Sie Ihre Telefonnummer."
            cards: [Name?, Alter?, Land?, Wohnort?, Sprachen?, Beruf?, Hobby?]
            checklist:
              - I said something for all seven cue words
              - I spelled the name of my town
              - I said a phone number digit by digit
            sample: "Guten Tag, mein Name ist Ivan Petrov. Ich bin einundvierzig Jahre alt und komme aus Bulgarien. Ich wohne in Ulm. Ich spreche Bulgarisch, Russisch und Deutsch. Ich bin Busfahrer. Mein Hobby ist Angeln. Ulm: U, L, M. Meine Telefonnummer ist null, sieben, drei, eins, vier, vier, zwei, acht."

      - title: "Sprechen, Teil 2: um Informationen bitten und Informationen geben"
        instructions: Stellen Sie zu jeder Karte eine Frage und antworten Sie selbst darauf.
        items:
          - id: sp2a
            type: speaking-task
            prompt: "Thema: Reisen. Stellen Sie zu jeder Karte eine Frage und geben Sie eine Antwort."
            cards: [Urlaub, Hotel, Zug]
            checklist:
              - I asked a real question for each card
              - I answered each question in a full sentence
            sample: "Wohin fahren Sie im Urlaub? Ich fahre nach Griechenland. Wohnen Sie gern im Hotel? Nein, ich wohne lieber in einer Ferienwohnung. Fahren Sie oft mit dem Zug? Ja, ich fahre jeden Tag mit dem Zug zur Arbeit."
          - id: sp2b
            type: speaking-task
            prompt: "Thema: Stadt. Stellen Sie zu jeder Karte eine Frage und geben Sie eine Antwort."
            cards: [Bahnhof, Supermarkt, Park]
            checklist:
              - I asked a real question for each card
              - I used at least two different question words
            sample: "Wo ist der Bahnhof? Der Bahnhof ist im Zentrum. Wann ist der Supermarkt geöffnet? Er ist von acht bis zwanzig Uhr geöffnet. Gehen Sie oft in den Park? Ja, am Sonntag gehe ich mit meinem Hund in den Park."

      - title: "Sprechen, Teil 3: Bitten formulieren und darauf reagieren"
        instructions: Formulieren Sie zu jeder Karte eine Bitte und reagieren Sie darauf.
        items:
          - id: sp3
            type: speaking-task
            prompt: "Formulieren Sie zu jeder Karte eine Bitte und eine Antwort."
            cards: [Koffer, Fahrkarte, Stadtplan, Foto]
            checklist:
              - I made a polite request for each card
              - I gave a response to each request
            sample: "Können Sie mir bitte mit dem Koffer helfen? Ja, natürlich. Eine Fahrkarte nach Bonn, bitte. Gern, das macht zwölf Euro. Haben Sie einen Stadtplan für mich? Ja, hier bitte. Machen Sie bitte ein Foto von uns? Klar, kein Problem."
