level: a1
title: Modelltest 08
description: >-
  A practice exam in the format of Start Deutsch 1, with the real time limits. Topics: the town,
  offices, the bank and the post office.
passMark: 60
scoring: total
modules:
  - skill: listening
    minutes: 20
    points: 25
    parts:
      - title: "Hören, Teil 1"
        instructions: Was ist richtig? Wählen Sie a, b oder c. Sie hören jeden Text zweimal.
        items:
          - id: h1-1
            type: multiple-choice
            stimulus:
              kind: audio
              label: Gespräch 1
              lines:
                - speaker: Mann
                  text: "Ich möchte diesen Brief nach Spanien schicken."
                - speaker: Frau
                  text: "Das kostet eins zehn."
            prompt: Was kostet der Brief?
            options: ["1,10 Euro", "1,00 Euro", "11 Euro"]
            answer: "1,10 Euro"
          - id: h1-2
            type: multiple-choice
            stimulus:
              kind: audio
              label: Gespräch 2
              lines:
                - speaker: Frau
                  text: "Wo ist hier eine Apotheke?"
                - speaker: Mann
                  text: "Die nächste Apotheke ist am Marktplatz, gegenüber dem Rathaus."
            prompt: Wo ist die Apotheke?
            options: [am Marktplatz, am Bahnhof, im Rathaus]
            answer: am Marktplatz
          - id: h1-3
            type: multiple-choice
            stimulus:
              kind: audio
              label: Gespräch 3
              lines:
                - speaker: Mann
                  text: "Wann ist das Bürgeramt geöffnet?"
                - speaker: Frau
                  text: "Montag bis Freitag von acht bis zwölf Uhr, am Donnerstag auch bis achtzehn Uhr."
            prompt: An welchem Tag ist das Bürgeramt bis 18 Uhr geöffnet?
            options: [am Donnerstag, am Montag, am Freitag]
            answer: am Donnerstag
          - id: h1-4
            type: multiple-choice
            stimulus:
              kind: audio
              label: Gespräch 4
              lines:
                - speaker: Frau
                  text: "Ich möchte zweihundert Euro abheben."
                - speaker: Bankangestellter
                  text: "Bitte geben Sie Ihre Karte. Und hier unterschreiben."
            prompt: Wie viel Geld möchte die Frau?
            options: ["200 Euro", "20 Euro", "2000 Euro"]
            answer: "200 Euro"
          - id: h1-5
            type: multiple-choice
            stimulus:
              kind: audio
              label: Gespräch 5
              lines:
                - speaker: Mann
                  text: "Fährt der Bus zum Krankenhaus?"
                - speaker: Frau
                  text: "Nein, das ist die Linie drei. Sie nehmen die Linie sieben."
            prompt: Welche Linie fährt zum Krankenhaus?
            options: [Linie 7, Linie 3, Linie 17]
            answer: Linie 7
          - id: h1-6
            type: multiple-choice
            stimulus:
              kind: audio
              label: Gespräch 6
              lines:
                - speaker: Frau
                  text: "Ich habe ein Paket für Herrn Lehmann. Wohnt er hier?"
                - speaker: Mann
                  text: "Ja, aber er ist nicht da. Ich nehme es."
            prompt: Wer nimmt das Paket?
            options: [der Nachbar, Herr Lehmann, die Frau]
            answer: der Nachbar

      - title: "Hören, Teil 2"
        instructions: Richtig oder falsch? Sie hören jeden Text nur einmal.
        items:
          - id: h2-1
            type: true-false
            stimulus:
              kind: audio
              label: Durchsage 1
              plays: 1
              lines:
                - text: "Die Stadtbibliothek ist wegen Renovierung bis Ende Mai geschlossen."
            prompt: Die Bibliothek ist im Mai geöffnet.
            answer: false
          - id: h2-2
            type: true-false
            stimulus:
              kind: audio
              label: Durchsage 2
              plays: 1
              lines:
                - text: "Bitte ziehen Sie eine Nummer und warten Sie. Ihre Nummer erscheint auf dem Bildschirm."
            prompt: Man muss eine Nummer ziehen.
            answer: true
          - id: h2-3
            type: true-false
            stimulus:
              kind: audio
              label: Durchsage 3
              plays: 1
              lines:
                - text: "Die Straßenbahn Linie zwei fährt heute nicht. Es gibt Busse."
            prompt: Die Linie 2 fährt heute.
            answer: false
          - id: h2-4
            type: true-false
            stimulus:
              kind: audio
              label: Durchsage 4
              plays: 1
              lines:
                - text: "Am Samstag ist Stadtfest. Die Innenstadt ist für Autos gesperrt."
            prompt: Am Samstag dürfen keine Autos in die Innenstadt.
            answer: true

      - title: "Hören, Teil 3"
        instructions: Was ist richtig? Wählen Sie a, b oder c. Sie hören jeden Text zweimal.
        items:
          - id: h3-1
            type: multiple-choice
            stimulus:
              kind: audio
              label: Nachricht 1
              lines:
                - text: "Guten Tag, hier ist die Sparkasse. Ihre neue Bankkarte ist da. Sie können sie ab morgen bei uns abholen."
            prompt: Was ist da?
            options: [die Bankkarte, der Pass, das Geld]
            answer: die Bankkarte
          - id: h3-2
            type: multiple-choice
            stimulus:
              kind: audio
              label: Nachricht 2
              lines:
                - text: "Hallo Herr Kim, hier ist das Bürgeramt. Für Ihren Termin brauchen Sie Ihren Pass und ein Foto."
            prompt: Was braucht Herr Kim?
            options: [Pass und Foto, nur den Pass, Geld]
            answer: Pass und Foto
          - id: h3-3
            type: multiple-choice
            stimulus:
              kind: audio
              label: Nachricht 3
              lines:
                - text: "Hallo Sonja, ich warte vor der Post auf dich, nicht vor der Bank. Bis gleich!"
            prompt: Wo wartet die Person?
            options: [vor der Post, vor der Bank, im Café]
            answer: vor der Post
          - id: h3-4
            type: multiple-choice
            stimulus:
              kind: audio
              label: Nachricht 4
              lines:
                - text: "Guten Morgen, hier ist die Post. Wir haben ein Paket für Sie. Sie können es bis Freitag in der Filiale abholen."
            prompt: Bis wann kann man das Paket abholen?
            options: [bis Freitag, bis Montag, bis heute Abend]
            answer: bis Freitag
          - id: h3-5
            type: multiple-choice
            stimulus:
              kind: audio
              label: Nachricht 5
              lines:
                - text: "Hi, hier ist Leo. Der Parkplatz am Kino ist voll. Ich parke in der Schillerstraße."
            prompt: Wo parkt Leo?
            options: [in der Schillerstraße, am Kino, am Bahnhof]
            answer: in der Schillerstraße

  - skill: reading
    minutes: 25
    points: 25
    parts:
      - title: "Lesen, Teil 1 (Text 1)"
        instructions: Lesen Sie den Text und die Aufgaben. Richtig oder falsch?
        stimulus:
          kind: text
          label: E-Mail
          text: |
            Hallo Dana,
            heute war ich auf dem Bürgeramt. Ich habe mich angemeldet. Das hat nur zwanzig Minuten gedauert! Danach war ich bei der Bank und habe ein Konto eröffnet.
            Morgen kaufe ich ein Fahrrad.
            Liebe Grüße
            Oskar
        items:
          - id: l1-1
            type: true-false
            prompt: Oskar war heute auf dem Bürgeramt.
            answer: true
          - id: l1-2
            type: true-false
            prompt: Auf dem Bürgeramt hat Oskar zwei Stunden gewartet.
            answer: false
          - id: l1-3
            type: true-false
            prompt: Oskar hat jetzt ein Bankkonto.
            answer: true

      - title: "Lesen, Teil 1 (Text 2)"
        instructions: Lesen Sie den Text und die Aufgaben. Richtig oder falsch?
        stimulus:
          kind: text
          label: Zettel an der Tür
          text: |
            Lieber Paketbote,
            wir sind bis 18 Uhr nicht zu Hause. Bitte geben Sie das Paket unserer Nachbarin im ersten Stock, Frau Ahmadi.
            Danke! Familie Schulz
        items:
          - id: l1-4
            type: true-false
            prompt: Familie Schulz ist zu Hause.
            answer: false
          - id: l1-5
            type: true-false
            prompt: Frau Ahmadi wohnt im ersten Stock.
            answer: true

      - title: "Lesen, Teil 2"
        instructions: Lesen Sie die Situationen und die Anzeigen. Wo finden Sie Informationen? Wählen Sie a oder b.
        items:
          - id: l2-1
            type: multiple-choice
            stimulus:
              kind: text
              label: Anzeigen
              text: |
                a) www.buergeramt-stadt.de: Termine online buchen.

                b) www.stadtbus.de: Fahrpläne und Tickets.
            prompt: Sie brauchen einen Termin für einen neuen Pass.
            options: [Anzeige a, Anzeige b]
            answer: Anzeige a
            shuffle: false
          - id: l2-2
            type: multiple-choice
            stimulus:
              kind: text
              label: Anzeigen
              text: |
                a) Bank Nord: Konto kostenlos für Studenten.

                b) Wechselstube: Geld wechseln in 30 Währungen.
            prompt: Sie möchten Euro in Dollar wechseln.
            options: [Anzeige a, Anzeige b]
            answer: Anzeige b
            shuffle: false
          - id: l2-3
            type: multiple-choice
            stimulus:
              kind: text
              label: Anzeigen
              text: |
                a) Post-Filiale im Supermarkt: Mo–Sa 8–20 Uhr.

                b) Post-Filiale am Bahnhof: Mo–Fr 9–17 Uhr.
            prompt: Sie möchten am Samstag ein Paket schicken.
            options: [Anzeige a, Anzeige b]
            answer: Anzeige a
            shuffle: false
          - id: l2-4
            type: multiple-choice
            stimulus:
              kind: text
              label: Anzeigen
              text: |
                a) Fundbüro: Haben Sie etwas verloren? Rathaus, Zimmer 12.

                b) Polizei: Notruf 110.
            prompt: Sie haben Ihren Schlüssel im Bus verloren.
            options: [Anzeige a, Anzeige b]
            answer: Anzeige a
            shuffle: false
          - id: l2-5
            type: multiple-choice
            stimulus:
              kind: text
              label: Anzeigen
              text: |
                a) Stadtbücherei: Bücher, Filme und Internet. Mitgliedschaft 10 Euro im Jahr.

                b) Buchhandlung Seite: neue Bücher und Zeitschriften.
            prompt: Sie möchten Bücher lesen, aber nicht kaufen.
            options: [Anzeige a, Anzeige b]
            answer: Anzeige a
            shuffle: false

      - title: "Lesen, Teil 3"
        instructions: Lesen Sie die Texte und die Aufgaben. Richtig oder falsch?
        items:
          - id: l3-1
            type: true-false
            stimulus:
              kind: text
              label: Am Bürgeramt
              text: "Nur mit Termin! Ohne Termin keine Bearbeitung."
            prompt: Sie können ohne Termin kommen.
            answer: false
          - id: l3-2
            type: true-false
            stimulus:
              kind: text
              label: An der Bank
              text: "Geldautomat 24 Stunden im Vorraum."
            prompt: Sie können auch nachts Geld abheben.
            answer: true
          - id: l3-3
            type: true-false
            stimulus:
              kind: text
              label: An der Haltestelle
              text: "Nachtbus N2 fährt jede Stunde."
            prompt: Nachts fährt hier kein Bus.
            answer: false
          - id: l3-4
            type: true-false
            stimulus:
              kind: text
              label: Im Rathaus
              text: "Standesamt: 3. Stock. Bitte den Aufzug benutzen."
            prompt: Das Standesamt ist im dritten Stock.
            answer: true
          - id: l3-5
            type: true-false
            stimulus:
              kind: text
              label: Auf der Post
              text: "Briefmarken auch am Automaten."
            prompt: Briefmarken gibt es nur am Schalter.
            answer: false

  - skill: writing
    minutes: 20
    points: 25
    parts:
      - title: "Schreiben, Teil 1"
        instructions: Ihr Freund Kofi meldet sich in der Stadtbibliothek an. Im Formular fehlen fünf Informationen. Helfen Sie ihm.
        items:
          - id: s1
            type: form
            situation: "Kofi Boateng ist am 9. September 1990 in Accra geboren. Er wohnt seit Januar in Mainz, Rheinstraße 40. Er ist ledig und arbeitet als Elektriker."
            fields:
              - { label: Familienname, answers: [Boateng] }
              - { label: Geburtsort, answers: [Accra] }
              - { label: "Straße, Hausnummer", answers: [Rheinstraße 40] }
              - { label: Familienstand, answers: [ledig] }
              - { label: Beruf, answers: [Elektriker] }

      - title: "Schreiben, Teil 2"
        instructions: Schreiben Sie zu jedem Punkt ein bis zwei Sätze (circa 30 Wörter). Vergessen Sie nicht die Anrede und den Gruß.
        items:
          - id: s2
            type: writing-task
            prompt: "Sie haben ein Paket für Ihre Nachbarin, Frau Werner, angenommen. Schreiben Sie ihr eine Nachricht."
            points:
              - Was haben Sie?
              - Wann sind Sie zu Hause?
              - Wo wohnen Sie?
            minWords: 25
            sample: "Liebe Frau Werner, ich habe heute ein Paket für Sie angenommen. Ich bin am Abend ab 18 Uhr zu Hause. Ich wohne im zweiten Stock, Wohnung 5. Viele Grüße, Aisha Yusuf"

  - skill: speaking
    minutes: 15
    points: 25
    parts:
      - title: "Sprechen, Teil 1: sich vorstellen"
        instructions: Stellen Sie sich vor. Buchstabieren Sie danach Ihren Familiennamen und sagen Sie Ihre Postleitzahl.
        items:
          - id: sp1
            type: speaking-task
            prompt: "Stellen Sie sich bitte vor. Buchstabieren Sie dann Ihren Familiennamen und sagen Sie Ihre Postleitzahl."
            cards: [Name?, Alter?, Land?, Wohnort?, Sprachen?, Beruf?, Hobby?]
            checklist:
              - I said something for all seven cue words
              - I spelled my surname
              - I said my postcode clearly
            sample: "Hallo, mein Name ist Elif Kaya. Ich bin vierundzwanzig Jahre alt und komme aus der Türkei. Ich wohne in Essen. Ich spreche Türkisch, Englisch und Deutsch. Ich bin Studentin. Mein Hobby ist Fotografieren. Kaya: K, A, Y, A. Meine Postleitzahl ist vier, fünf, eins, zwei, sieben."

      - title: "Sprechen, Teil 2: um Informationen bitten und Informationen geben"
        instructions: Stellen Sie zu jeder Karte eine Frage und antworten Sie selbst darauf.
        items:
          - id: sp2a
            type: speaking-task
            prompt: "Thema: In der Stadt. Stellen Sie zu jeder Karte eine Frage und geben Sie eine Antwort."
            cards: [Bus, Bank, Post]
            checklist:
              - I asked a real question for each card
              - I answered each question in a full sentence
            sample: "Fahren Sie oft mit dem Bus? Ja, jeden Tag. Wo ist Ihre Bank? Meine Bank ist im Zentrum. Gehen Sie oft zur Post? Nein, nur manchmal."
          - id: sp2b
            type: speaking-task
            prompt: "Thema: Wohnort. Stellen Sie zu jeder Karte eine Frage und geben Sie eine Antwort."
            cards: [Stadt, Nachbarn, Park]
            checklist:
              - I asked a real question for each card
              - I used at least two different question words
            sample: "Wie gefällt Ihnen Ihre Stadt? Sie gefällt mir sehr gut. Kennen Sie Ihre Nachbarn? Ja, sie sind sehr nett. Gibt es einen Park in der Nähe? Ja, der Park ist direkt hinter meinem Haus."

      - title: "Sprechen, Teil 3: Bitten formulieren und darauf reagieren"
        instructions: Formulieren Sie zu jeder Karte eine Bitte und reagieren Sie darauf.
        items:
          - id: sp3
            type: speaking-task
            prompt: "Formulieren Sie zu jeder Karte eine Bitte und eine Antwort."
            cards: [Formular, Paket, Weg, Kugelschreiber]
            checklist:
              - I made a polite request for each card
              - I gave a response to each request
            sample: "Können Sie mir bitte mit dem Formular helfen? Ja, gern. Nehmen Sie bitte mein Paket? Natürlich. Zeigen Sie mir bitte den Weg zum Bahnhof? Gehen Sie hier geradeaus. Geben Sie mir bitte einen Kugelschreiber? Hier, bitte."
