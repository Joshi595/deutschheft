level: a1
title: Modelltest 07
description: >-
  A practice exam in the format of Start Deutsch 1, with the real time limits. Topics: food,
  the market, the restaurant and cooking.
passMark: 60
scoring: total
modules:
  - skill: listening
    minutes: 20
    points: 25
    parts:
      - title: "Hören, Teil 1"
        instructions: Was ist richtig? Wählen Sie a, b oder c. Sie hören jeden Text zweimal.
        items:
          - id: h1-1
            type: multiple-choice
            stimulus:
              kind: audio
              label: Gespräch 1
              lines:
                - speaker: Verkäuferin
                  text: "Was darf es sein?"
                - speaker: Kunde
                  text: "Ich hätte gern zwei Kilo Kartoffeln und ein Kilo Tomaten."
            prompt: Wie viele Kilo Kartoffeln kauft der Mann?
            options: ["2", "1", "3"]
            answer: "2"
          - id: h1-2
            type: multiple-choice
            stimulus:
              kind: audio
              label: Gespräch 2
              lines:
                - speaker: Kellner
                  text: "Was möchten Sie trinken?"
                - speaker: Frau
                  text: "Einen Apfelsaft, bitte. Und mein Mann nimmt ein Wasser."
            prompt: Was trinkt die Frau?
            options: [Apfelsaft, Wasser, Kaffee]
            answer: Apfelsaft
          - id: h1-3
            type: multiple-choice
            stimulus:
              kind: audio
              label: Gespräch 3
              lines:
                - speaker: Mann
                  text: "Was kochen wir heute? Fisch?"
                - speaker: Frau
                  text: "Nein, Fisch hatten wir gestern. Heute machen wir Nudeln mit Gemüse."
            prompt: Was kochen sie heute?
            options: [Nudeln mit Gemüse, Fisch, Suppe]
            answer: Nudeln mit Gemüse
          - id: h1-4
            type: multiple-choice
            stimulus:
              kind: audio
              label: Gespräch 4
              lines:
                - speaker: Gast
                  text: "Die Rechnung, bitte."
                - speaker: Kellnerin
                  text: "Das macht siebzehn Euro vierzig."
            prompt: Was kostet das Essen?
            options: ["17,40 Euro", "70,40 Euro", "14,70 Euro"]
            answer: "17,40 Euro"
          - id: h1-5
            type: multiple-choice
            stimulus:
              kind: audio
              label: Gespräch 5
              lines:
                - speaker: Frau
                  text: "Wann ist der Markt?"
                - speaker: Mann
                  text: "Jeden Mittwoch und Samstag auf dem Marktplatz."
            prompt: Wann ist der Markt?
            options: [Mittwoch und Samstag, Montag und Freitag, jeden Tag]
            answer: Mittwoch und Samstag
          - id: h1-6
            type: multiple-choice
            stimulus:
              kind: audio
              label: Gespräch 6
              lines:
                - speaker: Mann
                  text: "Isst du Fleisch?"
                - speaker: Frau
                  text: "Nein, ich bin Vegetarierin. Aber ich esse gern Käse."
            prompt: Was isst die Frau nicht?
            options: [Fleisch, Käse, Gemüse]
            answer: Fleisch

      - title: "Hören, Teil 2"
        instructions: Richtig oder falsch? Sie hören jeden Text nur einmal.
        items:
          - id: h2-1
            type: true-false
            stimulus:
              kind: audio
              label: Durchsage 1
              plays: 1
              lines:
                - text: "Heute im Angebot: frische Erdbeeren, das Kilo nur drei Euro neunzig."
            prompt: Die Erdbeeren kosten heute 3,90 Euro das Kilo.
            answer: true
          - id: h2-2
            type: true-false
            stimulus:
              kind: audio
              label: Durchsage 2
              plays: 1
              lines:
                - text: "Liebe Gäste, unsere Küche schließt um zweiundzwanzig Uhr. Getränke gibt es bis Mitternacht."
            prompt: Man kann bis Mitternacht essen.
            answer: false
          - id: h2-3
            type: true-false
            stimulus:
              kind: audio
              label: Durchsage 3
              plays: 1
              lines:
                - text: "Die Bäckerei an der Ecke ist ab Montag wieder geöffnet."
            prompt: Die Bäckerei ist ab Montag geschlossen.
            answer: false
          - id: h2-4
            type: true-false
            stimulus:
              kind: audio
              label: Durchsage 4
              plays: 1
              lines:
                - text: "Achtung im Supermarkt: Kasse fünf ist jetzt geöffnet."
            prompt: Kasse 5 ist jetzt offen.
            answer: true

      - title: "Hören, Teil 3"
        instructions: Was ist richtig? Wählen Sie a, b oder c. Sie hören jeden Text zweimal.
        items:
          - id: h3-1
            type: multiple-choice
            stimulus:
              kind: audio
              label: Nachricht 1
              lines:
                - text: "Hallo Tom, wir haben keine Milch mehr. Kannst du nach der Arbeit Milch und Brot kaufen?"
            prompt: Was soll Tom kaufen?
            options: [Milch und Brot, Milch und Butter, Brot und Käse]
            answer: Milch und Brot
          - id: h3-2
            type: multiple-choice
            stimulus:
              kind: audio
              label: Nachricht 2
              lines:
                - text: "Guten Abend, hier ist das Restaurant Olivo. Ihr Tisch für vier Personen ist am Freitag um zwanzig Uhr reserviert."
            prompt: Für wie viele Personen ist der Tisch?
            options: ["4", "2", "8"]
            answer: "4"
          - id: h3-3
            type: multiple-choice
            stimulus:
              kind: audio
              label: Nachricht 3
              lines:
                - text: "Hi Sara, ich bin's, Aylin. Ich mache heute Abend Pizza. Komm doch um sieben!"
            prompt: Was macht Aylin heute Abend?
            options: [Pizza, Kuchen, Salat]
            answer: Pizza
          - id: h3-4
            type: multiple-choice
            stimulus:
              kind: audio
              label: Nachricht 4
              lines:
                - text: "Hallo, hier ist der Lieferservice. Ihr Essen kommt in zwanzig Minuten. Sie bezahlen bar beim Fahrer."
            prompt: Wann kommt das Essen?
            options: [in 20 Minuten, in 10 Minuten, in einer Stunde]
            answer: in 20 Minuten
          - id: h3-5
            type: multiple-choice
            stimulus:
              kind: audio
              label: Nachricht 5
              lines:
                - text: "Hallo Papa, für den Kuchen brauche ich noch sechs Eier und Zucker. Mehl haben wir noch."
            prompt: Was haben sie noch zu Hause?
            options: [Mehl, Eier, Zucker]
            answer: Mehl

  - skill: reading
    minutes: 25
    points: 25
    parts:
      - title: "Lesen, Teil 1 (Text 1)"
        instructions: Lesen Sie den Text und die Aufgaben. Richtig oder falsch?
        stimulus:
          kind: text
          label: E-Mail
          text: |
            Liebe Petra,
            am Sonntag kochen wir zusammen! Ich mache eine Suppe und einen Salat. Kannst du einen Nachtisch mitbringen? Mein Bruder kommt auch, er bringt Wein.
            Wir essen um 13 Uhr.
            Bis Sonntag!
            Ines
        items:
          - id: l1-1
            type: true-false
            prompt: Ines kocht eine Suppe.
            answer: true
          - id: l1-2
            type: true-false
            prompt: Petra soll Wein mitbringen.
            answer: false
          - id: l1-3
            type: true-false
            prompt: Sie essen am Sonntagmittag.
            answer: true

      - title: "Lesen, Teil 1 (Text 2)"
        instructions: Lesen Sie den Text und die Aufgaben. Richtig oder falsch?
        stimulus:
          kind: text
          label: Einkaufszettel mit Notiz
          text: |
            Hallo Felix,
            bitte kauf für heute Abend: Reis, Hähnchen, Zwiebeln und Joghurt. Die Tomaten habe ich schon gekauft.
            Danke! Mama
        items:
          - id: l1-4
            type: true-false
            prompt: Felix soll Tomaten kaufen.
            answer: false
          - id: l1-5
            type: true-false
            prompt: Felix soll Reis kaufen.
            answer: true

      - title: "Lesen, Teil 2"
        instructions: Lesen Sie die Situationen und die Anzeigen. Wo finden Sie Informationen? Wählen Sie a oder b.
        items:
          - id: l2-1
            type: multiple-choice
            stimulus:
              kind: text
              label: Anzeigen
              text: |
                a) Bio-Markt Grün: Obst und Gemüse aus der Region, Mo–Sa.

                b) Fischhaus Meer: frischer Fisch jeden Freitag.
            prompt: Sie möchten am Montag Äpfel kaufen.
            options: [Anzeige a, Anzeige b]
            answer: Anzeige a
            shuffle: false
          - id: l2-2
            type: multiple-choice
            stimulus:
              kind: text
              label: Anzeigen
              text: |
                a) Restaurant Taj: indisches Essen, auch vegetarisch.

                b) Steakhaus Texas: Fleisch vom Grill.
            prompt: Sie essen kein Fleisch und möchten essen gehen.
            options: [Anzeige a, Anzeige b]
            answer: Anzeige a
            shuffle: false
          - id: l2-3
            type: multiple-choice
            stimulus:
              kind: text
              label: Anzeigen
              text: |
                a) Kochkurs: Italienische Küche, 4 Abende, 80 Euro.

                b) Kochbuch: 100 schnelle Rezepte, 15 Euro.
            prompt: Sie möchten mit anderen Leuten zusammen kochen lernen.
            options: [Anzeige a, Anzeige b]
            answer: Anzeige a
            shuffle: false
          - id: l2-4
            type: multiple-choice
            stimulus:
              kind: text
              label: Anzeigen
              text: |
                a) Pizza-Express: Lieferung bis 23 Uhr.

                b) Imbiss am Bahnhof: Essen zum Mitnehmen bis 20 Uhr.
            prompt: Es ist 22 Uhr und Sie möchten zu Hause essen.
            options: [Anzeige a, Anzeige b]
            answer: Anzeige a
            shuffle: false
          - id: l2-5
            type: multiple-choice
            stimulus:
              kind: text
              label: Anzeigen
              text: |
                a) Café Morgen: Frühstück von 7 bis 12 Uhr.

                b) Eiscafé Venezia: Eis und Kaffee, 13 bis 22 Uhr.
            prompt: Sie möchten um 8 Uhr frühstücken.
            options: [Anzeige a, Anzeige b]
            answer: Anzeige a
            shuffle: false

      - title: "Lesen, Teil 3"
        instructions: Lesen Sie die Texte und die Aufgaben. Richtig oder falsch?
        items:
          - id: l3-1
            type: true-false
            stimulus:
              kind: text
              label: Im Restaurant
              text: "Bitte warten. Wir bringen Sie zu Ihrem Tisch."
            prompt: Sie suchen selbst einen Tisch.
            answer: false
          - id: l3-2
            type: true-false
            stimulus:
              kind: text
              label: Auf dem Markt
              text: "Bitte Obst nicht anfassen. Wir helfen Ihnen gern."
            prompt: Der Verkäufer gibt Ihnen das Obst.
            answer: true
          - id: l3-3
            type: true-false
            stimulus:
              kind: text
              label: In der Kantine
              text: "Heute: Gemüsesuppe 3,50 € – Schnitzel mit Pommes 6,90 €."
            prompt: Die Suppe kostet 6,90 Euro.
            answer: false
          - id: l3-4
            type: true-false
            stimulus:
              kind: text
              label: Am Supermarkt
              text: "Pfandflaschen bitte am Automaten links abgeben."
            prompt: Die leeren Flaschen bringen Sie zum Automaten.
            answer: true
          - id: l3-5
            type: true-false
            stimulus:
              kind: text
              label: Im Café
              text: "Kartenzahlung erst ab 10 Euro."
            prompt: Einen Kaffee für 3 Euro kann man mit Karte bezahlen.
            answer: false

  - skill: writing
    minutes: 20
    points: 25
    parts:
      - title: "Schreiben, Teil 1"
        instructions: Ihre Freundin Ewa reserviert einen Tisch im Restaurant. Im Formular fehlen fünf Informationen. Helfen Sie ihr.
        items:
          - id: s1
            type: form
            situation: "Ewa Nowak feiert am 18. Mai ihren Geburtstag im Restaurant Bella. Sie kommt mit sechs Freunden, also sind sie sieben Personen. Sie kommen um 19 Uhr. Zwei Gäste essen vegetarisch. Ewas Handynummer ist 0176 445 289."
            fields:
              - { label: Name, answers: [Nowak, Ewa Nowak] }
              - { label: Datum, answers: ["18.05.", "18.5.", "18. Mai"] }
              - { label: Uhrzeit, answers: ["19 Uhr", "19:00", "19.00"] }
              - { label: Personen, answers: ["7", sieben] }
              - { label: Telefon, answers: ["0176 445 289", "0176445289"] }

      - title: "Schreiben, Teil 2"
        instructions: Schreiben Sie zu jedem Punkt ein bis zwei Sätze (circa 30 Wörter). Vergessen Sie nicht die Anrede und den Gruß.
        items:
          - id: s2
            type: writing-task
            prompt: "Sie möchten am Samstag mit Ihren Nachbarn grillen. Schreiben Sie Ihrem Nachbarn, Herrn Fischer, eine Nachricht."
            points:
              - Laden Sie ihn ein.
              - Wann und wo?
              - Was soll er mitbringen?
            minWords: 25
            sample: "Lieber Herr Fischer, wir möchten Sie zum Grillen einladen. Wir grillen am Samstag um 18 Uhr in unserem Garten. Können Sie bitte einen Salat mitbringen? Viele Grüße, Familie Ortiz"

  - skill: speaking
    minutes: 15
    points: 25
    parts:
      - title: "Sprechen, Teil 1: sich vorstellen"
        instructions: Stellen Sie sich vor. Buchstabieren Sie danach Ihren Familiennamen und sagen Sie Ihre Telefonnummer.
        items:
          - id: sp1
            type: speaking-task
            prompt: "Stellen Sie sich bitte vor. Buchstabieren Sie dann Ihren Familiennamen und sagen Sie Ihre Telefonnummer."
            cards: [Name?, Alter?, Land?, Wohnort?, Sprachen?, Beruf?, Hobby?]
            checklist:
              - I said something for all seven cue words
              - I spelled my surname
              - I said a phone number digit by digit
            sample: "Guten Tag, ich heiße Ravi Sharma. Ich bin neununddreißig und komme aus Indien. Ich wohne in Bremen. Ich spreche Hindi, Englisch und Deutsch. Ich bin Ingenieur. Mein Hobby ist Kochen. Sharma: S, H, A, R, M, A. Meine Nummer ist null, eins, fünf, zwei, acht, acht, drei, sieben."

      - title: "Sprechen, Teil 2: um Informationen bitten und Informationen geben"
        instructions: Stellen Sie zu jeder Karte eine Frage und antworten Sie selbst darauf.
        items:
          - id: sp2a
            type: speaking-task
            prompt: "Thema: Essen und Trinken. Stellen Sie zu jeder Karte eine Frage und geben Sie eine Antwort."
            cards: [Kaffee, Obst, Kochen]
            checklist:
              - I asked a real question for each card
              - I answered each question in a full sentence
            sample: "Trinken Sie gern Kaffee? Ja, ich trinke jeden Morgen Kaffee. Welches Obst essen Sie gern? Ich esse gern Bananen. Kochen Sie oft? Ja, ich koche jeden Abend."
          - id: sp2b
            type: speaking-task
            prompt: "Thema: Einkaufen. Stellen Sie zu jeder Karte eine Frage und geben Sie eine Antwort."
            cards: [Markt, Brot, Preis]
            checklist:
              - I asked a real question for each card
              - I used at least two different question words
            sample: "Gehen Sie auf den Markt? Ja, am Samstag. Wo kaufen Sie Brot? Ich kaufe Brot in der Bäckerei. Was kostet ein Kilo Äpfel? Ein Kilo kostet zwei Euro."

      - title: "Sprechen, Teil 3: Bitten formulieren und darauf reagieren"
        instructions: Formulieren Sie zu jeder Karte eine Bitte und reagieren Sie darauf.
        items:
          - id: sp3
            type: speaking-task
            prompt: "Formulieren Sie zu jeder Karte eine Bitte und eine Antwort."
            cards: [Speisekarte, Brot, Rechnung, Zucker]
            checklist:
              - I made a polite request for each card
              - I gave a response to each request
            sample: "Bringen Sie mir bitte die Speisekarte. Ja, gern. Kann ich bitte noch etwas Brot haben? Natürlich. Die Rechnung, bitte. Sofort. Gibst du mir bitte den Zucker? Hier, bitte."
