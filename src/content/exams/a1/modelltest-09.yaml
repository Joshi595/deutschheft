level: a1
title: Modelltest 9
description: >-
  A practice exam in the format of Start Deutsch 1, with the real time limits. Topics: health,
  the doctor's, the body and the pharmacy.
passMark: 60
scoring: total
modules:
  - skill: listening
    minutes: 20
    points: 25
    parts:
      - title: "Hören, Teil 1"
        instructions: Was ist richtig? Wählen Sie a, b oder c. Sie hören jeden Text zweimal.
        items:
          - id: h1-1
            type: multiple-choice
            stimulus:
              kind: audio
              label: Gespräch 1
              lines:
                - speaker: Arzt
                  text: "Was fehlt Ihnen?"
                - speaker: Frau
                  text: "Ich habe Bauchschmerzen. Kopfschmerzen habe ich nicht."
            prompt: Was hat die Frau?
            options: [Bauchschmerzen, Kopfschmerzen, Fieber]
            answer: Bauchschmerzen
          - id: h1-2
            type: multiple-choice
            stimulus:
              kind: audio
              label: Gespräch 2
              lines:
                - speaker: Mann
                  text: "Ich brauche einen Termin beim Doktor."
                - speaker: Arzthelferin
                  text: "Morgen um neun Uhr ist noch etwas frei."
            prompt: Wann ist der Termin?
            options: ["morgen um 9 Uhr", "heute um 9 Uhr", "morgen um 19 Uhr"]
            answer: "morgen um 9 Uhr"
          - id: h1-3
            type: multiple-choice
            stimulus:
              kind: audio
              label: Gespräch 3
              lines:
                - speaker: Apothekerin
                  text: "Nehmen Sie die Tabletten dreimal am Tag nach dem Essen."
                - speaker: Mann
                  text: "Also morgens, mittags und abends. Danke."
            prompt: Wie oft nimmt der Mann die Tabletten?
            options: [dreimal am Tag, zweimal am Tag, einmal am Tag]
            answer: dreimal am Tag
          - id: h1-4
            type: multiple-choice
            stimulus:
              kind: audio
              label: Gespräch 4
              lines:
                - speaker: Frau
                  text: "Warum warst du nicht im Kurs?"
                - speaker: Mann
                  text: "Ich hatte Fieber. Aber heute geht es mir besser."
            prompt: Wie geht es dem Mann heute?
            options: [besser, schlecht, er hat Fieber]
            answer: besser
          - id: h1-5
            type: multiple-choice
            stimulus:
              kind: audio
              label: Gespräch 5
              lines:
                - speaker: Ärztin
                  text: "Wo tut es weh?"
                - speaker: Junge
                  text: "Hier, am Knie. Ich bin beim Fußball gefallen."
            prompt: Was tut dem Jungen weh?
            options: [das Knie, der Arm, der Kopf]
            answer: das Knie
          - id: h1-6
            type: multiple-choice
            stimulus:
              kind: audio
              label: Gespräch 6
              lines:
                - speaker: Mann
                  text: "Was kostet die Creme?"
                - speaker: Apothekerin
                  text: "Sechs Euro neunzig."
            prompt: Was kostet die Creme?
            options: ["6,90 Euro", "9,60 Euro", "6,19 Euro"]
            answer: "6,90 Euro"

      - title: "Hören, Teil 2"
        instructions: Richtig oder falsch? Sie hören jeden Text nur einmal.
        items:
          - id: h2-1
            type: true-false
            stimulus:
              kind: audio
              label: Ansage 1
              plays: 1
              lines:
                - text: "Hier ist die Praxis Doktor Krause. Wir haben Urlaub bis zum zehnten August."
            prompt: Die Praxis ist im Urlaub.
            answer: true
          - id: h2-2
            type: true-false
            stimulus:
              kind: audio
              label: Ansage 2
              plays: 1
              lines:
                - text: "Die Apotheke am Markt hat heute Notdienst. Sie ist die ganze Nacht geöffnet."
            prompt: Die Apotheke am Markt ist heute Nacht geschlossen.
            answer: false
          - id: h2-3
            type: true-false
            stimulus:
              kind: audio
              label: Ansage 3
              plays: 1
              lines:
                - text: "Herr Yilmaz, bitte gehen Sie in Zimmer drei."
            prompt: Herr Yilmaz soll in Zimmer 3 gehen.
            answer: true
          - id: h2-4
            type: true-false
            stimulus:
              kind: audio
              label: Ansage 4
              plays: 1
              lines:
                - text: "Im Krankenhaus ist Besuch von vierzehn bis neunzehn Uhr möglich."
            prompt: Man kann um 20 Uhr Besuch machen.
            answer: false

      - title: "Hören, Teil 3"
        instructions: Was ist richtig? Wählen Sie a, b oder c. Sie hören jeden Text zweimal.
        items:
          - id: h3-1
            type: multiple-choice
            stimulus:
              kind: audio
              label: Nachricht 1
              lines:
                - text: "Hallo Chef, hier ist Ana Lopes. Ich bin krank und bleibe heute zu Hause. Ich gehe um elf Uhr zum Arzt."
            prompt: Wann geht Ana zum Arzt?
            options: ["um 11 Uhr", "um 10 Uhr", "um 1 Uhr"]
            answer: "um 11 Uhr"
          - id: h3-2
            type: multiple-choice
            stimulus:
              kind: audio
              label: Nachricht 2
              lines:
                - text: "Guten Tag, hier ist die Zahnarztpraxis Berg. Bitte bringen Sie morgen Ihre Versichertenkarte mit."
            prompt: Was soll man mitbringen?
            options: [die Versichertenkarte, Geld, ein Foto]
            answer: die Versichertenkarte
          - id: h3-3
            type: multiple-choice
            stimulus:
              kind: audio
              label: Nachricht 3
              lines:
                - text: "Hallo Opa, hier ist Mia. Wie geht es dir? Ich besuche dich am Mittwoch im Krankenhaus."
            prompt: Wo ist der Opa?
            options: [im Krankenhaus, zu Hause, beim Arzt]
            answer: im Krankenhaus
          - id: h3-4
            type: multiple-choice
            stimulus:
              kind: audio
              label: Nachricht 4
              lines:
                - text: "Hi Jonas, mein Rücken tut weh. Ich kann heute nicht Fußball spielen. Vielleicht nächste Woche."
            prompt: Was tut weh?
            options: [der Rücken, der Fuß, der Hals]
            answer: der Rücken
          - id: h3-5
            type: multiple-choice
            stimulus:
              kind: audio
              label: Nachricht 5
              lines:
                - text: "Hallo Frau Ali, hier ist die Apotheke. Ihr Medikament ist jetzt da. Sie können es heute ab fünfzehn Uhr abholen."
            prompt: Ab wann kann Frau Ali das Medikament abholen?
            options: ["ab 15 Uhr", "ab 5 Uhr", "ab 13 Uhr"]
            answer: "ab 15 Uhr"

  - skill: reading
    minutes: 25
    points: 25
    parts:
      - title: "Lesen, Teil 1 (Text 1)"
        instructions: Lesen Sie den Text und die Aufgaben. Richtig oder falsch?
        stimulus:
          kind: text
          label: E-Mail
          text: |
            Liebe Frau Marx,
            mein Sohn Tim ist krank. Er hat Halsschmerzen und Fieber. Er kann heute und morgen nicht in die Schule kommen. Am Montag ist er wieder da.
            Mit freundlichen Grüßen
            Karin Wolf
        items:
          - id: l1-1
            type: true-false
            prompt: Tim hat Fieber.
            answer: true
          - id: l1-2
            type: true-false
            prompt: Tim kommt morgen in die Schule.
            answer: false
          - id: l1-3
            type: true-false
            prompt: Frau Marx ist die Mutter von Tim.
            answer: false

      - title: "Lesen, Teil 1 (Text 2)"
        instructions: Lesen Sie den Text und die Aufgaben. Richtig oder falsch?
        stimulus:
          kind: text
          label: Nachricht
          text: |
            Hallo Klaus,
            gute Besserung! Ich habe dir Obst und Tee gekauft. Die Tasche steht vor deiner Tür.
            Ruf mich an, wenn du etwas brauchst.
            Maria
        items:
          - id: l1-4
            type: true-false
            prompt: Maria hat Obst und Tee gekauft.
            answer: true
          - id: l1-5
            type: true-false
            prompt: Die Tasche ist in Marias Auto.
            answer: false

      - title: "Lesen, Teil 2"
        instructions: Lesen Sie die Situationen und die Anzeigen. Wo finden Sie Informationen? Wählen Sie a oder b.
        items:
          - id: l2-1
            type: multiple-choice
            stimulus:
              kind: text
              label: Anzeigen
              text: |
                a) Kinderarzt Dr. Engel: Sprechstunde Mo–Fr 8–12 Uhr.

                b) Hautarzt Dr. Stein: Sprechstunde Di und Do 14–18 Uhr.
            prompt: Ihr Kind ist krank. Es ist Mittwochmorgen.
            options: [Anzeige a, Anzeige b]
            answer: Anzeige a
            shuffle: false
          - id: l2-2
            type: multiple-choice
            stimulus:
              kind: text
              label: Anzeigen
              text: |
                a) Fitnessstudio Aktiv: Training für alle, 30 Euro im Monat.

                b) Physiotherapie Gesund: Hilfe bei Rückenschmerzen, mit Rezept vom Arzt.
            prompt: Sie haben Rückenschmerzen und ein Rezept vom Arzt.
            options: [Anzeige a, Anzeige b]
            answer: Anzeige b
            shuffle: false
          - id: l2-3
            type: multiple-choice
            stimulus:
              kind: text
              label: Anzeigen
              text: |
                a) Notarzt: Telefon 112.

                b) Ärztlicher Bereitschaftsdienst: nachts und am Wochenende, Telefon 116 117.
            prompt: Es ist Samstagabend, Sie haben hohes Fieber, aber es ist kein Notfall.
            options: [Anzeige a, Anzeige b]
            answer: Anzeige b
            shuffle: false
          - id: l2-4
            type: multiple-choice
            stimulus:
              kind: text
              label: Anzeigen
              text: |
                a) Yoga-Kurs: Entspannung für Körper und Kopf, Montag 19 Uhr.

                b) Erste-Hilfe-Kurs: Was tun bei einem Unfall? Samstag 9–16 Uhr.
            prompt: Sie möchten lernen, wie man bei einem Unfall hilft.
            options: [Anzeige a, Anzeige b]
            answer: Anzeige b
            shuffle: false
          - id: l2-5
            type: multiple-choice
            stimulus:
              kind: text
              label: Anzeigen
              text: |
                a) Augenoptiker Klarblick: Brillen und Sehtest.

                b) Hörgeräte Ohr: Hörtest kostenlos.
            prompt: Sie sehen schlecht und brauchen eine Brille.
            options: [Anzeige a, Anzeige b]
            answer: Anzeige a
            shuffle: false

      - title: "Lesen, Teil 3"
        instructions: Lesen Sie die Texte und die Aufgaben. Richtig oder falsch?
        items:
          - id: l3-1
            type: true-false
            stimulus:
              kind: text
              label: In der Praxis
              text: "Bitte melden Sie sich zuerst an der Rezeption an."
            prompt: Sie gehen zuerst zur Rezeption.
            answer: true
          - id: l3-2
            type: true-false
            stimulus:
              kind: text
              label: Auf der Tablettenpackung
              text: "Kinder unter 12 Jahren: nur nach Rücksprache mit dem Arzt."
            prompt: Ein Kind (8 Jahre) kann die Tabletten einfach nehmen.
            answer: false
          - id: l3-3
            type: true-false
            stimulus:
              kind: text
              label: Im Krankenhaus
              text: "Handys bitte ausschalten."
            prompt: Sie dürfen hier mit dem Handy telefonieren.
            answer: false
          - id: l3-4
            type: true-false
            stimulus:
              kind: text
              label: An der Apotheke
              text: "Mittagspause 13 bis 14 Uhr."
            prompt: Um 13:30 Uhr ist die Apotheke geschlossen.
            answer: true
          - id: l3-5
            type: true-false
            stimulus:
              kind: text
              label: In der Praxis
              text: "Neue Patienten bitte Versichertenkarte mitbringen."
            prompt: Neue Patienten brauchen ihre Versichertenkarte.
            answer: true

  - skill: writing
    minutes: 20
    points: 25
    parts:
      - title: "Schreiben, Teil 1"
        instructions: Ihre Freundin Mei ist zum ersten Mal beim Arzt. Im Formular fehlen fünf Informationen. Helfen Sie ihr.
        items:
          - id: s1
            type: form
            situation: "Mei Chen ist 27 Jahre alt. Sie ist am 30. November geboren und wohnt in Dresden. Sie ist bei der AOK versichert. Sie hat Kopfschmerzen und ist allergisch gegen Penizillin."
            fields:
              - { label: Familienname, answers: [Chen] }
              - { label: Alter, answers: ["27"] }
              - { label: Krankenkasse, answers: [AOK] }
              - { label: Beschwerden, answers: [Kopfschmerzen] }
              - { label: Allergien, answers: [Penizillin] }

      - title: "Schreiben, Teil 2"
        instructions: Schreiben Sie zu jedem Punkt ein bis zwei Sätze (circa 30 Wörter). Vergessen Sie nicht die Anrede und den Gruß.
        items:
          - id: s2
            type: writing-task
            prompt: "Ihr Freund Paul liegt im Krankenhaus. Schreiben Sie ihm eine Nachricht."
            points:
              - Fragen Sie, wie es ihm geht.
              - Sagen Sie, wann Sie ihn besuchen.
              - Fragen Sie, was Sie mitbringen sollen.
            minWords: 25
            sample: "Lieber Paul, wie geht es dir? Ich hoffe, es geht dir schon besser. Ich besuche dich am Donnerstag um 16 Uhr. Was soll ich mitbringen? Möchtest du Obst oder eine Zeitschrift? Viele Grüße, Hassan"

  - skill: speaking
    minutes: 15
    points: 25
    parts:
      - title: "Sprechen, Teil 1: sich vorstellen"
        instructions: Stellen Sie sich vor. Buchstabieren Sie danach Ihren Vornamen und sagen Sie Ihre Telefonnummer.
        items:
          - id: sp1
            type: speaking-task
            prompt: "Stellen Sie sich bitte vor. Buchstabieren Sie dann Ihren Vornamen und sagen Sie Ihre Telefonnummer."
            cards: [Name?, Alter?, Land?, Wohnort?, Sprachen?, Beruf?, Hobby?]
            checklist:
              - I said something for all seven cue words
              - I spelled my first name
              - I said a phone number digit by digit
            sample: "Guten Tag, ich heiße Omar Farouk. Ich bin fünfundvierzig Jahre alt und komme aus Ägypten. Ich wohne in Hannover. Ich spreche Arabisch, Englisch und Deutsch. Ich bin Taxifahrer. Mein Hobby ist Schach. Omar: O, M, A, R. Meine Nummer ist null, fünf, eins, eins, sechs, sieben, vier, zwei."

      - title: "Sprechen, Teil 2: um Informationen bitten und Informationen geben"
        instructions: Stellen Sie zu jeder Karte eine Frage und antworten Sie selbst darauf.
        items:
          - id: sp2a
            type: speaking-task
            prompt: "Thema: Gesundheit. Stellen Sie zu jeder Karte eine Frage und geben Sie eine Antwort."
            cards: [Arzt, Sport, Schlafen]
            checklist:
              - I asked a real question for each card
              - I answered each question in a full sentence
            sample: "Wie oft gehen Sie zum Arzt? Nur einmal im Jahr. Machen Sie Sport? Ja, ich gehe zweimal pro Woche joggen. Wie lange schlafen Sie? Ich schlafe sieben Stunden."
          - id: sp2b
            type: speaking-task
            prompt: "Thema: Körper. Stellen Sie zu jeder Karte eine Frage und geben Sie eine Antwort."
            cards: [Kopfschmerzen, Brille, Zähne]
            checklist:
              - I asked a real question for each card
              - I used at least two different question words
            sample: "Was machen Sie bei Kopfschmerzen? Ich trinke Wasser und schlafe. Tragen Sie eine Brille? Nein, ich trage keine Brille. Wann gehen Sie zum Zahnarzt? Ich gehe im Frühling zum Zahnarzt."

      - title: "Sprechen, Teil 3: Bitten formulieren und darauf reagieren"
        instructions: Formulieren Sie zu jeder Karte eine Bitte und reagieren Sie darauf.
        items:
          - id: sp3
            type: speaking-task
            prompt: "Formulieren Sie zu jeder Karte eine Bitte und eine Antwort."
            cards: [Termin, Tee, Fenster, Medikament]
            checklist:
              - I made a polite request for each card
              - I gave a response to each request
            sample: "Ich möchte bitte einen Termin. Ja, morgen um zehn Uhr. Machst du mir bitte einen Tee? Gern. Machen Sie bitte das Fenster zu. Natürlich. Holen Sie mir bitte das Medikament aus der Apotheke? Tut mir leid, ich habe keine Zeit."
