  - skill: writing
    minutes: 60
    points: 25
    parts:
      - title: "Schreiben, Teil 1"
        instructions: Schreiben Sie eine E-Mail (circa 80 Wörter). Schreiben Sie etwas zu allen drei Punkten. Zeit – circa 20 Minuten.
        items:
          - id: s1
            type: writing-task
            prompt: "Sie haben vor Kurzem eine neue Stelle angefangen. Ihre Freundin Carla möchte wissen, wie es Ihnen geht. Schreiben Sie Carla eine E-Mail: Beschreiben Sie Ihre neue Arbeit. Begründen Sie, warum Sie die Stelle gewechselt haben. Machen Sie einen Vorschlag für ein Treffen."
            points:
              - die neue Arbeit beschreiben
              - Grund für den Wechsel
              - Vorschlag für ein Treffen
            minWords: 70
            sample: "Liebe Carla, danke für deine Nachricht! Seit drei Wochen arbeite ich jetzt in einem Architekturbüro im Zentrum. Ich plane dort Wohnungen und arbeite in einem kleinen, sehr netten Team. Ich habe die Stelle gewechselt, weil ich in der alten Firma nur Büroarbeit gemacht habe und mich nicht weiterentwickeln konnte. Hier darf ich eigene Projekte machen, und das macht mir viel Spaß. Hast du nächsten Samstag Zeit? Dann könnten wir zusammen frühstücken und ich erzähle dir mehr. Liebe Grüße, Elif"

      - title: "Schreiben, Teil 2"
        instructions: Schreiben Sie Ihre Meinung (circa 80 Wörter). Zeit – circa 25 Minuten.
        items:
          - id: s2
            type: writing-task
            prompt: "Sie haben im Radio eine Sendung zum Thema 'Lieber studieren oder eine Ausbildung machen?' gehört. Im Online-Gästebuch der Sendung schreibt Kevin: 'Ohne Studium hat man heute keine Chance auf einen guten Job.' Schreiben Sie Ihre Meinung."
            points:
              - auf Kevins Aussage reagieren
              - eigene Meinung mit Begründung
              - Beispiel oder Erfahrung
              - Schluss
            minWords: 70
            sample: "Kevin schreibt, dass man ohne Studium keine Chance auf einen guten Job hat. Da bin ich anderer Meinung. Meiner Meinung nach kann eine Ausbildung genauso gut sein, weil man von Anfang an Geld verdient und viel Praxis bekommt. Mein Bruder ist zum Beispiel Elektriker geworden und hat heute seine eigene Firma. Er verdient mehr als viele seiner Freunde mit Studium. Zwar braucht man für manche Berufe ein Studium, aber nicht für alle. Deshalb sollte jeder das wählen, was zu ihm passt."

      - title: "Schreiben, Teil 3"
        instructions: Schreiben Sie eine E-Mail (circa 40 Wörter). Zeit – circa 15 Minuten.
        items:
          - id: s3
            type: writing-task
            prompt: "Ihr Teamleiter, Herr Krause, hat Sie gebeten, am Samstag bei einer Messe zu helfen. Sie können nicht. Schreiben Sie Herrn Krause. Entschuldigen Sie sich höflich und schlagen Sie eine andere Lösung vor."
            points:
              - Entschuldigung
              - andere Lösung
            minWords: 35
            sample: "Sehr geehrter Herr Krause, vielen Dank für Ihre Anfrage. Leider kann ich am Samstag nicht bei der Messe helfen, da ich schon lange einen Familientermin geplant habe. Es tut mir sehr leid. Ich könnte aber am Freitag die Vorbereitung übernehmen. Mit freundlichen Grüßen, Tomás Rivera"

  - skill: speaking
    minutes: 15
    points: 25
    parts:
      - title: "Sprechen, Teil 1: gemeinsam etwas planen"
        instructions: Sie möchten mit Ihrem Partner / Ihrer Partnerin für einen Kollegen, der in Rente geht, eine Abschiedsfeier organisieren. Sprechen Sie über die Punkte unten.
        items:
          - id: sp1
            type: speaking-task
            prompt: "Planen Sie gemeinsam eine Abschiedsfeier für einen Kollegen."
            cards: [Wann und wo?, Wer wird eingeladen?, Essen und Getränke?, Geschenk?, Wer macht was?]
            checklist:
              - I made suggestions for every point
              - I reacted to my partner's suggestions, with reasons
              - I disagreed politely at least once
              - We reached a decision on each point
            sample: "– Was hältst du davon, wenn wir die Feier am letzten Arbeitstag von Herrn Busch machen, im Besprechungsraum? – Gute Idee, aber der Raum ist klein. Wir laden ja die ganze Abteilung ein. Lieber in der Kantine. – Einverstanden. Und das Essen? Wir könnten einen Partyservice bestellen. – Das ist teuer. Vielleicht bringt jeder etwas mit? – Gut. Als Geschenk könnten wir ihm einen Gutschein für eine Ballonfahrt schenken, er hat davon erzählt. – Super! Ich sammle das Geld, und du kümmerst dich um die Einladung."

      - title: "Sprechen, Teil 2: ein Thema präsentieren"
        instructions: Sie sollen Ihren Zuhörern ein aktuelles Thema präsentieren. Folgen Sie den fünf Folien.
        items:
          - id: sp2
            type: speaking-task
            prompt: "Thema: 'Sollte man mehrmals im Leben den Beruf wechseln?'"
            cards: [Thema und Struktur, meine persönlichen Erfahrungen, die Situation in meinem Heimatland, Vor- und Nachteile + meine Meinung, Abschluss und Dank]
            checklist:
              - I followed the five slides in order
              - I gave a personal example
              - I described the situation in my home country
              - I gave pros, cons and my opinion with reasons
              - I spoke for about three minutes
            sample: "Ich möchte heute über das Thema 'Berufswechsel' sprechen. Zuerst erzähle ich von meinen Erfahrungen, dann von der Situation in meinem Heimatland, und am Ende spreche ich über Vor- und Nachteile. Ich selbst war zuerst Lehrerin und arbeite jetzt in einer Softwarefirma. In meinem Heimatland Polen bleiben ältere Menschen oft ihr ganzes Leben im selben Beruf, aber junge Leute wechseln immer häufiger. Ein Vorteil ist, dass man Neues lernt und motiviert bleibt. Ein Nachteil ist, dass man am Anfang wenig verdient und wieder von vorn beginnt. Meiner Meinung nach ist ein Wechsel sinnvoll, wenn man unzufrieden ist. Zum Schluss möchte ich sagen: Es ist nie zu spät für etwas Neues. Vielen Dank für Ihre Aufmerksamkeit."

      - title: "Sprechen, Teil 3: über ein Thema sprechen"
        instructions: Reagieren Sie auf die Präsentation Ihres Partners / Ihrer Partnerin. Beantworten Sie dann eine Frage zu Ihrer eigenen Präsentation.
        items:
          - id: sp3
            type: speaking-task
            prompt: "Ihr Partner / Ihre Partnerin hat das Thema 'Teilzeit für Väter' präsentiert. Geben Sie eine Rückmeldung und stellen Sie eine Frage. Beantworten Sie dann die Frage: 'Was war am schwierigsten bei Ihrem Berufswechsel?'"
            cards: [Dank, Rückmeldung, Frage, Antwort]
            checklist:
              - I thanked my partner and said something specific I liked
              - I asked a real question about the presentation
              - I answered the question about my own presentation
            sample: "Vielen Dank für deine Präsentation. Besonders interessant fand ich, dass in deiner Firma schon viele Väter Teilzeit arbeiten. Ich habe eine Frage: Haben die Väter dadurch Nachteile bei der Karriere? … Zu Ihrer Frage: Am schwierigsten war für mich, dass ich am Anfang viel weniger verdient habe. Wir mussten ein Jahr sehr sparsam leben, aber das hat sich gelohnt."
