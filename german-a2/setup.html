<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Setup - German A2 Course</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            padding: 50px;
            max-width: 500px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .status {
            font-size: 60px;
            margin-bottom: 20px;
        }

        h1 {
            color: #1e40af;
            margin-bottom: 10px;
            font-size: 28px;
        }

        p {
            color: #666;
            margin: 15px 0;
            font-size: 16px;
            line-height: 1.6;
        }

        .success {
            background: #d1fae5;
            border-left: 4px solid #10b981;
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
            color: #047857;
        }

        .button {
            background: #667eea;
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 20px;
            transition: all 0.3s;
            text-decoration: none;
            display: inline-block;
        }

        .button:hover {
            background: #764ba2;
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #667eea;
            border-top: 3px solid transparent;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .features {
            text-align: left;
            background: #f9fafb;
            padding: 20px;
            border-radius: 10px;
            margin: 20px 0;
            font-size: 14px;
        }

        .features li {
            list-style: none;
            padding: 8px 0;
            color: #555;
        }

        .features li:before {
            content: "✅ ";
            color: #10b981;
            font-weight: bold;
            margin-right: 8px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="status" id="status">⏳</div>
        <h1 id="title">Setting up AI Learning...</h1>
        <p id="message">Configuring your Groq API key...</p>

        <div class="features" id="features" style="display: none;">
            <h3 style="color: #667eea; margin-bottom: 10px;">What's enabled:</h3>
            <ul>
                <li>Infinite answer variations</li>
                <li>Intelligent feedback</li>
                <li>Smart German validation</li>
                <li>Lightning-fast responses</li>
            </ul>
        </div>

        <button class="button" id="nextBtn" style="display: none;" onclick="goToChapter()">
            Start Learning 🚀
        </button>
    </div>

    <script>
        function setupAPIKey() {
            try {
                // Set the API key
                localStorage.setItem('groqApiKey', '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');
                
                // Verify it was set
                const stored = localStorage.getItem('groqApiKey');
                
                if (stored) {
                    // Success!
                    document.getElementById('status').textContent = '✅';
                    document.getElementById('title').textContent = 'AI Setup Complete!';
                    document.getElementById('message').innerHTML = '<strong>Your Groq API key is ready!</strong><br>Fill-in-the-blanks exercises now have intelligent validation.';
                    document.getElementById('features').style.display = 'block';
                    document.getElementById('nextBtn').style.display = 'inline-block';
                    
                    // Optionally auto-redirect after 3 seconds
                    setTimeout(() => {
                        // User can click button manually
                    }, 2000);
                } else {
                    throw new Error('Failed to store API key');
                }
            } catch (error) {
                document.getElementById('status').textContent = '⚠️';
                document.getElementById('title').textContent = 'Setup Issue';
                document.getElementById('message').innerHTML = `<strong>Error:</strong> ${error.message}<br><br>Please try again or check browser settings.`;
                document.getElementById('nextBtn').style.display = 'inline-block';
                document.getElementById('nextBtn').textContent = 'Retry Setup';
            }
        }

        function goToChapter() {
            window.location.href = './chapters/chapter1.html';
        }

        // Run setup when page loads
        window.addEventListener('DOMContentLoaded', setupAPIKey);
    </script>
</body>
</html>
